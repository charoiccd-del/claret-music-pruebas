</style></head><body><div id="app"><header><select id="songSelect" aria-label="Seleccionar canción"><option>Cargando canciones...</option></select><button id="smaller">A−</button><button id="bigger">A+</button></header><div class="heading" id="heading">Claret Music · Prueba general de alineación</div><div class="note">Prueba independiente: no modifica tu aplicación</div><main id="paper" aria-live="polite"><div class="line chord">LA      do#m      RE       sim</div><div class="line">Espíritu, abre una grieta en mi alma</div><div class="line">Cargando el catálogo en el navegador...</div></main><footer class="pageControls"><button id="prev">← Anterior</button><span id="count">1 / 1</span><button id="next">Siguiente →</button></footer></div><script>
const songs=[{"title": "Caminar en misión (demostración)", "page": "demo", "body": "DO                 SOL\nCaminamos compartiendo,\nlam                FA\nuna luz en el corazón.\nDO                 SOL\nCada voz se hace camino,\nFA        SOL       DO\ny la música es unión."}, {"title": "Juntos en comunidad (demostración)", "page": "demo", "body": "SOL             RE\nEn la mesa hay un lugar,\nmim              DO\npara escuchar y compartir.\nSOL              RE\nCada paso es un cantar,\nDO       RE       SOL\ny un motivo para servir."}, {"title": "ABRE UNA GRIETA", "page": 6, "body": "LA          do#m         RE      sim\nEspíritu, abre una grieta en mi alma dormida,\n             MI    RE   MI\ntransfórmala en nueva, Espíritu del Dios de la\nLA/7\nvida.\nEspíritu, enciende una hoguera para cada  silla que impide mi entrega.\nEspíritu, que te sienta muy cerca. Espíritu, que te sienta muy cerca."}, {"title": "¿A DÓNDE VAS?", "page": 6, "body": "lam         -SOL     mim-lam        SOL-mim lam\n¿A dónde vas? ¿A dónde vas? Llévame junto a Ti. Dentro de mi ser tengo\nSOL-mim    lam   -SOL\nfrío, ¿a dónde vas?\n   mim  lam         SOL             mim     LA\nMás allá de la eternidad, en la eternidad, donde no pueda ver con mi\n       SOL-mim   LA-SOL mim lam           SOL    -mim\nmente, Señor, llévame Tú. Tomaré la ruta contigo, buscaré mi paz,\n     LA     -SOL     mim LA        SOL        mim\nbuscaré mi paz. Por los senderos en que Tú caminarás (caminarás), quiero\nLA     -lam\ncaminar.\n              SOL      mim        lam\nY por todos los senderos, (y por todos los senderos) seguiremos\n    SOL-mim      lam               SOL  -mim  lam\ncaminando como podamos. Y cuando pueda ver la luz, déjame que yo te\n       SOL     mim    lam      -SOL\ncante así: Gracias, Señor. Cogeré tu mano.\n       mim\nMe alegraré (me alegraré) que estés allí (que estés allí)...\n    lam       SOL-mim\nA mi lado / a tu lado. (X3)"}, {"title": "ADORAMUS TE DOMINE", "page": 7, "body": "SOL RE mim\nUh, uh, uh.\nDO      RE    SOL/RE\nAdoramus te domine."}, {"title": "ADORARÉ", "page": 7, "body": "mim          RE       SOL        RE          mim\nAdoraré tus pies heridos, tus pies de mensajero, que traen la paz\n         SOL        RE\nque traen la paz a mi corazón.\nAdoraré tus  rodillas, que soportaron mis caídas. y se doblaron, y se\ndoblaron ante mí.\nAdoraré tus manos suaves y las heridas que las traspasan. Con ellas me\nalzaste y me abrazaste en mi seol.\nAdoraré tu rostro herido, tu semblante sin hermosura. Y en cada espina de\ntu cabeza veré a mi Dios.\nAbrazaré fuerte tu pecho y escucharé tus latidos, y de la herida de tu\ncostado yo beberé.\n       DO                       mim\nYO ADORARÉ, SEÑOR, Y ABRAZARÉ TU CUERPO HERIDO.\n       DO                   RE\nYO ADORARÉ, SEÑOR, Y ABRAZARÉ TU CRUZ,\n       DO         mim\nTU HUMANIDAD, TU HUMANIDAD. (BIS)"}, {"title": "AGUA LÁVAME", "page": 7, "body": "LA         RE    LA RE            LA\nAgua lávame, purifícame. Dame agua, tu Espíritu,\nRE   MI LA\nagua lávame."}, {"title": "AL CALOR DE LA PALABRA", "page": 8, "body": "DO-FA           DO-FA       DO        mi     lam\nCerca del hogar que calienta mi alma quiero yo saber lo que en comunidad\n         RE-SOL\nTú quieres de mí.\nSintiendo el calor que me da tu palabra, quiero responder a lo que me\n            rem           SOL-7\npides sin que a nada yo pueda temer.\n          lam-FA             DO-FA         DO\nA NADA, A NADA, NUNCA HE DE TEMER. YENDO JUNTO A TI, CON TUS OJOS\n  SOL              DO/MI7\nDE FE, NUNCA HE DE TEMER. (BIS)\nSolo he de beber de tu fuente de agua, sé que solo ella será la que sacie mi\nhambre y mi sed.\nTú eres el Señor que alimenta mi alma y si hago mi opción por seguirte a ti\nnunca jamás yo temeré.\nA NADA, A NADA...\nLlegan hasta mí momentos sin calma, que me hacen dudar de si mi camino\nse orienta hacia ti.\nComienza a  faltar  la paz en mi alma,  y  sin esperarlo apareces Tú\nhaciéndome ver que ha nada he de temer.\nA NADA, A NADA..."}, {"title": "ALELUYA 1", "page": 8, "body": "lam SOL lam  DO-RE-MI-7\nAleluya, Aleluya, Aleluuuuya.\n   lam SOL lam  MI lam\nAleluya, Aleluya, Aleluuya.\nrem-lam           MI lam\n(Antífona, 1ª parte) Aleluuya\nrem-lam           DO     RE     MI-7\n(Antífona, 2ª parte) Demos Gracias a Nuestro Dios."}, {"title": "ALELUYA 2", "page": 9, "body": "lam    DO    FA-SOL-DO-MI"}, {"title": "ALELUYA-ALELU", "page": 9, "body": "lam    DO    FA-SOL-lam\nAleluya, Aleluya, Aleluuya.\nlam                                     MI\nGloria al Padre y al Hijo y al Espíritu Santo, Aleluuuya.\n\nALELUYA - ALELU\nDO SOL  FA   DO  FA DO  rem-SOL7\nAleluya, Alelu-Aleluya.   Aleluya, Aleluya.\nDO SOL  FA   DO  FA DO  SOL-DO\nAleluya, Alelu-Aleluya.   Aleluya, Aleluya."}, {"title": "ALELUYA - Cohen", "page": 9, "body": "DO        lam      DO      lam\nPadre, yo te quiero amar, y tocar tu corazón,\n    FA       SOL   DO    SOL\ny rendirme a tus pies, oh Señor.\nDO         FA  SOL lam      FA\nQuiero estar cerca de ti, y adorarte oh Señor,\n    SOL     MI   lam\ny rendirte toda gloria, Aleluya.\n   FA       lam\nALELUYA, ALELUYA.\n   FA      DO-SOL (-DO)\nALELUYA, ALELUYA.\nCuando sienta yo caer, firme en ti estaré, pues Tú eres mi refugio, oh Señor.\nNo importa donde pueda estar, en valles de dificultad. Te adoraré cantando\nAleluya.\nALELUYA, ALELUYA.\nALELUYA, ALELUYA."}, {"title": "ALELUYA - El Señor es mi Señor", "page": 10, "body": "MI-LA-MI-sol#m-do#m-LA-SI7\nAAAAAA...LELUYA. (ALELUYA...AA)\nMI-LA-MI-sol#m-do#m-LA-SI7-MI\nAAAAAA...LELUYA\nMI   LA    MI   LA  MI     LA     SI7 (-MI-LA-MI-LA)\nEl Señor es mi Señor, Aleluya cantaré a mi Dios (a mi Dios). El Señor es mi\nSeñor, cantaré eternamente al Creador"}, {"title": "ALELUYA - Nico", "page": 10, "body": "RE  LA  FA#M sim   SOL     RE\nALELUYA, ALELUYA, ALELUYA, ALELUYA.\nSOL-LA7-RE   -LA7\nALELUYA. (BIS)\nSi sientes que Cristo en ti vivo está grita fuerte en tu alma: ¡Aleluya!\nSi piensas que el mundo aún puede cambiar, grita fuerte en tu alma:\n¡Aleluya!"}, {"title": "ALELUYA - Verbum Panis", "page": 10, "body": "lam DO   rem SOL  lam DO   rem-SOL-lam\nALELUYA, ALELUUYA.   ALELUYA, ALELUUYA. (BIS)\nlam                  rem SOL lam\nAleluya, Aleluya, Aleluya, Aleluya, Aleluya. (Bis)"}, {"title": "ALELUYA DE LA TIERRA", "page": 11, "body": "SOL           DO6      /RE/         SOL   DO\n¿Quién quiere resucitar a este mundo que se muere? ¿Quién cantará el\n  lam       RE         SOL-DO-SOL    SOL-DO-RE-DO\naleluya de esta nueva luz que viene? ¿Quién cuando mire la tierra y las\n  lam      SI7              mim    LA7          RE\ntragedias observe sentirá en su corazón el dolor de quien se muere?\n             DO      RE        MI7 lam\n¿Quién es capaz de salvar a este mundo decadente, y mantiene la\n    RE      DO    RE  DO     -SOL\nesperanza de los muchos que la pierden?\n     DO   RE    SOL        RE        SOL SOL-DO-RE-DO\nEL QUE SUFRE, MATA Y MUERE, DESESPERA Y ENLOQUECE, Y OTROS SON\n  RE  mim         lam6-RE-SOL\nESPECTADORES, NO LO SIENTEN.\n     DO   RE    SOL        RE   SI7   mim  SOL7   DO\nEL QUE SUFRE, MATA Y MUERE, DESESPERA Y ENLOQUECE, Y OTROS SON\n   RE  SOL         RE-SOL\nESPECTADORES, NO LO SIENTEN.\n¿Quién bajará de la cruz a tanto Cristo sufriente mientras los hombres\nmiramos impasivos e indolentes? ¿Quién grita desde el silencio de un ser\nque a su Dios retiene, porque se hace palabra que sin hablar se  la\nentiende? ¿Quién se torna en aleluya porque traduce la muerte, como el\ntrigo que se pudre y de uno cientos vienen?\nALELUYA CANTARÁ QUIÉN PERDIÓ LA ESPERANZA, Y LA TIERRA SONREIRÁ,\n¡ALELUYA! (BIS)"}, {"title": "ALELUYA, GLORIA, ALELUYA", "page": 11, "body": "DO\nAleluya, Gloria, Aleluya.\nlam\nAleluya, Gloria, Aleluya.\nFA\nAleluya, Gloria, Aleluya.\nSOL    -7\nAleluya, Gloria, Aleluya."}, {"title": "ALMA MISIONERA", "page": 12, "body": "MI-SI7           do#m-LA             MI-LA                 SI7\nSeñor toma mi vida nueva antes de que la espera desgaste años en mí.\nMI-SI7              do#m-LA              MI\nEstoy dispuesto a lo que quieras, no importa lo que sea,\nLA      SI7    MI-SI7\nTú llámame a servir.\nLLÉVAME DONDE LOS HOMBRES NECESITEN TUS PALABRAS, NECESITEN\nMIS GANAS DE VIVIR. DONDE FALTE LA ESPERANZA, DONDE TODO SEA\nTRISTE SIMPLEMENTE POR NO SABER DE TI.\nTe doy mi corazón sincero para gritar sin miedo lo hermoso que es tu\namor. Señor tengo alma misionera condúceme a la tierra que tenga sed de\nti.\nLLÉVAME...\nY así en marcha iré cantando, por pueblos predicando tu grandeza Señor.\nTendré mis brazos sin cansancio, tu historia entre mis labios, la fuerza en la\noración.\nLLÉVAME...\n      MI    LA        lam   MI\nSIMPLEMENTE POR NO SABER DE TI."}, {"title": "AL SEÑOR CANTAD", "page": 12, "body": "mim                 DO                            SI7\nSeñor, queremos darte gracias porque has entrado en nuestra vida.\nmim              DO         RE    mim\nDe nuestro corazón renace el gozo de cantar: ¡Aleluya!\n            lam          RE7  SOL    DO    SI7     mim\nAL SEÑOR CANTAD PORQUE ESTÁ AQUÍ, AL SEÑOR GRITAD: ¡ALELUYA! (BIS)\nA  ti, Señor, esta canción de paz. Has hecho grandes maravillas. Nos has\ncreado para amarte y unirnos en tu amor: ¡Aleluya!\nAL SEÑOR CANTAD...\nAcuérdate de nuestros padres. Su fe alimenta nuestra vida. Ya no son ellos,\nsomos todos. En ti creemos hoy: ¡Aleluya!\nAL SEÑOR CANTAD..."}, {"title": "AMANDO HASTA EL EXTREMO", "page": 13, "body": "lam    DO               lam            DO\nDéjame Señor mirarte bien por dentro, entrar en tu corazón y dejarme\n    FA                  SOL              mim\nseducir. Y que aumenten mis deseos de querer ser como Tú, conocerte\n     DO      mim       lam          FA       fam\ninternamente, amarte y seguirte más. Apostar mi vida junto a ti. Déjame\n       lam\nverte Señor.\n                  FA             DO\nAMANDO HASTA EL EXTREMO, DEJÁNDOTE LA PIEL, ENTREGANDO LAS\n  SOL          MI           lam\nENTRAÑAS, TUS ENTRAÑAS DE MUJER. EN UNA TOALLA Y UN LEBRILLO, EN\nUN ACARICIAR LOS PIES, EN UN MIRARNOS HASTA EL FONDO SIN NADA\nQUE REPROCHAR\n    SOL        FA                   lam   -DO-lam-DO\nY SIN NADA QUE PEDIR, Y CON TANTO PARA DAR.\nYo, el Maestro y el Señor, ya no puedo amaros más, pues como el Padre me\nha amado así os he amado yo. Os dejo mi vida entera en este vino y este\npan. Este pan que soy yo mismo, que me parto y que me doy. Mi deseo es\nque os améis de corazón. Yo también os quiero ver.\nAMANDO HASTA EL EXTREMO, DEJÁNDOOS LA PIEL, ENTREGANDO LAS\nENTRAÑAS, COMO LO HACE UNA MUJER. EN UNA TOALLA Y UN LEBRILLO,\nEN UN ACARICIAR LOS PIES, EN UN MIRAROS HASTA EL FONDO SIN NADA\nQUE REPROCHAR Y SIN NADA QUE PEDIR, Y CON TANTO PARA DAR.\nSí, te doy todo lo que soy para que sigas amando. La lucha por la justicia\nentra en esta intimidad, que se llena de personas y rostros que acariciar,\nque me impulsa desde dentro a comprometerme más. Todos caben en tu\ncorazón. Quiero seguirte Señor.\nAMANDO HASTA EL EXTREMO, DEJÁNDOME LA PIEL, ENTREGANDO LAS\nENTRAÑAS, MIS ENTRAÑAS DE MUJER. EN UNA TOALLA Y UN LEBRILLO, EN\nUN ACARICIAR LOS PIES, EN UN MIRAROS HASTA EL FONDO SIN NADA QUE\nREPROCHAR Y SIN NADA QUE PEDIR, Y CON TANTO PARA DAR.\n    SOL        FA                  LA\nY SIN NADA QUE PEDIR, Y CON TANTO PARA DAR. (BIS)"}, {"title": "AMIGOS", "page": 14, "body": "DO             FA-SOL-DO       mim       FA    SOL-7\nComenzar nunca es fácil, sabéis; lo importante es querer caminar\n    lam   mim  FA\ny forjar día a día los sueños.\n      DO          FA-SOL   DO\nVUESTRA VOZ, NUESTRA VOZ SE UNIRÁN. (2)\n/RE/\nEn vosotros está la verdad, no dudéis, avanzad sin temor. Codo a codo\nabriremos camino.\n/MI/\nNuestra voz sea un grito de paz, de amistad, de esperanza y perdón. Sólo\nasí nacerá nueva vida.\nComenzar nunca es fácil, sabéis; lo importante es querer caminar y forjar\ndía a día los sueños."}, {"title": "ANDA... LEVÁNTATE Y ANDA", "page": 15, "body": "DO      SOL           lam            SOL\nNo tengas miedo, tú no te rindas, no pierdas la esperanza. No tengas\nmiedo, yo estoy contigo, en lo que venga y nada\nFA      DO        FA   SOL\npuede ni podrá el desconsuelo retando a la esperanza.\nFA -DO           SOL-7\nAnda… levántate y anda\nNo tengas miedo, no desesperes, no pierdas la confianza. No tengas miedo,\nyo voy contigo siempre y a donde vayas. No dejes que envejezca un solo\nsueño cosido alguna almohada.\nAnda… levántate y anda.\nNo tengas miedo, yo te sujeto solo confía y salta. No tengas miedo, voy a\ncuidarte te alzaré cuando caigas. Siempre puedes empezar de cero, yo lo\nhago todo nuevo.\nAnda… levántate y anda\nFA              DO                MI           lam\nTú eres mi sueño y mi causa no pienses que voy a dejarte caer. Voy a\ndespertarte y estaré a tu lado para que cada día sea un nuevo renacer.\nFA               SOL      DO\nPara que tengas vida. Anda… levántate."}, {"title": "ANHELO TU PRESENCIA", "page": 15, "body": "SOL       mim     DO     lam  RE\nQuiero entrar a ese lugar, donde tu rostro puedo contemplar.\nDO RE  mim DO   SOL DO     lam DO      RE7\nQuiero entrar al Santo lugar, donde tu voz puedo escuchar.\nDO    RE   SOL      RE     mim              DO\nAnhelo tu Presencia, necesito de tu fuego, no hay nada más hermoso\n      lam     RE\nque poderte adorar.\nDerrama de Tu Gloria. Eres todo lo que quiero. Llena con Tu Poder este\nlugar.\nAnhelo tu Presencia."}, {"title": "APRENDERSE TODOS LA LECCIÓN", "page": 16, "body": "RE                   RE7     SOL          LA   RE-LA\nVeo allí sentados muchos pecadores que obran sin reflexionar,\nRE                  RE7       MI             LA\ny se contonean como emperadores y nunca quieren pensar.\n   fa#m                 SI7        mim                     LA7\nEn vez de aprenderse la ley verdadera andan coqueteando con cualquier\nquimera.\nRE     LA        fa#m   sim SOL   RE       LA  RE\nPongan pues muchísima atención y aprenderse todos la lección.\nPara ir un día a ese hermoso cielo habrá que comportarse bien. El que\nanda jugando con los mandamientos siempre acaba por perder.\nPor eso les digo que hay que estar despiertos si quieren gozarla cuando ya\nestén muertos.\nPongan, pues, muchísima atención y aprenderse todos la lección."}, {"title": "AQUÍ ESTOY, SEÑOR", "page": 16, "body": "DO        LA7            rem-FA           SOL7 DO-LA7\nAquí estoy, Señor, arado de arriba abajo, despojado de la vieja cosecha, sin\n    rem-SOL DO   LA7   rem\nuna sola hierba verde, sin una sola.\nAquí estoy, Señor, la reja de hierro me ha volteado de dentro afuera y ha\nsacado al aire la entraña frágil, la piedra dura, la entraña frágil.\nAquí estoy, Señor, todo entero al sol que quema y al rocío de la noche. Puro\nsurco rajado, herido de esperanza, abierto para la nueva siembra, la nueva\nsiembra.\nAquí estoy, Señor."}, {"title": "AVE MARÍA - Verbum Panis", "page": 17, "body": "DO SOL lam-FA  DO-SOL-rem(DO)\nAVE MARÍA,     AVE.\nAVE MARÍA, AVE.\nDO               lam               SOL     FA\nMadre de la espera y mujer de la esperanza. Ora pro nobis.\nDO                lam            SOL     FA\nMadre de sonrisa y mujer de los silencios. Ora pro nobis.\nDO               SOL          FA\nMadre de frontera y mujer apasionada. Ora pro nobis.\nDO               SOL              FA     SOL-7\nMadre del descanso y mujer de los caminos. Ora pro nobis.\nAVE MARÍA....\nMadre del respiro y mujer de los desiertos. Ora pro nobis\nMadre del ocaso y mujer de los recuerdos. Ora pro nobis.\nMadre del presente y mujer de los retornos. Ora pro nobis.\nMadre del amor y mujer de la ternura. Ora pro nobis.\nAVE MARÍA..."}, {"title": "BENDIGA A DIOS MI ALMA", "page": 18, "body": "lam     RE          lam      RE       SOL       sim\nBendiga a Dios mi alma. Su nombre proclamad, hoy todo en mí\n      FA-DO              lam-RE-lam-RE (LA)\nse regocija    y canta su bondad.\nBendiga a Dios mi alma, por su infinito amor, pues siempre como un buen\namigo, su mano me guió.\nLA SOL RE   LA\nES UN AMIGO FIEL, SIEMPRE PACIENTE Y LEAL, DISPUESTO A PERDONAR.\nMI LA  RE SI7 MI\nHASTA A DA -A- AR\n                RE             MI (lam-RE-lam-RE)\n(BENDIGA A DIOS) JAMÁS TENDRÁ MALDAD. X3\nPerdona los pecados, aliento nos infunde, alivia nuestro sufrir y nos inculca\nel bien. (Bendiga a Dios mi alma. X2)\nNos viste con su amor, su verdad nos inspira y nos contagia un nuevo vigor\nde juventud.\nSU NOMBRE ALABAMOS, Y MIL GRACIAS LE DAMOS, Y SU BONDAD\nCANTAMOS. BENDIGA.\n(BENDIGA A DIOS) BENDIGA A DIOS MI ALMA. X3"}, {"title": "BENDIGAMOS AL SEÑOR", "page": 19, "body": "MI                  do#m              LA       fa#m\nBendigamos al Señor, Dios de toda la creación, por habernos regalado su\nSI7         sol#m          do#m             LA\namor. Su bondad y su perdón, y su gran fidelidad, por los siglos de los\nSI7        MI-SI7\nsiglos durarán.\n     LA       SI7       MI-sol#m-do#m        LA\nEL ESPÍRITU DE DIOS HOY ESTÁ SOBRE MÍ (SOBRE MÍ). ÉL ES QUIEN ME HA\n   SI7              MI   MI7     LA              SI7\nUNGIDO PARA PROCLAMAR (A PROCLAMAR) LA BUENA NUEVA A LOS MÁS\nMI-sol#m-do#m LA       fa#m (SI7)   SI7 (MI)\nPOBRES,       LA GRACIA DE SU SALVACIÓN. (BIS)\nEnviado con poder, y en el nombre de Jesús, a sanar a los enfermos del\ndolor. A los ciegos dar visión, a los pobres la verdad, y a los presos y\noprimidos libertad.\nEL ESPÍRITU...\nCon la fuerza de su amor, y de la resurrección, anunciamos: llega ya la\nsalvación. Que ni el miedo, ni el temor, ni la duda, o la opresión, borrarán la\npaz de nuestro corazón.\nEL ESPÍRITU..."}, {"title": "BIENAVENTURADOS - JMJ", "page": 20, "body": "sim       SOL     RE    DO      SOL RE            LA\nLevanto mis ojos a los montes. ¿Quién me ayudará? La ayuda me viene del\n  MI SOL  LA        MI4-MI (SI4-SI)\nSeñor por su gran compasión.\nAun cuando estamos en el error, nos abraza con su amor. Con su sangre\nnuestro dolor ¡al fin se sanará!\n          RE LA               sim-SOL       RE           LA\nBIENAVENTURADOS LOS MISERICORDIOSOS, PORQUE ELLOS ALCANZARÁN\n      MI\nMISERICORDIA. (BIS)\nSi no perdonamos, ¿quién ganará? ¿quién puede sostenerse en pie? Si Él\nnos perdona, nosotros también ¡hagamos como nuestro Dios!\nBIENAVENTURADOS...\nEn la cruz Él nos redimió, de la tumba resucitó. ¡Jesucristo es el Señor! ¡Al\nmundo hay que anunciar!\nBIENAVENTURADOS...\nHay que soltar el miedo y ser fiel, con la mirada en su amor confiar porque\nÉl resucitó ¡Vive el Señor!\nBIENAVENTURADOS..."}, {"title": "BIENAVENTURANZAS - Kairoi", "page": 21, "body": "mim                sim  DO                 SOL    RE\nFelices somos en la pobreza, si en nuestras manos hay amor de Dios.\nmim                 sim  DO           RE\nSi nos abrimos a la esperanza, si trabajamos en hacer el bien.\nSOL                 RE-mim               sim    DO RE\nFelices somos en la humildad. Si como niños sabemos vivir será nuestra\n   SOL   SI7-mim   DO-RE\nheredad la tierra,      la tierra.\n    SOL      RE       SI7      mim       DO\nSI EL GRANO DE TRIGO NO MUERE EN LA TIERRA ES IMPOSIBLE QUE\nRE     SOL/RE\nNAZCA FRUTO. AQUEL QUE DA SU VIDA PARA LOS DEMÁS TENDRÁ\nSIEMPRE AL SEÑOR.\nFelices somos si compartimos, si nuestro tiempo es para los demás, para el\nque vive en la tristeza y para quien camina en soledad.\nFelices somos  si damos amor.  Si en nuestras manos hay sinceridad,\npodremos siempre mirar y ver a Dios, y ver a Dios.\nSI EL GRANO DE TRIGO...\nFelices somos  si ofrecemos paz y nuestra voz denuncia la opresión,  si\ndesterramos odio y rencores será más limpio nuestro corazón.\nFelices somos en la adversidad. Si nos persiguen cuando no hay razón, la\nvida entonces tendrá sentido en Dios, sentido en Dios.\nSI EL GRANO DE TRIGO..."}, {"title": "BOA NOITE", "page": 21, "body": "RE\nBOA NOITE, BOA NOITE MARIA.\n     LA-7        RE\nBOA NOITE MINHA MÃE. (BIS)\n  SOL           RE-sim          mim-LA(7) RE/7\nO dia esta a terminar e numa oraçâo quero agradecer. O amor e toda\namizade que durante o dia pude receber.\nO dia foi lindo p’ra mim, foi lindo p’ra ti. Harmonia. Vivemos na mesma cruz,\njuntos com Jesus, na alegria."}, {"title": "CAMINANDO CON MARÍA", "page": 22, "body": "DO            FA      DO      FA      DO        RE7\nCaminando de la mano con María, con la fe, con la alegría, de encontrarnos\n     SOL  -7\ncon Jesús. Voy caminando, con vosotros mis hermanos, anunciando a todo\nel mundo, que la vida es el Señor.\nFA       DO     FA           SOL-LA7-RE (MI)\nVoooy con María, al encuentroo del Señoor."}, {"title": "CANTO - Pedro Sosa", "page": 22, "body": "SOL                        mim\nCanto porque hay fuegos que abrasan. Canto porque hay mañana tras la\nsim  DO                     SOL      RE     DO\nnoche. Canto porque hay quien escribe versos a la lucha y a la vida.\nCanto porque hay dolores secretos. Canto a la soledad que vive en la\nesquina. Porque si no canto nace de mí un muerto que se aleja de la vida.\nCanto porque hay amores que explotan. Canto porque hay miradas que\nconstruyen. Porque la esperanza nace cada día. Tímidamente, la sonrisa.\nCanto porque hay hombres que hieren. Canto porque hay quien no cierra\nsu herida. Porque hay vuelos que nunca nacieron, atados a una silla.\n      SOL      RE         mim       DO     SOL\nY CANTARÉ SI ES POSIBLE CON MIS MANOS. CANTARÉ SI ES PRECISO CON\n   RE      mim     sim-DO          SOL         LA7\nMI VIDA. CANTARÉ, CANTARÉ, POR UN SUEÑO CANTARÉ. POR VER\n                RE          RE7\nAMANECER LA ESPERANZA EN ESE DÍA.\nCANTARÉ CON LA FUERZA DE UN ABRAZO. CANTARÉ CON SEMILLAS DE\nALEGRÍA. CANTARÉ, CANTARÉ, CON LOS HOMBRES CANTARÉ,\nDO            SOL DO               RE-SOL\nLA PROMESA DE NACER JUNTOS A UN NUEVO DÍA.\nCanto porque hay hombres que mueren. Canto al hambre y la sed de cada\ndía. Porque hay trampas de ola y arena, paraísos de mentiras.\nCanto al amor de diario, a ese que sabe de fregona y cocina. Canto a la\nsencillez del abrazo, del beso, del llanto.\nY CANTARÉ..."}, {"title": "COMO EL PADRE ME AMÓ", "page": 23, "body": "DO      SOL      lam FA-rem    SOL-7\nCOMO EL PADRE ME AMÓ, YO OS HE AMADO.\nDO     SOL       lam FA      SOL     DO\nPERMANECED EN MI AMOR, PERMANECED EN MI AMOR.\nlam   FA SOL DO FA        SOL     DO mim\nSi guardáis mis palabras y como hermanos os amáis, compartiréis con\n  lam   FA   rem     SOL-7\nalegría el don de la fraternidad.\nSi os ponéis en camino sirviendo siempre a la verdad, fruto daréis en\nabundancia; mi amor se manifestará.\nNo veréis amor tan grande como aquel que os mostró. Yo doy la vida por\nvosotros, amad como yo os amé.\nSi hacéis lo que os mando y os queréis de corazón, compartiréis mi pleno\ngozo de amar como Él me amó."}, {"title": "COMO FUEGO VIVO", "page": 23, "body": "LA    MI      fa#m              RE    MI   LA\nCOMO FUEGO VIVO SE ENCIENDE AQUÍ UNA INMENSA FELICIDAD QUE YA\nRE     MI        LA  fa#m RE        sim       MI\nNUNCA NADIE NOS QUITARÁ,  PORQUE TÚ HAS REGRESADO.\nQUIÉN PODRÁ IMPEDIR QUE COMPARTAS TÚ NUESTROS PASOS AL\nCAMINAR, PUES LA MUERTE YA LA HAS VENCIDO Y NOS HAS DEVUELTO LA\nVIDA.\nfa#m        RE   LA                  MI  mim   FA#M\nHas querido partir tu pan cuando el sol se ocultaba. Muchos ahora te\n        sim      RE      MI\npueden ver, eres Tú, quédate aquí.\nCOMO FUEGO...\nY por siempre te mostrarás como un signo de amor. Manos que saben\ncompartir, pan de eternidad.\nCOMO FUEGO..."}, {"title": "COMO LA LLUVIA Y LA NIEVE", "page": 24, "body": "LA     RE      LA MI7 LA       RE      MI-7  fa#m  do#m\nComo la lluvia y la nieve descienden desde el cielo, y no volverán\nRE      LA     RE      MI(LA) RE MI7\nsin empapar ni hacer germinar la tierra.\nAsí todas mis palabras no volverán a ti sin haber obrado cuanto deseo. Sin\nhaber cumplido lo que les había mandado. Todas tus palabras, todas tus\npalabras."}, {"title": "¿CÓMO TE PODRÉ PAGAR?", "page": 24, "body": "rem             LA7-SIbM  LA7       rem                   LA7\nCaminaré en tú presencia en la tierra de los vivos. Soy feliz aun cuando digo\nsolm     LA7  rem                LA7 solm    LA7      rem\n\"qué desdichado soy\". En lo hondo de mi alma, te siento fundido en mí.\nLA       rem-LA   rem-RE7 solm       LA-7  RE7\nTú me has dado mil razones    para sentirme así,\nsolm           DO FA             rem  LA\n¿CÓMO TE PODRÉ PAGAR? ¿CÓMO TE PODRÉ PAGAR? ¿CÓMO TE PODRÉ\n            SIbM   LA7       rem/RE7\nPAGAR TANTO BIEN COMO ME HAS HECHO? (BIS)\nViviré cuanto me has dicho,  sí, ante todo tu pueblo. Tú soltaste mis\ncadenas. ¡Ay, Yahveh! yo soy tu siervo. Tu siervo para servir allá donde\nexista un hombre. Me ofreceré en sacrificio y, a todos, diré tu nombre.\nUn hambre tiene mi vida. Pagarte cuanto te debo. Viviré para cantar tanto\nbien como me has hecho.\nNunca yo me sentí digno de hacer cuanto siempre he hecho. Lo hago\nporque estás en mí. Tú sabes que así lo siento.\nTú me diste la vida y ahora te la devuelvo. Viviré para cantar tanto bien\ncomo me has hecho."}, {"title": "COMO TUS BRAZOS", "page": 25, "body": "MI              do#m LA          MI         fa#m-SI7\nAquí estamos ya junto a ti,   hoy nos has llamado a caminar\nMI          do#m      LA     lam MI-LA-SI-MI\ny has querido tú estar aquí porque nos amas.\nLa esperanza que tú nos das, dentro de nosotros fuego es. Nos ayudará a\nincendiar y a dar amor a todos.\nLA           SI       MI    do#m  MI            LA     SI7 MI\nEL CAMINO NO LO HAREMOS SOLOS, CON NOSOTROS CAMINARÁS, JUNTO\n      LA     SOL#M  do#m  LA         FA#M(SI)     SI/7 (MI)\nA TI SEREMOS COMO TUS BRAZOS ABIERTOS A LA HUMANIDAD.\nY CUANDO EL ANDAR SE NOS HAGA DURO, CON NOSOTROS SIEMPRE\nESTARÁS; LLEVAREMOS A TODOS TU MENSAJE: ANUNCIO DE PAZ Y DE\nAMOR.\nFiel testigo de la verdad, y de la justicia defensor. Vas como una luz y no te\nhas de cansar de amar.\nEres tú un amigo muy fiel, siempre vives por la humanidad. Sientes gran\npredilección por los que están lejanos."}, {"title": "CONFÍA", "page": 25, "body": "DO                   mim         rem\nSiempre me preguntas qué va a ser de ti. Yo me callo que me aburren ya\n  SOL\ntus dudas. Que si es que en el futuro, que si el porvenir. Y el mañana va\nabsorbiendo poco a poco tus días.\n      FA              DO   rem\nQue seguro que mañana, como ahora, habrá un nuevo problema que te\nSOL\nhaga dudar. Y es por eso que te basta y que te sobra que cada día luches\ncon su nuevo afán.\n   DO    mim    FA  SOL\n¡CONFÍA! ¡CONFÍA! ¡CONFÍA! (BIS)\nSiempre andas pensando cuánto ahorrarás. Yo te digo que ya es mucho lo\nque tienes. Que si el día de mañana, que qué comerás. Pero todo lo que\nganes algún día se pierde.\nQue seguro que mañana, como ahora, habrá un nuevo problema que te\nhaga caer. Y es por eso que te basta y que ya sobra. ¿Es que no tienes todo\nlo que hay que tener?\n¡CONFÍA! ¡CONFÍA! ¡CONFÍA! (BIS)"}, {"title": "CONFÍO EN TI", "page": 26, "body": "DO     SOL FA-SOL-DO          SOL    FA          SOL-7\nConfío en ti, de ti me fie. No andaré tus pasos si no es desde la Fe.\nFA     SOL lam   FA-SOL-DO          mim  FA   SOL DO\nJusto he de vivir si en ti confié. Dame Dios tu Espíritu, dame Tú la Fe."}, {"title": "CONMIGO PUEDES CONTAR", "page": 26, "body": "LA                   MI            RE               MI\nSomos ciudadanos de un mundo que necesita el vuelo de una paloma, que\n    LA          fa#m         RE              MI-7\nnecesita corazones abiertos, y está sediento de un agua nueva.\n     LA           MI               fa#m          do#m\nPOR ESO ESTAMOS AQUÍ (LARÁ-LARÁ), CONMIGO PUEDES CONTAR\n               RE                LA          RE\n(LARÁ-LARÁ). Y DEJARÉ MI EQUIPAJE A UN LADO PARA TENER BIEN\n            LA             RE           MI\nABIERTAS LAS MANOS Y EL CORAZÓN LLENO DE SOL. (BIS)\nSomos ciudadanos de un mundo que fue creado como casa de todos,\ncomo el hogar de una gran familia donde todos vivamos en paz."}, {"title": "CON SENCILLEZ", "page": 27, "body": "LA      MI      fa#m          MI         RE            RE-MI-LA\nCon sencillez, con alegría, hasta el trabajo de cada día es menos pesado, es\nRE         LA       MI\nmucho más fácil de hacer. Con sencillez, con alegría, si no nos falta tu\ncompañía, es menos difícil, tiene más sentido vivir.\nfa#m     RE               fa#m     RE           fa#m\nNI JOYAS NI GRANDES VESTIDOS, NI OROS NI FALSOS AMIGOS, TODO ESTO\n    RE                      fa#m        MI\nNOS SOBRA CUANDO HAY ALGUIEN PARA AMAR, A QUIEN AMAR, CON\n    RE-MI         LA\nALEGRÍA, CON SENCILLEZ.\nCon sencillez, con alegría, no quieres nada, todo lo das, ¿por qué tanto\nambicionar si no hay necesidad?\nAMIGO, AMIGO, ESCUCHA. QUE SOMOS FELICES SIN NADA, PORQUE\nSENCILLÍSIMAMENTE AMAMOS LA SIMPLICIDAD DE NUESTRAS VIDAS, SU\nSENCILLEZ.\nCon sencillez, uhhh, si hay un motivo para tu vida, no importa lo demás,\ntodo se puede olvidar.\nCon sencillez, con alegría, quien nada tiene todo lo da ¿por qué tanto\nambicionar si no tienes necesidad?\nfa#m           fa#m-MI-LA    RE      LA    MI   LA\n¿Por qué tanto ambicionar       si de verdad no hay necesidad?"}, {"title": "CONTIGO ME LA JUEGO", "page": 28, "body": "MI                LA                MI  do#m\nSuma tu carga a mi espalda que yo también cargo. Cuenta de más con mis\nLA                 MI  do#m            LA      MI\nmanos que yo también tiro. Y pon que a partir de ahora será de los dos un\n   SI    do#m         LA                    MI\ncamino. Y yo tu muleta, tu abrigo, tu almohada y tus trastos, los nuevos y\n   SI\nantiguos.\nMira que ahora tu calma es también mi descanso. Que si algo falta lo lleno\nyo a golpe de abrazos. Porque a partir de ahora habrá barra libre de besos.\nY apúntate todos los gestos que hablen por nosotros cuando nos callemos.\ndo#m                LA        MI                     SI\nFue sin querer que te quiero y ya ves, bendita casualidad, que en tu\nfarmacia encontré mi remedio y tú en mí lo que no enseña nunca\nDO#M\nningún colegio.\nFA#M          re#m                      SI              DO#M\nSI PONES TÚ LA SAL Y YO ENCIENDO LA LUZ, TENDRÁ SABOR Y VIDA\nNUESTRA CASA.\nFA#M              MI                           SI\nLA SAL DARÁ EL SABOR, LA LUZ QUE ALUMBRARÁ CADA RINCÓN DE ESTA\nDO#M\nNUEVA CASA.\nSI PONES TÚ LA SAL Y YO ENCIENDO LA LUZ. QUE SOLO SI ES CONTIGO\nME LA JUEGO. LA SAL QUE DA EL SABOR, LA LUZ PARA ALUMBRAR. QUE SI\nES CONTIGO\nDO#M      SI-DO#M FA#M\nME LA JUEGO YO, ME LA JUEGO.\nSabes que cuando te apagas solo yo te enciendo. Que si me falta moral me\nsubo a tu beso. Y pon que a partir de ahora hará mucho menos frío. Y pon\nque dejó de ser mío, dejó de ser tuyo y ahora es nuestro.\nFue sin querer que te quiero...\nSI PONES TÚ LA SAL..."}, {"title": "COPLAS DE YARAVÍ", "page": 29, "body": "lam             FA  lam             FA    DO-MI7\nSeñor, que nuestra vida sea cual una quena simple y recta.\nlam      DO   SOL-DO SOL   lam   MI7-lam\nPara que Tú puedas llenarla, llenarla con tu música. (bis)\nSeñor, que nuestra vida sea arcilla blanda en tus manos.\nPara que Tú puedas formarla, formarla a tu manera. (bis)\nSeñor, que nuestra vida sea, semilla suelta por el aire.\nPara que Tú puedas sembrarla, sembrarla donde quieras. (bis)\nSeñor, que nuestra vida sea, leñita humilde y siempre seca.\nPara que Tú puedas quemarla, quemarla para el pobre. (bis)"}, {"title": "CORAZÓN DE MARÍA", "page": 29, "body": "DO               rem        SOL            DO\nVirgen del silencio, preferida del Señor, corazón de Madre y consuelo en el\n  MI   lam                  rem           FA\ndolor. A ti siempre acudimos cuando todo nos va mal; María, danos fuerza\n      SOL\npara andar.\nDO                   rem          SOL\nTu inmensa hermosura coronada de humildad nos muestra la senda por la\nDO             MI  lam                 rem        SOL\nque hemos de avanzar. Somos hijos tuyos, haznos dóciles a Dios, aparta de\n         DO                MI          MI7\nnosotros aquello que nos impide ser fieles al Señor.\n     LA       fa#m RE            MI          LA        fa#m\nCORAZÓN DE MARÍA, GUÁRDANOS DEL MAL Y DANOS TÚ LA FORTALEZA\n      RE         MI        fa#m     do#m      fa#m\nPARA A CRISTO PREDICAR, VENCIENDO LOS EGOÍSMOS, SUPERANDO LOS\n   do#m   RE                  SI7          MI-7           (LA)\nPROBLEMAS, MADRE HOY ME CONSAGRO A TU AMOR DE CORAZÓN. (BIS)\nVirgen disponible a la voluntad de Dios. Tu presencia inunda de amor\nnuestro corazón. Quiero agradecerte tu espera silenciosa de momentos en\nque me olvidé de ti.\nY mientras la vida sigue su ritmo normal, tú te haces presente en nuestro\nmundo real. Creen que eres quimera, sueño de imaginación, pero tú, María,\nno haces caso y nos esperas, siempre esperas con amor."}, {"title": "CORDERO DE DIOS", "page": 30, "body": "mim     DO     lam                 SI7   mim  SOL    mim\nCordero de Dios que quitas el pecado del mundo, ten piedad de nosotros,\nDO    RE     mim\nten piedad de nosotros.\nCordero de Dios que quitas el pecado del mundo, ten piedad de nosotros,\nten piedad de nosotros.\nCordero de Dios que quitas el pecado de mundo, danos la paz, danos la\npaz, danos la paz."}, {"title": "COSAS DE LOCOS", "page": 30, "body": "RE     LA         SOL        RE       LA\nSi pienso en lo que quieres que yo haga, si tengo que hacer caso a tus\n  SOL         mim   SOL      LA      SOL            RE(7)\npalabras, si quieres que te diga lo que pienso: es de locos, es de locos.\nSi quieres que me quite las cadenas que me hacen sentir seguro aquí\nabajo, es como si me vaciaras las venas. Estás loco, estás loco.\nSOL         LA            RE    fa#m    SOL    LA\nSOLO TE PIDO FUERZAS PARA HACER DE MI DEBILIDAD UN FÉRREO\n      RE-7 SOL              LA               RE     fa#m\nVENDAVAL. DESDE EL CONVENCIMIENTO DE QUE TAL VEZ HOY TODO\n      SOL   LA        SOL       LA(solm)       RE/7\nPUEDA SER DE NUEVO REALIDAD, QUE YA ESTÁS AL LLEGAR.\nDe todas formas, sé que es necesario ir a contra corriente en esta tierra y\nque en el fondo merece la pena estar loco, estar loco."}, {"title": "CREO", "page": 30, "body": "DO   FA-SOL FA   SOL lam (DO)\nCREO, CREO,   CREEE-EE- O\nDO   FA-SOL FA SOL DO\nAMÉN, AMÉN, AAA-AA- MÉN"}, {"title": "CREO EN EL AMOR", "page": 31, "body": "DO                         SOL  rem            DO\nNo te detengas ahora, no creas en la noche, no te detengas más, no caigas\n    SOL   FA           rem     SOL     SOL7\nen la trampa. No te dejes arrastrar, no te dejes engañar más.\nDO                      SOL  SIB      FA      DO\nNo te detengas nunca, camina seguro por tu sendero, sigue dando tu\n   SOL FA      rem  SOL-FA-SOL\nsonrisa. Tú no estarás ya solo.\nDO          lam                FA          DO-mim\nSí, pasará esta niebla que envuelve al mundo de indiferencia.\n    lam             FA             DO\nPasará esta noche y los hombres podrán encontrarse.\n  DO           lam       FA  DO               lam    FA\nYo creo en el amor, creo en el amor, aunque en torno a mí veo soledad,\n      DO-SOL\nsólo dolor.\nDO   SOL     FA          SOL\nCREO QUE EL AMOR ES MÁS GRANDE, CREO QUE EL AMOR ES MÁS\nFUERTE, CREO QUE EL AMOR VENCERÁ. (BIS)"}, {"title": "CRISTO VIVE, ANÚNCIALO", "page": 31, "body": "SOL      RE     DO        SOL    mim       sim\nCristo vive, anúncialo, lo he oído en mi corazón y me habla de mi Padre que\n  DO      RE\nme ama con locura.\nCristo  vive, anúncialo,  lo he  visto en mi corazón,  lo he  visto en mis\nhermanos que comparten amor y gozo.\n          DO-RE        SOL     DO        RE       SOL-7\nOH, OH, HERMANO, VEN CONMIGO SI ES AMOR LO QUE MUEVE TU VIDA.\n          DO      RE     SOL-sim-mim  DO        RE\nMUESTRA QUE CRISTO YA VIVE EN TU CORAZÓN. MIRAD: ÉL VIVE HOY.\n       SOL\n¡ANÚNCIALO!\nCristo vive, anúncialo, lo he oído en mi corazón, que la muerte nada puede\nporque el Padre lo resucita.\nCristo vive, anúncialo, lo he oído en mi corazón y me grita en mis hermanos,\nlos que sufren y viven solos."}, {"title": "CUENTA CONMIGO", "page": 32, "body": "SOL DO mim-DO\nOh, oh, oh... (bis)\nYo te ofrezco mi mano que sabe lo que necesitas: echarte una mano y si\ncaes te empuja hacia arriba.\nTe ofrezco mi mano que quiere lo que tú quieras: cogerte la mano y llevarte\nal lugar donde sueñas.\nRE       DO               RE              FA-RE\nSi no salen las cuentas, te ofrezco mi mano para contar contigo.\nSOL              DO           mim\nCUENTA CONMIGO, CUENTA CONMIGO, CUENTA CONMIGO,\nDO      RE\nSIN CONDICIONES. CUENTA CONMIGO, CUENTA CONMIGO, CUENTA\nCONMIGO, SIN EXCEPCIONES.\nOh, oh, oh... (bis)\nYo te ofrezco mi mano que puede con lo que no puedas. Si somos más\nmanos la carga será más ligera.\nTe ofrezco mi mano y si quieres hacemos un trato: nos damos la mano así,\nsin pedir nada a cambio.\nSi no caes en la cuenta, te ofrezco mi mano para caer contigo.\nCUENTA CONMIGO...\n(Manos) Para transformar el mundo.\n(Manos) Que se ofrecen y se dan.\n(Manos) Pueden señalarte el mundo.\n(Manos) Para hacer más fácil el camino a los demás.\n(Manos) Pueden ser tu instrumento.\n(Manos) Que reciben mucho más.\n(Manos) De los que estamos dispuestos.\n(Manos) Que queremos levantar para gritar que puedes contar... conmigo.\nCUENTA CONMIGO...\nOh, oh, oh... (bis)"}, {"title": "DALE LA VUELTA", "page": 33, "body": "MI                       LA                          fa#m\nSiempre hay un pequeño cerca del que se hace grande, siempre el grande\n                               SI7\ngrande se hace grande porque cerca hay un pequeño.\nSiempre hay uno débil cerca del que se hace fuerte, siempre el fuerte se\nhace fuerte porque cerca hay uno débil.\ndo#m                       SOL#M    LA         lam\nSiempre habrá quien siempre quede el último, a no ser que tú lo quieras\n  -MI   SI7\nver al revés.\nMI                               LA\nDALE LA VUELTA AL ORDEN, LA VUELTA. DALE LA VUELTA, DALE LA VUELTA.\nMI             LA-lam\nDALE LA VUELTA, DALE LA VUELTA.\nSiempre hay uno pobre cerca del que se hace rico, siempre el rico se hace\nrico porque cerca hay uno pobre Siempre habrá quien siempre quede el\núltimo, a no ser que tú lo quieras ver al revés.\nDALE LA VUELTA…"}, {"title": "DAME TU CORAZÓN", "page": 34, "body": "LA                      do#m-sim            MI                LA(-7)\nDame tu corazón que sea el mío, que yo no busque nada más que a Ti.\nQue no me mire a mí cuando te sigo, que ya no tenga nada miedo de morir.\nRE              MI   do#m            fa#m RE\nQUE YA NO TENGA NADA, QUE YA NO BUSQUE NADA, QUE YA NO QUIERA\nMI              LA/7\nNADA MÁS QUE A TI. QUE NO ME GUSTE NADA, NO NECESITE NADA, QUE\nYA NO QUIERA NADA MÁS QUE A TI.\nYo sé que eres el tesoro escondido y hay que venderlo todo para así poder\ncomprar el campo y ser ya mío, hay que perderlo todo para ti.\nQUE NO ME QUEDE NADA, QUE NO ME IMPORTE NADA, QUE NO ME\nATRAIGA NADA YA SIN TI. QUE NO ME GUARDE NADA, QUE NO RECUERDE\nNADA, QUE NO CONOZCA NADA QUE A TÍ."}, {"title": "DAME TUS OJOS", "page": 34, "body": "DO               FA                   DO\nDame tus ojos quiero ver. Dame tus palabras, quiero hablar. Dame tu\n    FA\nparecer.\nDame tus pies, yo quiero ir. Dame tus deseos para sentir. Dame tu parecer.\nrem           FA               SOL-FA-SOL\nDame lo que necesito para ser como Tú.\nDO     FA         DO           SOL           lam\nDAME TU VOZ, DAME TU ALIENTO. TOMA MI TIEMPO ES PARA TI. DAME EL\n  FA            DO (SOL)\nCAMINO QUE DEBO SEGUIR. DAME TUS SUEÑOS, TUS ANHELOS, TUS\nPENSAMIENTOS, TU SENTIR. DAME TU VIDA PARA VIVIR.\nDéjame ver lo que Tú ves. Dame de tu gracia, tu poder. Dame tu corazón.\nDéjame ver en tu interior para ser cambiado por tu amor. Dame tu corazón.\nDame lo que necesito para ser como Tú.\nDAME TU VOZ...\nDO                FA-fam       DO\nDame tus ojos quiero ver... Dame tu parecer."}, {"title": "DAME VIDA", "page": 35, "body": "RE  LA      SOL     RE    LA          SOL       mim\nMi Señor, de mis enemigos, líbrame. En ti me refugio, enséñame a cumplir\n       LA SOL            RE     LA     SOL\ntu voluntad, porque tú eres mi Dios, mi Dios. Tu Espíritu que es bueno, me\nRE-LA          RE\nguíe por una tierra llana.\nRE        LA          SOL    mim    LA\nDAME VIDA, DAME LA VIDA, DAME TU VIDA, MI DIOS. (BIS)\nMi Señor, siente cómo me falta el aliento. No escondas tu rostro, si lo alejas\nde mí me moriría, haz que sienta en la mañana tu amor. Enséñame el\ncamino a seguir, a ti levanto mi alma.\nENSÉÑAME TU TIERRA, GUÍAME A TU TIERRA, LLÉVAME A TU TIERRA,\nSEÑOR. (BIS)"}, {"title": "DAVID FRENTE A GOLIAT", "page": 35, "body": "DO  FA        DO-FA         DO   FA\nSe fueron las carreras y la competición, buscar desesperado llegar a ser el\nDO-FA      lam   mim     FA        SOL   FA\nmejor. Vamos a Jerusalén, en tus manos tienes ya el camino hacia\nSOL  lam\nla felicidad.\nY quién no te recuerda, descendiente de Jesé. Goliat ha fracasado, su cara\npudiste ver, tal vez no pensabas que te dejabas allí la piel, pero abriste el\nsurco de la libertad,\nFA-SOL        lam-FA          DO      FA-SOL          lam-FA\nSOLO ESTABAS ALLÍ COMO JOVEN DE NUESTRO TIEMPO, ESTABAS ALLÍ. TÚ\n                          SOL              lam-SOL-FA-SOL\nPARABAS LA ABSURDA REALIDAD. DAVID FRENTE A GOLIAT.\nAmigo que hoy estudias en la universidad, la paz desde las aulas quieres\nmanifestar, porque ya no quieres ver más violencia en tu ciudad y odias el\nsilencio de complicidad.\nSi un  día no  tuvieras  fuerzas  para  luchar,  desesperarías,  quisieras\nabandonar, piensa entonces en David, un muchacho como tú, junto a Dios\ntu desafío vencerás.\nPUEDES LLEGAR A SER ARTÍFICE DE UN MUNDO SIN FALSEDAD, CONTRA\nLA MAFIA DE LA HIPOCRESÍA Y TÚ SOLO NO ESTARÁS. EN TUS FILAS ESTÁN\nLUCHANDO MUCHOS MÁS COMO TÚ, CONTRA LOS MUROS DE LA\nFALSEDAD. DAVID FRENTE A GOLIAT."}, {"title": "DE NOCHE IREMOS", "page": 36, "body": "lam           rem      lam            MI7   FA   SOL\nDe noche iremos, de noche, que para encontrar la fuente, solo la sed nos\n DO-lam MI7  FA      MI7\nalumbra, solo la sed nos alumbra."}, {"title": "DESOLADA", "page": 36, "body": "rem\nLa brisa roza leve tus vestidos, tus mejillas. Envuelve las figuras que han\nquedado como estatuas. Tras el grito divino de muerte que ha cubierto\ntodo el mundo, tan sólo hay silencio.\nEl eco no repite ya, ninguna voz. El eco no repite ya ningún lamento. Tu\nmirada está fija en aquel cuerpo rígido y solo. El mundo se ha parado.\nFA-rem    SIB-solm-SOL-DO\nDESOLADA, DESOLADA.\nFA-SIB-lam   SIB           lam-rem solm          LA7\nMARÍA,     VEN OH MADRE MÍA,    VEN OH MADRE MÍA.\nMadre, te cuidaré en mi casa. Madre tu dolor entrará en mi casa. Madre, yo\nte honraré con toda mi vida. Madre eres el don más grande de mi Señor.\nSIB      rem\n(Y la tierra tiembla) X7\nMaría yo estoy contigo. La guardia tiene miedo, estoy a tu lado, ese hombre\nera realmente Dios. La roca se abre, el santuario tiembla.\nSOL   SIB         SOL\nMadre yo estoy junto a ti.\nDESOLADA, DESOLADA. MARÍA, VEN OH MADRE MÍA, VEN OH MADRE MÍA."}, {"title": "DIOS, AMIGO Y COMPAÑERO", "page": 37, "body": "DO   lam    FA    rem   SOL/7\nTÚ, MI DIOS, SEÑOR, SEÑOR Y AMIGO (BIS)\nlam       SOL      lam       SOL      lam            SOL\nCompañero de destino, es bueno sentirte cerca cuando la noche se acerca\n        FA      MI7\ny se oscurece el camino. Tú la fuerza de mi paso, quien modela barro y\nvaso. Tú, huella de mi sendero, Dios amigo y compañero.\nTÚ, MI DIOS…\n  lam       SOL  lam         SOL lam            SOL\nEstás allí donde voy, amándome como soy; nunca has estado ausente en el\n           lam       SOL          lam\nmomento presente. Compañero, ¿dónde estoy?\nSólo Tú sabes decir lo que dentro de mí mismo solo me atrevo a pedir a tu\namor, a tu Palabra.\nTÚ, MI DIOS…\nMi lucha y mi derrota, mi llanura y soledad, mi canto, mi pan y mi paz, mi\nmensaje y mensajero, a quien quiero, por quien quiero. Dios amigo y\ncompañero, compañero, compañero…"}, {"title": "DIOS ESTÁ AQUÍ", "page": 37, "body": "DO   SOL lam     FA               SOL    DO-7    FA\nDIOS ESTÁ AQUÍ, TAN CIERTO COMO EL AIRE QUE RESPIRO, TAN CIERTO\n          SOL      DO-mim-lam FA                 SOL\nCOMO LA MAÑANA SE LEVANTA, TAN CIERTO COMO QUE ESTE CANTO LO\n     DO\nPUEDES OÍR.\n           SOL  FA          SOL  DO\nLo puedes sentir moviéndose entre los que aman, lo puedes oír, cantando\ncon nosotros aquí.\nLo puedes llevar, cuando por esa puerta salgas. Lo puedes sentir, muy\ndentro de tu corazón.\nLo puedes notar a tu lado en este mismo instante. Lo puedes guardar muy\ndentro de tu corazón.\nLe puedes contar ese problema que tienes. Jesús está aquí, si tú quieres le\npuedes seguir."}, {"title": "DIOS TE SALVE MARÍA", "page": 38, "body": "LA         LA6          RE             LA\nDios te salve, María, sagrada María, Señora de nuestro camino.\n              do#m            RE             LA\nLlena eres de gracia, llamada entre todas para ser la Madre de Dios.\nEl Señor es contigo y Tú eres la sierva dispuesta a cumplir su misión. Y\nbendita Tú eres, dichosa te llaman a ti, la escogida de Dios.\n     RE                                  LA             MI7\nY bendito es el fruto que crece en tu vientre, el Mesías del pueblo de Dios,\n      LA               RE       MI        LA\nal que tanto esperamos que nazca y que sea nuestro Rey.\nLA                   LA7              RE                LA\nMaría, he mirado hacia el cielo pensando entre nubes tu rostro encontrar.\n  fa#m               RE               LA            MI7\nAl fin te encontré en un establo, entregando la vida a Jesús Salvador.\nLA               LA7             RE                LA\nMaría, he querido sentirte entre tantos milagros que cuentan de ti.\n fa#m             do#m     RE             LA\nAl fin te encontré en mi camino, en la misma vereda que yo.\nRE                               MI                  MI7\nTenías tu cuerpo cansado, un niño en los brazos durmiendo en tu paz.\nLA              RE    MI    LA\nMaría, mujer que regalas la vida sin fin.\nTú eres Santa María, eres nuestra Señora porque haces tan nuestro al\nSeñor. Eres madre de Dios, eres mi tierna madre y madre de la humanidad.\nTe pedimos que ruegues por todos nosotros heridos de tanto pecar. Desde\nhoy, hasta el día final de este peregrinar.\nMaría, he buscado tu imagen serena vestida entre mantos de luz, y al fin te\nencontré dolorosa llorando de pena a los pies de una cruz.\nMaría he querido sentirte entre tantos milagros que cuentan de Ti. Al fin te\nencontré en mi camino, en la misma vereda que yo.\nTenías tu cuerpo cansado, un niño en los brazos durmiendo en tu paz.\nMaría, mujer que regalas la vida sin fin."}, {"title": "DONDE TÚ ESTÁS", "page": 39, "body": "SOL     DO          SOL            sim\nDonde Tú estás, surge la vida. Por donde pasas, florece el desierto. Donde\n  DO            SOL   rem    lam dom  SOL        DO\nTú miras, se ilumina el cielo. Y en el corazón, nace la paz. Donde Tú estás,\n         mim-RE\ndonde Tú estás. (Bis)\n         SOL       dom-SOL\nDonde Tú estás, vuelve la vida."}, {"title": "EL AMOR DE PAPÁ", "page": 39, "body": "DO                        SOL\nY es que el Amor de Papá es tan maravilloso, el Amor de Papá es tan\n          DO                      SOL  -7   DO\nmaravilloso, el Amor de Papá es tan maravilloso... Maravilloso Amor.\nY es que es tan alto que se sale por arriba y es tan bajo que se sale por\nabajo y es tan ancho que se sale por los lados... Maravilloso Amor."}, {"title": "EL AMOR NO DICE BASTA", "page": 39, "body": "mim lam     SI7  mim\nEL AMOR NO DICE BASTA (AMOR Y MÁS AMOR QUE NUNCA DICE BASTA).\n(X4)\n   Solo el Amor de Dios es lo que se encuentra siempre, todo lo demás,\n    sobra.\n   Hacedlo todo por amor, nada hagáis por fuerza, sólo el amor queda.\n   Busquemos a Jesús, que si lo tenemos a él, entonces lo tendremos\n    todo.\n   Ama a tus hermanos y Dios te amará a ti, esto quiere el Señor: ama."}, {"title": "EL AMOR VIVE", "page": 40, "body": "RE                     SOL           LA     sim\nEl Amor vive, el Amor vive, el Amor no puede morir. Este amor inmenso sin\n fa#m SOL       LA7\nfinal, la tierra renacerá.\nEl Amor vive, el Amor vive, el Amor la casa abre. La casa donde todos dicen\nque es posible la unidad.\nRE                        SOL           RE   SOL\n¿CÓMO PUEDO NO CANTAR LA ALEGRÍA QUE HAY EN MÍ? LA VIDA QUE YO\nmim        sim            SOL              LA          RE\nTANTO SOÑÉ, HOY ES REALIDAD. LA REALIDAD DE UN DIOS QUE MURIÓ\nfa#m  sim SOL             mim     SOL      LA7\nPOR AMOR, PARA HACER DE LA HUMANIDAD UNA SOLA CASA.\nEl Amor vive, el Amor vive y con nosotros está. Ha construido esta casa que\nno se puede derrumbar.\nEl Amor  vive,  el Amor  vive, y  le dice a cada hombre: tu  historia es\nindispensable, ¡realiza la unidad!\n¿CÓMO PUEDO NO CANTAR…\nSOL                RE             SOL         RE\nLa tierra es la gran casa de los hombres, la tierra de la unidad. La tierra es\nla gran casa de los hombres, la nueva humanidad. (bis)\nMI                                  SI7\nEl Amor vive, el Amor vive / El Amor... vive. (X8)\nMI\n¿CÓMO PUEDO NO CANTAR…\n¡EL AMOR VIVE, EL AMOR VIVE!"}, {"title": "EL PROFETA", "page": 41, "body": "lam        DO                          rem\nAntes que te formaras dentro del vientre de tu madre. Antes que tú\n  lam        MI         lam\nnacieras te conocía y te consagré. Para ser mi profeta de las naciones yo te\nescogí. Irás donde te envíe, lo que te mande proclamarás.\nlam           DO                  SOL      DO\nTENGO QUE ANDAR, TENGO QUE CANTAR, AY DE MÍ SI NO LO HAGO.\nSOL       lam      SOL        lam      MI            lam\nCÓMO ESCAPAR DE TI, CÓMO NO HABLAR SI TU VOZ ME QUEMA DENTRO.\nTENGO QUE HABLAR, TENGO QUE LUCHAR, AY DE MÍ SI NO LO HAGO.\nCÓMO ESCAPAR DE TI, CÓMO NO HABLAR SI TU VOZ ME QUEMA DENTRO.\nNo temas arriesgarte, porque contigo yo estaré. No temas anunciarme,\nporque en tu boca yo hablaré. Te encargo hoy mi pueblo para arrancar y\nderribar. Para edificar, destruirás y plantarás.\nTENGO QUE ANDAR...\nDeja a tus hermanos, deja a tu padre y a tu madre. Abandona tu casa\nporque la tierra gritando está. Nada traigas contigo porque a tu lado yo\nestaré. Es hora de luchar porque mi pueblo sufriendo está\nTENGO QUE ANDAR..."}, {"title": "EL SEÑOR ES MI FORTALEZA", "page": 41, "body": "RE          SOL-LA  RE         LA      SOL FA#M-sim   LA\nEl Señor es mi fortaleza, el Señor es mi pastor. Él nos da la salvación. En Él\n   RE  SOL LA    fa#m sim SOL-LA-RE\nconfío y no temo, en Él confío y no temo."}, {"title": "EL SEÑOR ES MI PASTOR", "page": 42, "body": "SOL        RE         mim     DO    lam(RE) RE(SOL)\nEL SEÑOR ES MI PASTOR, NADA ME FALTA. EL SEÑOR ES MI PASTOR. (BIS)\n     SOL                mim               DO\nEn praderas reposa mi alma, en su agua descansa mi sed. Él me guía por\n       SOL     DO                  RE(7)\nsenderos justos, por amor, por amor de su nombre.\nAunque pase por valles oscuros, ningún mal, ningún mal temeré, porque sé\nque el Señor va conmigo. Su cayado sostiene mi fe.\nEL SEÑOR ES MI PASTOR...\nTú preparas por mí una mesa frente aquellos que buscan mi mal. Con\naceite me ungiste Señor y mi copa rebosa de ti.\nGloria a Dios padre omnipotente y a su hijo Jesús el Señor y al Espíritu que\nhabita en el mundo, por los siglos eternos. Amén.\nEL SEÑOR ES MI PASTOR..."}, {"title": "EL SUEÑO DE LA ESPERANZA", "page": 42, "body": "SOL            DO   SOL            DO-SOL\nHabrá que abrir las ventanas para asomarse a la playa y hacer una red de\nmim                    lam                 RE7\nlazos, y un puente brazo con brazo para que vengan y vayan.\nHabrá que abrir las cancelas para correr a la playa, a ver si así se nos hiela\nla sangre por la garganta de tanto dolor que espanta…\nlam\nA ver si Europa se entera que no hay quien ponga barreras al sueño de la\n    RE-rem                     MI      lam           RE\nesperanza, que el alma se aferra a un sueño y el sueño mueve las barcas.\nSOL         RE                  lam\nPara vivir de rodillas, mejor morir en el agua. Ahogarse en la pena hiere y\n            mim                          lam-RE\ndeja llagas que sangran. Mejor ahogarse en las olas, las olas no dejan\nDO\nmarcas."}, {"title": "EL TESORO", "page": 43, "body": "MI             sol#m fa#m-SI7           MI   LA-SI7\nHe encontrado un tesoro, el que siempre he buscado, y lo tengo tan\nMI-SI7-do#m  fa#m  SI7    MI\ndentro que   nunca lo perderé.\nLo que había en mi vida como nada ha pasado. He dejado aquello que no\nme hablaba de ti.\ndo#m            sol#m fa#m           SI7       MI   SI7\nTÚ ERES MI GRAN TESORO, TÚ QUE ME HAS DADO EL AMOR. VIVO, CADA\n      LA                    sol#m       SI7\nDÍA ENCUENTRO EN EL GOZO DE AMAR MI LIBERTAD.\nTe he ofrecido mi vida, la has tomado aquel día, pero sé que la encontraré,\n¿dónde está mi tesoro?"}, {"title": "ENAMORAOS DE ÉL", "page": 43, "body": "LA            MI           fa#m          do#m\nENAMORAOS DE ÉL Y TODO SE DARÁ. ENAMORAOS DE ÉL Y YA NO TEMÁIS\nRE               LA            MI-7\nMÁS. ÉL OS DARÁ LA FUERZA. ¡CONFIAD!\nENAMORAOS DE ÉL, QUE ESTÁ EN LOS DEMÁS. ENAMORAOS DE ÉL.\nCUANDO ALGO VAYA MAL ÉL OS HARÁ ENTENDER. ¡CONFIAD!\n    fa#m    do#m    RE-MI-LA     RE         MI(7)\nNo sabéis hasta donde podréis llegar. Él amplía los horizontes.\nNo sabéis hasta donde podréis amar. Él ensancha todos los corazones.\nENAMORAOS DE ÉL...\nNo sabéis hasta donde podréis andar. Él derriba cualquier límite.\nNo sabéis hasta donde podréis soñar. Él hará posible cada imposible.\nENAMORAOS DE ÉL..."}, {"title": "EN FAMILIA", "page": 44, "body": "DO                    FA  DO                 FA\nBrazos que se abren al que llega. Brazos que estrechan a quien debe partir.\n   SOL           DO  mim lam     DO      SOL    DO\nTe alzan, te sostienen si caes o te levantas. En familia simplemente es así.\n              FA SOL     DO                 FA SOL     DO-7\nEN FAMILIA SE ESTÁ UNOS POR OTROS. EN FAMILIA SE DA SIN CONDICIÓN.\n    lam                   FA          lam    DO\nSU ABRAZO SE DILATA Y VA, VA MUCHO MÁS ALLÁ. EN FAMILIA TODOS\nSOL    DO\nTIENEN LUGAR.\nBrazos fuertes para confortarte. Brazos que te acogen, así como eres tú.\nSuavizan las heridas y saben consolarte. En familia simplemente es así.\nEN FAMILIA SE ESTÁ…\n         lam      mim        FA          DO\nEn la escalada una cordada es, son manos que se enlazan. Sabe a casa,\nsabe a sencillez, a pan, a confianza.\n  FA      DO    MI          lam  FA        rem-FA\nEs fuego del hogar aun dentro de un iglú. Envuelve el universo y más aún,\nSOL-LA\naún.\nEN FAMILIA SE ESTÁ…\n         SOL-LA    RE\nUnos por otros… se está.\nSin condición… se da.\nEs un abrazo… que va.\n       SOL-solm RE\nY todos tienen lugar."}, {"title": "EN MI DEBILIDAD", "page": 44, "body": "DO          lam            mim-FA-SOL  DO-SOL\nEn mi debilidad me haces fuerte en mi debilidad me haces fuerte. Solo en\n  DO        DO7          FA          fam\ntu amor me haces fuerte solo en tu vida me haces fuerte. En mi\n    DO   FA   SOL    DO/SOL\ndebilidad te haces fuerte en mí."}, {"title": "EN MI GETSEMANÍ", "page": 45, "body": "LA         MI          fa#m     -MI     RE           SI7\nPara que mi amor no sea un sentimiento, tan sólo un deslumbramiento\n   MI\npasajero.\ndo#m           fa#m              RE        sim       MI\nPara no gastar las palabras más mías, ni vaciar de contenido mi te quiero.\nQuiero hundir más hondo mi raíz en Ti y cimentar en solidez éste mi afecto\nPues mi corazón que es inquieto y es frágil solo acierta si se abraza a tu\nproyecto.\n      LA       MI          fa#m  MI         RE         sim (MI)\nMÁS ALLÁ DE MIS MIEDOS, MÁS ALLÁ DE MI INSEGURIDAD, QUIERO DARTE\n      MI (LA)\nMI RESPUESTA. AQUÍ ESTOY PARA HACER TU VOLUNTAD, PARA QUE MI\nAMOR SEA DECIRTE SÍ, HASTA EL FINAL.\nDuermen su sopor y temen en el huerto. Ni sus amigos acompañan al\nmaestro. Si es hora de cruz, es de fidelidades, pero el mundo nunca quiere\naceptar esto.\nDame comprender, Señor, tu amor tan puro. Amor que persevera en cruz,\namor perfecto. Dame serte fiel cuando todo está oscuro, para que mi amor\nno sea un sentimiento.\nMAS ALLÁ...\nNo es en las palabras ni es en las promesas, donde la historia tiene su\nmotor secreto. Solo es el amor, en la cruz madurado. El amor que mueve a\ntodo el universo.\nPongo mi pequeña vida hoy en tus manos, por sobre mis seguridades y mis\nmiedos. Y para elegir tu querer y no el mío. Hazme en mi Getsemaní fiel y\ndespierto.\nMÁS ALLÁ..."}, {"title": "EN TORNO AL PAN", "page": 46, "body": "mim      DO        SOL      mim      SOL\nLAS FUERZAS SE REHACEN EN LA MESA, SE OLVIDAN LOS SILENCIOS SIN\n  RE      mim     DO     sim         DO\nRAZÓN. SE ESCUCHA UNA NUEVA PALABRA, CON LA MIRADA EN TORNO AL\nSOL           RE\nPAN, EN TORNO A ÉL.\nmim      DO      mim      DO       RE      SOL-SI7\nUna mesa que no tenga horarios, mesas amplias con mucho lugar. Platos\nmim            LA       mim    DO      SI7\nllenos de gran confianza, compartiendo el calor del hogar.\nQue la mesa reúna ilusiones y detalles de un mismo vivir. El sabor del\nencuentro y la fiesta crecerá como masa de pan.\nLAS FUERZAS…\nEn la mesa vivimos sin prisa cada gesto de hermano y su fe; que la mesa\nserene las penas, fortalezca los cuerpos y el dar.\nEn la mesa busquemos descanso y un resquicio de tiempo y un tú, de aquel\ntiempo gratuito que empuja a llevar a los hombres la paz.\nLAS FUERZAS…\n¡VIVIR EN TORNO A ÉL!"}, {"title": "EN TU SILENCIO", "page": 46, "body": "DO    FA      SOL     DO  lam    rem    SOL   SOL7 (DO)\nEn tu silencio descubro el misterio de tu presencia en mi corazón. No sé si\nvienes y te acojo dentro o si me acoges en Ti, Jesús.\nFuente de vida que nace en el alma como un tesoro guardado por ti. Es tu\npresencia un fuego de amor que envuelve todo mi ser, Jesús.   (DO-LA-RE)\nAhora tu Espíritu en mí dice Padre, ya no soy yo el que habla, eres Tú. En\neste océano inmenso de paz vives Tú en mí y yo en ti, Jesús."}, {"title": "ENVÍAME", "page": 47, "body": "RE                         LA              sim\n¡Qué bello es anunciar sobre los montes tu palabra! Gritar entre las gentes\n      fa#m           SOL       LA       RE  LA  sim\nque es posible tu Evangelio. Ser carta de Dios que escriba cada día que\nSOL                     LA7\ntodos hemos de ser tu gran familia. (bis)\n  SOL     LA    RE   fa#m     sim   SOL     LA     RE\nENVÍAME, ENVÍAME, TU PAZ Y TU ALEGRÍA. ENVÍAME, ENVÍAME, TU\n                RE7       SOL         LA      fa#m\nIMPULSO Y TU ESPERANZA. QUE SIEMBRE TU SEMILLA EN MEDIO DEL\n   sim       SOL          LA           RE/7\nDOLOR Y LA VIOLENCIA QUE DESHACE LAS SONRISAS. (BIS)\nHoy siento que mi amor no ha de quedarse sólo en mí. Siento que, de no\ndarse, se pudriría en mis entrañas. Hoy quiero cantar, gritar en cielo y tierra\nque siento en mi pobreza una gran fuerza. (bis)"}, {"title": "ES IMPOSIBLE", "page": 47, "body": "rem                               LA9-LA\nMire donde mire, siempre te encontraré, estás en lo alto y a mi lado\nsiempre estás.\n  SIbM       DO    FA    lam rem   SIbM           DO\nEn todo lo que me pasa encuentro, tu amor. Ya no podemos dejar de creer\n   rem-RE7\nen tu amor.\n      SIbM         DO       lam                 rem\nES IMPOSIBLE NO CREER EN TI. ES IMPOSIBLE NO ESCUCHAR TU VOZ. ES\n    SIbM          DO    rem-RE7 (FA)\nIMPOSIBLE NO HACER DE TI, MI IDEAL (BIS).\nCuando de  ti hablo, siempre presente  estás; cuando  te imploramos\ntambién escucharás. Entregaste tu cuerpo para demostrar que la muerte\nno existe para aquel que, en ti, viviendo está."}, {"title": "ÉXODO", "page": 48, "body": "mim      -SI7              mim                     lam\nCaminante... salgamos juntos de Egipto, en busca de un mundo nuevo,\n     RE      SOL                     SI7               mim\nen busca de libertad. Donde no existan cadenas, manos atadas sin más.\n              lam         RE      SOL\nNo desesperes amigo, que Yahvéh te salvará.\n    DO         RE         SOL     SI7 mim        SI7\nÉL TE BRINDA, CAMINANTE, SU BASTÓN DE CAMINAR UN BASTÓN EN QUE\n   mim           SI7       mim\nAPOYARSE, QUE SE LLAMA LIBERTAD. (BIS)\nCaminante... has llegado al desierto, donde el sol, la sed, el hambre te van a\ndesesperar. Un camino pedregoso, con piedras que hay que saltar. No\ndesesperes amigo que Yahvéh te salvará.\nÉL TE BRINDA...\nCaminante... seguimos nuestro camino en busca de aquella tierra que\nYahvéh te prometió. Hemos subido hasta el monte, donde ha costado\nllegar. Abre tu alma israelita que Yahvéh te va a hablar.\nEL TE BRINDA...\nCaminante... tus pasos no se detienen, tienes que seguir en marcha, Yahvéh\nte acompañará. Te ha prometido una tierra, a la que vas a llegar. Tu vida es\nla promesa, ahora no puedes parar.\nÉL TE BRINDA..."}, {"title": "FUENTE DE PAZ", "page": 49, "body": "lam         mim       FA    SOL-lam\nFuente de paz y de fidelidad, Virgen María. Dios se fijó en ti por tu humildad,\nVirgen María.\nFA        rem FA            rem       MI-7\nElegida del Señor, siempre dócil a su voz, por el amor.\n    lam       DO                 FA\nHÁGASE SEÑOR, EN MI TU VOLUNTAD, HÁGASE EN MI, SEGÚN TU\n  DO   rem                       lam\nPALABRA. CON MARÍA UNIMOS NUESTRAS VOCES AL CANTAR.\nFA       MI            lam-SOL-FA  FA       MI           lam\nHÁGASE SEÑOR, TU VOLUNTAD EN MÍ,  HÁGASE SEÑOR, TU VOLUNTAD."}, {"title": "GLORIA", "page": 49, "body": "DO    FA     DO  FA       DO    MI  lam     FA      SOL/7\nGloria a Dios en el Cielo y en la tierra paz a los hombres que ama el Señor.\nDO    FA     DO  FA       DO    MI  lam     FA-SOL-DO\nGloria a Dios en el Cielo y en la tierra paz a los hombres que ama el Señor.\nRecitativo Gloria (mmmm)\nGloria a Dios..."}, {"title": "GLORIA - Gen Verde", "page": 50, "body": "RE              SOL-LA      RE                SOL-LA\nGLORIA, GLORIA A DIOS. GLORIA, GLORIA A DIOS EN EL CIELO.\nRE                   SOL-LA      SIbM  SOL   RE  RE-SOL-RE\nPAZ EN LA TIERRA A LOS HOMBRES DE BUENA VOLUNTAD. GLORIA.\n  SOL RE  LA       RE     SOL RE   DO       RE\nTe alabamos y te bendecimos. Te adoramos, sea Gloria a ti.\nSOL RE    LA         RE    DO LA\nY te damos gracias por tu inmensa Gloria.\nSeñor Dios nuestro, Gloria. Rey del Cielo, Gloria. Tú, Dios Padre, Dios\nOmnipotente, Gloria.\nGLORIA, GLORIA A DIOS...\n  RE      DO   SOL   RE (LA)\nSeñor, Hijo unigénito, Jesucristo. Señor, Cordero de Dios, Hijo del Padre. Tú\nque quitas el pecado del mundo, ten piedad de nosotros. Tú que quitas el\npecado del mundo, atiende a nuestras súplicas. Tú que estás a la derecha\ndel Padre, ten piedad de nosotros.\nGLORIA, GLORIA A DIOS...\nPorque Tú solo, el Santo, el Señor. Tú solo el Altísimo, Cristo Jesús. Con el\nSanto Espíritu en la Gloria del Padre.\nGLORIA, GLORIA A DIOS..."}, {"title": "GLORIA - Indio", "page": 50, "body": "lam                  SOL    lam\nGloria a Dios, Gloria a Dios, Gloria al Padre. (bis)\nlam  SOL MI   lam\n   A Él le sea la Gloria. (bis)\n    Aleluya, amén. (bis)\n    Aleluya, amén. (bis)\nGloria a Dios, Gloria a Dios, Gloria al Hijo. (bis)\nGloria a Dios, Gloria a Dios Espíritu Santo. (bis)"}, {"title": "GLORIA - Martín Valverde", "page": 51, "body": "lam-lam7-FA-MI\nGLORIA, GLORIA\nlam-lam7-FA-MI7-LA7\nGLORIA, GLORIA\n   rem    SOL  DO       lam   rem         MI7 lam/LA7\nA Jesús, el Señor, al Cordero de Dios, al Nombre sobre todo nombre. (bis)"}, {"title": "GRACIAS", "page": 51, "body": "LA   MI  fa#m RE       LA  MI-7    LA    MI  fa#m RE\nHoy Señor te daré las gracias por mi vivir, por la tierra y mis amigos, porque\nLA       SI(MI) MI7(LA)\nsiempre fui feliz. Por el tronco en que nací y la sabia que encontré y los\nbrotes que nacieron portadores de tu fe.\nLA            RE                  MI       fa#m\nPor las veces que caí, y en las que me levanté, porque siempre en ellas vi el\n MI                 RE                    MI     LA\namor de tu poder. Por lo bueno que viví, y en lo que sentí dolor, Siempre en\n                RE       MI-7\ntodo yo te vi, te doy gracias Señor."}, {"title": "GRACIAS A YAHVÉH", "page": 52, "body": "lam    SOL-lam    SOL-lam\nGRACIAS A YAHVEH, ALELUYA. (BIS)\nrem    lam        rem-(MI)-lam\nGRACIAS A YAHVEH, ALELUYA. (BIS)\nFA    lam   SOL         lam\nDemos gracias al Dios de los dioses.\nFA       lam     SOL     lam\nPORQUE ETERNA ES SU MISERICORDIA.\nmim                       lam\nDemos gracias al Señor de los señores.\nGRACIAS A YAHVEH, ALELUYA...\n    Él ha abierto en dos partes el Mar Rojo. PORQUE...\n   Hizo pasar por en medio a su pueblo. GRACIAS...\n    Él ha abierto un camino en el desierto. PORQUE...\n   E hizo con el pueblo una alianza para siempre. GRACIAS...\n    Él los condujo a la tierra prometida. PORQUE...\n   Una tierra que mana leche y miel. GRACIAS...\n   En la angustia no nos abandona. PORQUE...\n    Él nos libra de nuestros enemigos. GRACIAS.."}, {"title": "GRANITO DE MOSTAZA", "page": 52, "body": "mim                           SI7             mim\nSI TUVIERA FE COMO UN GRANITO DE MOSTAZA. ESO DICE EL SEÑOR. (BIS)\n      lam      mim           SI7             mim\nYo le diría a las montañas: muévanse, muévanse, muévanse. (bis)\nmim                     SI7              mim\nY las montañas se moverán, se moverán, se moverán. (bis)\nSI TUVIERA FE...\nYo le diría a los enfermos: sánense, sánense, sánense. (bis)\nY los enfermos se sanarán, se sanarán, se sanarán. (bis)\nSI TUVIERA FE...\nYo le diría a mis hermanos: ámense, ámense, ámense. (bis)\nY mis hermanos se amarán, se amarán, se amarán. (bis)"}, {"title": "HÁGASE EN MÍ", "page": 53, "body": "MI do#m sol#m   LA          MI             SI7          LA\nHágase en mí cuanto quieras, como quieras, donde quieras. Aquí estoy\n  SI7 LA    fa#m7-SI7-MI   LA-SI7\npara vivir Tu Palabra."}, {"title": "HAZME VER CON CLARIDAD", "page": 53, "body": "LA      RE              sim RE\nHazme ver con claridad que el mundo necesita de mí. Más de lo que estoy\n          sim RE                            MI-7      RE-MI\ndispuesto a dar. Más de lo que quiero entrar yo en ti. Y tú me dices ¡Ven a\nfa#m sim        -MI       LA\nmí! Y yo en verdad no quiero ir."}, {"title": "HIMNO A CLARET", "page": 53, "body": "lam        SOL         lam              SOL        DO-MI\nLlegó el Señor cruzando tu camino y al verte, por tu nombre te llamó para\n  lam            rem       FA              MI   (-lam-SOL)\nhacerte testigo de su Reino como fiel mensajero de su voz.\nY tú pasabas mares y montañas proclamando  el mensaje del amor.\nLlegaste hasta las islas más lejanas anunciando a los hombres el perdón.\n  DO\nCLARET, VOZ PEREGRINA QUE VA SEMBRANDO LA GRAN NOTICIA, LA\n     FA      SOL           DO      SOL       DO\nSALVACIÓN. NO IMPORTAN RAZAS NI PUEBLOS, SÓLO HAY UN PADRE,\nRE7        SOL-7  DO\nSÓLO UN SEÑOR. CLARET, DESDE TU VIDA DIOS NOS SEÑALA NUESTRA\n                FA   SOL             DO         lam\nTAREA, NUESTRA MISIÓN. VAMOS SIGUIENDO TUS HUELLAS, GRITANDO AL\nrem        SOL DO/MI\nMUNDO: DIOS ES AMOR.\nLa luz del Evangelio fue tu rumbo, tu vida Cristo mismo la llenó, y le hiciste\nllegar hasta los hombres como el Hijo en María se nos dio.\nNosotros  seguiremos  tus  caminos como  nueva  familia  del  Señor.\nQueremos ser también la luz del mundo, levadura de vida y salvación."}, {"title": "HIMNO A DIOS", "page": 54, "body": "LA           RE         LA     MI         LA/MI\nMI FUERZA Y MI PODER ES EL SEÑOR, ÉL ES MI SALVACIÓN. (BIS)"}, {"title": "HIMNO AL CORAZÓN DE MARÍA", "page": 54, "body": "LA             RE-LA                     sim7\nGloria a ti, Corazón de María, fiel creyente en Jesús, el Señor.\n     RE    MI7       LA                                MI-7\nTe aclamamos: “La llena de Gracia”, Reina y Madre del pueblo de Dios.\n      LA               RE MI       LA     RE     LA\nCon la fuerza y el don del Espíritu, compartiendo la vida y el pan,\n          mim    RE               MI7      LA\nanunciamos la buena noticia, construimos el Reino en la paz.\n             mim   RE                   MI7      LA\nTe aclamamos: “La llena de Gracia”, Reina y Madre del pueblo de Dios."}, {"title": "HOLA DIOS", "page": 54, "body": "SOL RE DO   SOL DO     SOL    DO(RE)  RE(SOL)\nHola Dios estoy aquí. Gracias te doy por darme la vida. Hazla nueva todos\nlos días. Buenos días mi Señor."}, {"title": "HOMBRES DE HOY", "page": 55, "body": "lam         FA      lam          FA   SOL        FA  lam\nPinceladas de eternidad, trasparentes colores, un pintor invisible que nos\n              FA       lam              FA     DO\npinta un mundo nuevo que ya se está formando justo aquí. Es su lienzo la\nlam      FA          MI\ntierra y su marco el cielo azul.\nPocas notas de música. Con sonidos casi mágicos, mano invisible de un\nmúsico que compone una nueva canción y que se abre paso gracias a él.\nDO        DO7           FA         MI-7\nTocará nuevas cuerdas que en nosotros vibrarán.\nDO         FA      SOL DO            FA     SOL\nHOMBRES DE HOY, OH OH OH OH, HACEN LA HISTORIA MIRANDO HACIA\n    DO\nEL FUTURO. HOMBRES DE HOY, OH OH OH OH, SIGUEN LAS HUELLAS DE\n              lam-SOL-FA\nUN CAMINAR SEGURO. (BIS)\nUn Misterio insondable que da sensación de vértigo; nada es repetible,\nsomos todos instrumentos que dejan una huella tras de sí. Fuimos hechos\npara vivir una única realidad."}, {"title": "HOY EL SEÑOR", "page": 55, "body": "RE                                                   LA7\nHoy el Señor (hoy el Señor) resucitó (resucitó), y de la muerte nos libró.\n   RE    RE7    SOL-solm        RE    LA7 RE\nALEGRÍA Y PAZ HERMANOS, QUE EL SEÑOR RESUCITÓ.\nPorque esperó (porque esperó), Dios le libró (Dios le libró), y de la muerte\nlo sacó.\nALEGRÍA Y PAZ...\nEl pueblo en Él (el pueblo en Él) vida encontró (vida encontró). La esclavitud\nya terminó.\nALEGRÍA Y PAZ...\nLa luz de Dios (la luz de Dios) en Él brilló (en Él brilló). De nueva vida nos\nllenó.\nALEGRÍA Y PAZ..."}, {"title": "HOY NO ME PUEDO RESISTIR", "page": 56, "body": "lam        FA    SOL DO-MI\nHOY NO ME PUEDO RESISTIR Y ES QUE ESTE MENSAJE VA TAMBIÉN PA´MÍ\nTODA LA NOCHE SIN DORMIR, PENSANDO Y PENSANDO SI LO HE DE\nSEGUIR.\nsolm     rem      sol-rem                    solm\nHoy no me puedo resistir. Todos le hemos de seguir. Quiero yo seguirte,\nDO             solm         DO\nser tu buen amigo, anunciar al mundo que eres el camino."}, {"title": "ID Y ANUNCIAD", "page": 56, "body": "RE               FA#M  SOL      LA       RE\nID Y ANUNCIAD POR EL MUNDO LA BUENA NUEVA DE DIOS,\nSOL      LA             RE-fa#m-sim SOL          mim(LA)    SOL(RE)\nY ENTENDERÉIS LO QUE OS QUISE DECIR, QUE EL REINO COMIENZA AQUÍ.\n(BIS)\nRE    SOL      RE       SOL      RE    sim\nY si os amáis de verdad y dais cobijo al más pobre, ¿quién podrá contra\n  LA   SOL      LA     SOL (RE)\nvosotros, y vuestras obras condene?\nSed luz que alumbra en lo alto, sembrad la tierra de amor, sed mensajeros\nque anuncien la Buena Nueva de Dios.\nID Y ANUNCIAD...\nRE            LA             sim            SOL\nSed del mundo la sal, del mundo la luz, del mundo el amor. (bis)"}, {"title": "ISAÍAS 61", "page": 57, "body": "LA      RE   LA            RE   LA      RE         MI\nEl Espíritu del Señor está sobre mí, me envió a anunciar la Buena Nueva a\n    do#m     fa#m     RE      MI          LA-MI7\nlos humildes de la Tierra, publicar la promesa de liberación.\nEl Espíritu de Señor está sobre mí, me envió a sanar a los heridos de\ncorazones afligidos, desatar a los cautivos de su dolor.\n             LA                  RE           sim\nPUES YO HE VENIDO A RESCATAR LO PERDIDO, A ENTREGAR LO QUE UNA\nMI           LA        DO#M                 fa#m\nVEZ FUE PROMETIDO, A CONSOLAR Y PERDONAR A LOS SENCILLOS, A DAR\n     RE          sim               MI/7\nSU HERENCIA A LOS POBRES Y EMPOBRECIDOS.\nPUES YO HE VENIDO A DAR EL PAN A LOS HAMBRIENTOS; A LOS\nSEDIENTOS, EL AGUA VIVA DE LA SALVACIÓN. Y DE ALEGRÍA COLMAR A LOS\nQUE LLORAN, Y CON MIS OBRAS PROCLAMAR SU REINO HOY,\n  RE          MI      LA\nEL REINO DE LOS HIJOS DE DIOS.\nEl Espíritu del Señor está sobre mí, me envió a devolver luz a los ciegos, a\nenderezar sus senderos mostrar el camino perfecto, el de su amor."}, {"title": "JESÚS - Ain Karem", "page": 58, "body": "SOL            RE  DO     RE\nTú eres Palabra de Vida, ¡Jesús Maestro!\nTú eres Salud y Esperanza, ¡Jesús Sanador!\nmim             sim          DO       RE\nTú quien deshaces nuestras ataduras, ¡Jesús Liberador!\nDO             SOL    RE DO         RE\nFuente de Agua Viva, Mesa de Paz, ¡Jesús, nuestro Señor!\nSOL              RE DO                SOL     lam\nANTE TU NOMBRE, JESÚS, NUESTRAS RODILLAS SE DOBLAN. SOLO EN TU\n        sim       DO               RE\nNOMBRE CAMINAREMOS Y ANUNCIAREMOS EL REINO DE DIOS.\n SOL        RE         DO   SOL\nJESÚS, BUEN JESÚS, NUESTRO SEÑOR, JESÚS.\nTú eres Luz y Camino, ¡Jesús Maestro!\nTú eres Perdón y Refugio, ¡Jesús Sanador!\nTú quien despierta nuestros oídos, ¡Jesús Liberador!\nFuego en las entrañas, Amor Verdadero, ¡Jesús, nuestro Señor!\nANTE TU NOMBRE...\nTú eres nuestro Sentido, ¡Jesús Maestro!\nBálsamo y Consuelo en nuestras heridas, ¡Jesús Sanador!\nTú quien nos hermanas colgado en un madero, ¡Jesús Liberador!\nPobre entre los pobres, Dios hecho pequeño. ¡Jesús, nuestro Señor!\nANTE TU NOMBRE... (BIS)"}, {"title": "JESÚS ESTÁ EN TI", "page": 58, "body": "DO            lam           FA            SOL\n¡ES JESÚS! QUE ESTÁ EN TI, QUE ESTÁ EN MÍ, QUE ESTÁ EN TODOS MIS\n    DO(-7)\nHERMANOS. QUE ESTÁ EN TI, QUE ESTÁ EN MÍ, QUE ESTÁ EN TODOS MIS\nHERMANOS.\n     FA          SOL     DO      mim  lam       FA\nQuién hace crecer las flores, quién hace descender el agua, quién hace\n           SOL-FA     SOL-7\nnuevo tu corazón, cada mañana.\nQuién hace amanecer el sol, quién llena de estrellas el cielo, quién en la\nnoche más oscura, te da todo su consuelo."}, {"title": "JESÚS RESUCITA HOY", "page": 59, "body": "RE   LA     SOL RE   SOL  LA          RE   LA\nMirad, Jesús resucita hoy. Mirad, la tumba está vacía, el Padre ha pensado\n  sim     SOL       mim     SOL    LA\nen Él. De los hombres es Señor, de la vida, Salvador.\nMirad, Jesús resucita hoy. Mirad, vive a nuestro lado. La muerte no tiene\npoder. Proclamad por la fe que está vivo y somos libres porque...\nRE        SOL LA             RE-LA7  RE RE7        SOL-solm\nÉL RESUCITA HOY, ÉL VIVE ENTRE NOSOTROS, ES CRISTO EL SEÑOR,\n     RE DO  LA\nALELUYA, ALELUYA.\nMirad, Jesús resucita hoy, nos da la paz con su palabra, el gozo vuelve al\ncorazón. Con su Espíritu de amor nuestra vida cambiará.\nMirad, Jesús resucita hoy, su amor no nos dejará, su fuerza nos empujará.\nEl será guía y luz, esperanza y fortaleza, porque...\nÉL RESUCITA HOY... (BIS)"}, {"title": "LA BONDAD Y EL AMOR DEL SEÑOR", "page": 59, "body": "RE    mim     LA  fa#m    sim    MI7       LA-7\nLa bondad y el amor del Señor duran por siempre, duran por siempre.\n      RE     mim     LA  fa#m    sim    SOL-LA   SOL  RE\nLa bondad y el amor del Señor duran por siempre, duran por siempre."}, {"title": "LA LUZ DEL MUNDO", "page": 59, "body": "RE7(LA7)      sim                   MI\nTú eres del mundo la luz (bis). En una lumbre que no arde, no cocina ni mi\n          RE     SOL       LA      RE7\nmadre. Hay que iluminar y ser del mundo la luz.\nTú eres del mundo la sal (bis). Pero una sal mojada ya no sirve para nada.\nHay que ser la sal que nunca pierde sabor.\n             fa#m SI7 MI              SOL LA RE (RE7)\nHAY QUE ENCENDER LA LÁMPARA, HAY QUE DESPERTAR PARA QUE EL\nMUNDO TENGA LUZ Y TODOS VIVAN EN PAZ. ¿QUIÉN QUIERE VINO?\nTú eres la casa de Dios (bis). Pero en una casa en ruinas nadie puede ir a\nvivir. La casa de Dios es siempre casa de sol.\nHAY QUE ENCENDER...\nTú eres del mundo la luz (bis). Pero una buena luz necesita un buen candil.\nHay que iluminar y ser del mundo la luz.\nHAY QUE ENCENDER..."}, {"title": "LA MISERICORDIA DEL SEÑOR", "page": 60, "body": "rem     LA     rem  DO  FA  DO rem-LA-rem\nLA MISERICORDIA DEL SEÑOR, CADA DÍA CANTARÉ. (BIS)\n  1. Cantaré eternamente, las misericordias del Señor.\n  2. Anunciaré tu fidelidad, por todas las edades.\n  3. Porque dije: tu misericordia, es un edificio eterno.\n  4. Más que el cielo has afianzado, Señor tu fidelidad.\n  5. El poder y la fidelidad te rodean, misericordia y fidelidad te preceden.\n  6. Bendito el Señor por siempre. Amén, amén."}, {"title": "LÁNZATE A LA AVENTURA", "page": 60, "body": "SOL         DO     mim        RE        SOL\nSi quieres entregarlo todo, por algo mucho mayor, que el poder, la fama y\n DO mim       RE         DO-RE     DO-RE\nel oro, hazlo por el amor, que te da Él, que te da Él.\nmim             LA7     DO        RE     SOL\nLÁNZATE A LA AVENTURA DE AMAR COMO LO HACE ÉL. ÉL DA EL PASO\nPRIMERO Y TÚ DA EL PASO DE FE. LÁNZATE A LA AVENTURA, DE VIVIR\nCOMO LO HIZO CLARET, QUE DEJÓ TODO POR SEGUIR A CRISTO, PORQUE\nDIOS SIEMPRE ES FIEL."}, {"title": "LA ÚLTIMA ESTACIÓN", "page": 61, "body": "DO                       lam                         FA\nNo siempre los viajes terminan llegando a la última estación. Hay veces que\n        DO          SOL            FA\ncuando el camino se acaba comienza un viaje mejor.\nDestino: sorpresa, parada: la prueba que prueba tu fe. Hay miedos que\nnublan o anulan las fuerzas y otros mantienen de pie\n  rem                   SOL          SOL7\na quienes entregan la vida por aquello en lo que creen.\n     FA   SOL     DO           FA         SOL        lam\nESTE TREN LLEVA A LA VIDA DONDE EL ODIO NUNCA VENCE AL PERDÓN.\n     MI            lam          FA         SOL      DO\nESTE TREN LLEVA A LA VIDA DONDE EL MIEDO SE CONVIERTE EN VALOR.\nESTE TREN LLEVA A LA VIDA DEL QUE SUEÑA CON UN MUNDO MEJOR.\nESTE TREN LLEVA A LA VIDA A QUIEN SE PONE A TIRO POR AMOR.\n        FA    SOL\nQUIEN SE PONE A TIRO…\nNo siempre se apaga la llama a quienes apagan la voz. Hoy arde aquello\nque ardía en nosotros y abrasa igual que abrasó. No siempre
