se mata la\nvida, aunque se dispare al corazón.\nNosotros seremos el brote que nace del grano de trigo que murió por\naquellos que dieron su vida. Hoy su voz es nuestra voz.\nESTE TREN LLEVA A LA VIDA…"}, {"title": "LLAMA DE AMOR VIVA", "page": 61, "body": "DO      RE SOL DO             RE      SOL mim RE\nLlama de amor viva. Llama que nace del fuego de amor, del fuego que arde\n    SOL-mim  DO RE SOL\nen el alma.       Oh, oh, oh."}, {"title": "LLEGARÁS", "page": 62, "body": "LA                 MI            fa#m          RE\nSomos peregrinos, caminantes en andar, familia itinerante, somos\n           LA                 MI             RE\ncomunidad, vivimos en camino y el camino es nuestro hogar.\nCamino intransferible, camino singular, pasos que se viven junto a los\ndemás, rostros que transforman la vida al caminar.\nRE      MI  LA                fa#m\nOhh ehh ahh. Libres de ataduras, liberados para andar.\nRE      MI      LA          fa#m    MI\nOhh ehh ahh. Caminar es vivir, y en Él descansar.\n   RE        MI                     fa#m   do#m\nDESCÁLZATE, LA FUERZA DEL CAMINO ES DESCANSAR, VIVIENDO EN SU\n              RE    MI                      LA\nPRESENCIA, CONFIAR. ÉL QUE NOS LLAMA NO NOS DEJARÁ.\nLÁNZATE, TUS LÍMITES PODRÁS SUPERAR, CON SU GRACIA, JESÚS TE\nSOSTENDRÁ, A PUERTO SEGURO LLEGARÁS.\nOhh ehh ahh...\nDESCÁLZATE..."}, {"title": "MADRE Y FORMADORA", "page": 62, "body": "lam            rem              FA              MI       MI7\nMaría Madre, eres toda corazón, formadora y directora del alma de Claret.\nEres la fundadora de la congregación, su aliento vivo y su presencia fiel.\nFA         SOL            lam\nSÉ NUESTRA MADRE Y FORMADORA, COMO LO FUISTE DE CLARET,\nNUESTRA MAESTRA Y DIRECTORA EN EL ANUNCIO DE LA FE.\nEstás abierta y en total consagración a los planes amorosos de Dios sobre\ntu ser. En esa fragua que es tu corazón logran tus hijos su plena madurez."}, {"title": "MAGNIFICAT", "page": 63, "body": "lam    DO    FA                     DO-MI\nMI ALMA CANTA, CANTA LA GRANDEZA DEL SEÑOR\nlam   SOL  lam            SOL     DO-MI7      lam\nY MI ESPÍRITU SE ESTREMECE DE GOZO EN DIOS, MI SALVADOR\nDO    SOL lam     DO     SOL     lam\nPorque miró con bondad la pequeñez de su servidora (bis).\nDO   SOL mim    lam  DO    SOL lam DO        SOL-MI\nEn adelante todas las gentes me llamarán feliz, me llamarán feliz, me\n         lam\nllamarán feliz.\nMI ALMA CANTA...\nFA              DO\nDerribó del trono a los poderosos y ensalzó a los humildes. Colmó de\nbienes a los hambrientos y despidió a los ricos con las manos vacías.\nFA            DO                FA       DO     SOL\nMi alma canta la grandeza del Señor y mi espíritu se estremece de gozo en\nlam-MI      lam\nDios, mi Salvador.\nMI ALMA CANTA..."}, {"title": "MAGNIFICAT - Todo mi ser", "page": 64, "body": "RE      LA          sim-RE7     SOL     mim           SOL\nTODO Ml SER A DIOS CELEBRA Y MI ESPÍRITU SE ALEGRA EN LA GRANDEZA\n      LA\nDEL SEÑOR. (BIS)\n           RE-LA       sim             SOL-mim    LA-7\nPORQUE HA HECHO MARAVILLAS. PORQUE HA HECHO MARAVILLAS.\n          RE-fa#m     sim   SOL      LA        RE/LA7\nPORQUE HA HECHO MARAVILLAS, SANTO SU NOMBRE SERÁ.\nRE      LA  sim           RE7    SOL LA        RE-7\nPuso sus ojos en su humilde esclava sin fijarse en su condición,\n     SOL       LA      RE  fa#m sim     SOL LA          RE/7\ny por siempre me llamarán bienaventurada, escogida por su gran amor.\n(bis)\nTODO MI SER...\nSiempre dará de su misericordia a quienes le saben adorar. Sustituye al\ngrande y orgulloso, derriba a reyes de sus tronos y con su brazo poderoso\na los humildes levantará, a los sencillos los colmará de paz.\nSiempre dará de su misericordia a quienes lo saben alabar. Su siervo Israel\nvio su promesa y se gozó de toda su grandeza. Y su pueblo en la tierra por\nsiempre contemplará que su reino jamás terminará."}, {"title": "MARÍA DE NAZARÉ", "page": 65, "body": "DO         FA   SOL    DO\nMaria de Nazaré, Maria me cativou. Fez mais forte a minha fé e por filho me\nadotou.\n  DO          FA           fam         DO          lam\nÁs vezes eu paro e fico a pensar. E sem perceber, me vejo a rezar. E meu\n         rem          SOL       DO\ncoração se põe a cantar. Pra Vigem de Nazaré.\nMenina que Deus amou e escolheu. Pra Mãe de Jesus, o filho de Deus.\nMaria que o povo inteiro elegeu. Senhora e Mãe do Céu.\nDO   rem SOL  DO lam   rem SOL    DO\nAVÉ MARIA, AVÉ MARIA, AVÉ MARIA, MÃE DE JESUS.\nMaria que eu quero bem, Maria do puro amor. Igual a você, ninguém. Mãe\npura do meu Senhor.\nEm cada mulher que a terra criou, um traço de Deus Maria deixou. Um\nsonho de Mãe Maria plantou, pro mundo encontrar a paz.\nMaria que fez o Cristo falar. Maria que fez Jesus caminhar. Maria que só\nviveu pra seu Deus. Maria do povo meu."}, {"title": "MARÍA ESTÁ PASANDO POR AQUÍ", "page": 65, "body": "DO       SOL        DO(7)\nMaría está pasando por aquí (bis).\n        FA  fam     DO    lam    rem   SOL7   DO/7\nY cuando pasa todo se transforma, la alegría viene y la tristeza va (bis)."}, {"title": "MAR ROJO", "page": 66, "body": "Lam rem             lam         rem              lam\nLibéranos, y rompe las cadenas que nos oprimen y atan a esta tierra.\n            SOL   mim       lam           SOL    mim\nHaz que el Mar Rojo se abra para tu pueblo, nos haga nuevos y limpios\n    lam\npara  ti. Escucha  Israel, esta agua es  el principio, de nuestra Historia,\ncomienza tu camino.\n          SOL    mim        lam     SOL       mim\nPrometo una Tierra que va a ser tu destino, es el momento, comienza a\n    LA\ncaminar.\nRE                                 LA     RE\nABRE TU CAMINO Y PASA POR ENTRE LAS AGUAS, YO HE MARCADO ESTA\nSENDA A LA LIBERTAD.\nLA           SOL        RE           LA\nAHORA ES EL MOMENTO DE DEJAR LO QUE TÚ ERAS, UNA VIDA NUEVA\nESTÁ ESPERANDO RESURGIR.\nRE                                    LA  RE\nATRÁS HA QUEDADO SEPULTADA TU ESCLAVITUD ¡ÁNIMO! YA ERES LIBRE\nPARA CAMINAR.\nAHORA ES EL MOMENTO...\nLevántate, Yahvéh está a tu lado. En el camino, apóyate en tu hermano.\nSólo es Yahvéh quien puede darte vida, tu libertad viene sólo de Él.\nDespiértate, el Mar Rojo has cruzado, ya eres libre, Yahvéh tu Dios te ha\nsalvado."}, {"title": "MI DIOS ESTÁ VIVO", "page": 67, "body": "MI        do#m            fa#m    SI7  MI\nMi Dios está vivo, Él no está muerto, mi Dios está vivo, en mi corazón.\n   MI        do#m        fa#m         SI7      MI   sol#m\nMi Dios está vivo, ha resucitado, lo siento en mis manos, lo siento en mis\ndo#m fa#m       SI7        MI\npies, lo siento en mi alma y en mi ser.\n              SI7                          MI(-7)\nOH, OH, OH, OH, HAY QUE NACER DEL AGUA. OH, OH, OH, OH, HAY QUE\nNACER DEL ESPÍRITU DE DIOS.\n           LA              SI7     MI     sol#m do#m    fa#m\nOH, OH, OH, OH, HAY QUE NACER DEL AGUA Y DEL ESPÍRITU DE DIOS, HAY\n        SI7        MI/7\nQUE NACER DEL SEÑOR. (BIS)\n   MI                   SI7\nPrepárate para que sientas, prepárate para que sientas, prepárate para\nque sientas el Espíritu de Dios.\nDéjalo que se mueva, déjalo que se mueva, déjalo que se muevas dentro de\ntu corazón.\nOH, OH, OH, OH, HAY QUE NACER...\nMi Dios está vivo, Él no está muerto. Mi Dios está vivo en mi corazón.\nLo veo a mi lado, nunca me abandona; lo veo en el aire, lo veo en el mar, lo\nveo en el monte caminar.\nOH, OH, OH, OH, HAY QUE NACER..."}, {"title": "MI PALABRA SERÁ COMO LA LLUVIA", "page": 68, "body": "LA    MI       LA       fa#m     do#m RE       LA-MI\nMi palabra será como la lluvia, que al caer desde el cielo, empapa la tierra.\n   MI7  LA        SI      MI-7\nLa hace fecunda, la llena de vida.\n     RE    MI       fa#m-MI   RE    MI       fa#m      RE\nMi palabra será como la lluvia. Mi palabra será como la lluvia que al caer...\nLA       RE             MI-7\nempapa la tierra, la llena de vida."}, {"title": "MUÉVEME", "page": 68, "body": "SOL  DO RE  SOL-7     DO       RE       mim\nMuéveme mi Dios hacia ti, que no me muevan los hilos de este mundo.\nmim-RE   DO  sim        lam         RE\nNo...o muéveme, atráeme hacia ti desde lo profundo."}, {"title": "NACERÁ", "page": 68, "body": "DO             FA        DO        FA     DO       SOL\nNo he encontrado quien me ame. A ninguno he conocido que llene mi vida\nlam-FA\ncomo Tú. Junto a ti todo es un juego, junto a ti no existe el tiempo, la vida es\nsencilla como Tú.\nSIbM                                      FA     DO   SOL7 (lam-FA)\nNo veo inquietud, ni melancolía que me puedan ensombrecer la alegría.\nQue gran novedad descubrir que Tú inventas el tiempo solo para mí.\nDO  SOL-lam FA\nNACERÁ EN MI SER, EN EL SILENCIO QUE VIVE EN MÍ, BROTARÁ UN CANTO\nQUE NUNCA NADIE CANTÓ PARA TÍ.\nSi el camino se hace duro cómo puedo tener miedo. En esa noche oscura\nestás Tú. Si me duele la derrota de sentirme fracasado. Detrás de esa\nherida estás siempre Tú.\nHay algo que no puedo entender ¿por qué has elegido uno como yo? ¿qué\npodré decir? ¿cuándo me verás? y desde el infinito aquel día vendrás."}, {"title": "NACIDO PARA AMAR", "page": 69, "body": "LA                 SOL               RE\nMira bajo tu suelo si hay tierras movedizas que te quieren tragar. Mira bajo\ntus ojos si hay una niebla espesa que no soportas más.\nSOL-RE-LA\nOH, OH, OH, OH…\nMira entre tus campos si hay una planta seca que no florece más. Mira bajo\ntu cielo si hay una estrella muerta que no calienta más.\nOH, OH, OH, OH…\nFíjate entre las calles si ves un río de gente que espera algo de ti. Fíjate si en\ntu vida ahora ves una fuerza inmensa que crece siempre más.\nOH, OH, OH, OH...\nSIbM        DO                  SOL  MI\nNo mires para atrás, tú has nacido para dar más de ti.\nMI                     LA          MI                   LA\nCOMO EL FUEGO ES FUEGO SI TE ABRASA, COMO EL AGUA ES AGUA SI TE\n     SI7          LA\nEMPAPA, TÚ HAS NACIDO PARA AMAR.\nCOMO EL AIRE ES AIRE SI RESPIRAS Y LA LUZ ES LUZ SI TE ILUMINA, TÚ HAS\n   LA       do#m DO         RE-LA\nNACIDO PARA AMAR, NACIDO PARA AMAR\nCuídate de las hienas porque ellas hacen fiesta si vivo no estás tú. Huye de\nlos piratas porque son como tiburones si no los vences tú.\nOH, OH, OH, OH…\nNo mires para atrás, tú has nacido para dar más de ti.\nCOMO EL FUEGO..."}, {"title": "NADA ES IMPOSIBLE PARA TI", "page": 70, "body": "RE         SOL    LA                RE    fa#m    sim\nPor qué tengo miedo si nada es imposible para ti. Por qué tengo miedo si\nSOL       LA      RE\nnada es imposible para ti. (X2)\nPor qué tengo tristeza si nada es imposible para ti. (X4)\nPor qué tengo dudas si nada es imposible para ti. (X4)\nEnséñame a amar, porque nada es imposible para ti. (X4)\nEnséñame a perdonar, porque nada es imposible para ti. (X4)\nEnséñame a orar, porque nada es imposible para ti. (X4)\nTú te hiciste hombre, porque nada es imposible para ti. (X4)\nTú venciste a la muerte. (X4)\nTú estás entre nosotros. (X4)\nSOL                  RE SOL        LA       RE\nNADA ES IMPOSIBLE PARA TI, NADA ES IMPOSIBLE PARA TI.\n\nNADA NOS SEPARÁ\nLA        RE LA           RE LA"}, {"title": "NADA NOS SEPARARÁ", "page": 70, "body": "LA     do#m fa#m RE MI      LA  RE-MI\nNada nos separará    del Amor de Dios."}, {"title": "NADA TE TURBE", "page": 70, "body": "lam   rem  SOL7   DO   FA        rem6 MI7   lam\nNada te turbe, nada te espante. Quien a Dios tiene, nada le falta.\nLA7   rem  SOL7   DO   FA  rem6 MI7 lam\nNada te turbe, nada te espante. Solo Dios basta."}, {"title": "NOSTALGIA DE DIOS", "page": 71, "body": "SOL      sim     mim        SOL-DO  SOL-DO     RE7\nEn algún lugar debajo de tu piel, está Dios, búscalo. No temas encontrarte,\nSOL  sim    mim\ncara a cara con Él.\nDO  RE -7    SOL    sim  mim DO      SOL\nAtrévete, descubrirás que hay en ti   nostalgia de Dios. (bis)\nEn los surcos de tu mano y en tu voz, está Dios, búscalo. No debes\nolvidarlo: nuestra vida es buscar.\nCada canción, despertará en tu caminar nostalgia de Dios. (bis)\nEn tu agitado e inquieto corazón, está Dios, búscalo. Los días de penumbra\npasarán, ya verás.\nY el nuevo sol, a contraluz te hará sentir nostalgia de Dios. (bis)"}, {"title": "NO ADORÉIS A NADIE", "page": 71, "body": "LA         RE   MI       LA\nNo adoréis a nadie, a nadie más que a Él.\n      LA         RE            MI7\nNo adoréis a nadie, a nadie más que a Él.\n      RE         MI             LA         fa#m\nNo adoréis a nadie, a nadie más. No adoréis a nadie, a nadie más.\n      LA         RE   MI       LA\nNo adoréis a nadie, a nadie más que a Él.\n\nPorque sólo Él nos puede sostener. (bis)\nNo adoréis a nadie, a nadie más.\nNo adoréis a nadie, a nadie más.\nNo adoréis a nadie, a nadie más que a Él.\n\nNo alabéis a nadie, a nadie más que a Él. (bis)\nNo alabéis a nadie, a nadie más.\nNo alabéis a nadie, a nadie más.\nNo alabéis a nadie, a nadie más que a Él.\n\nPorque sólo Él nos puede sostener. (bis)\nNo alabéis a nadie, a nadie más.\nNo alabéis a nadie, a nadie más.\nNo alabéis a nadie, a nadie más que a Él."}, {"title": "NO HAY LUGAR MÁS ALTO", "page": 72, "body": "LA            MI      fa#m            RE\nA tus pies arde mi corazón. A tus pies entrego lo que soy. Es el lugar de mi\nseguridad. Donde nadie me puede señalar.\n        RE                     MI           fa#m\nMe perdonaste, me acercaste a tu presencia. Me levantaste. Hoy me postro\n    MI-7\nadorarte.\n                 RE       MI                   fa#m\nNO HAY LUGAR MÁS ALTO, MÁS GRANDE, QUE ESTAR A TUS PIES, QUE\n           LA\nESTAR A TUS PIES. (BIS)\n   RE           MI-7  LA   MI   fa#m   RE          MI    MI7\nY aquí permaneceré, postrado a tus pies. Y aquí permaneceré, a los pies de\nfa#m\nCristo. (bis)"}, {"title": "OH DIOS, HAS MUERTO", "page": 72, "body": "lam         SOL          mim-lam\nOh Dios, Yo sangro. Oh Dios, Yo sangro.\ndo#m        RE  sim-MI-fa#m-SI-DO#M\nOh Dios, Tú sangras. Oooh Dios, Tú sangras.\nOh Dios, Yo muero. Oh Dios, Tú mueres.\nOh Dios, Yo muerto. Oooh Dios, Tú mueres.\nOh Dios, he muerto. Oh Dios, has muerto.\nOh Dios, has muerto. Oooh Dios, has muerto."}, {"title": "ORACIÓN APOSTÓLICA DE CLARET", "page": 73, "body": "lam         RE   lam       SOL  mim lam\n¡Oh Dios mío y Padre mío! ¡Oh Dios mío y Padre mío!\nlam     SOL     lam RE     lam   RE     lam  mim\nQue te conozca y te haga conocer. Que te ame y te haga amar.\nlam   SOL    lam   SOL lam   SOL    lam   mim  RE    mim\nQue te sirva y te haga servir. Que te alabe y te haga alabar. Te haga alabar."}, {"title": "ORACIÓN DE CLARET", "page": 73, "body": "lam    MI     lam-LA7 rem SOL DO MI          lam       FA\nTendré para con Dios    corazón de hijo, para conmigo mismo, corazón\n   lam SOL      DO     FA       MI7\nde juez, y para con el prójimo, corazón de madre (bis), corazón de madre."}, {"title": "OSEAS 2", "page": 73, "body": "DO                  SOL               lam\nConozco tu conducta y tu constante esfuerzo, has sufrido por mi causa sin\n     SOL           DO                 SOL\nsucumbir al cansancio; pero tengo contra ti que has dejado enfriar tu\n  lam     SOL\nprimer amor.\n      DO   SOL                  lam    mim\nPOR ESO YO, LA VOY A SEDUCIR, LA LLEVARÉ AL DESIERTO Y ALLÍ LE\n      FA              DO                         FA (SOL)\nHABLARÉ A SU CORAZÓN Y ELLA ME RESPONDERÁ COMO EN LOS DÍAS DE\n       SOL (DO-SOL)\nSU JUVENTUD. (BIS)\nNo sé te llamará jamás abandonada, ni a tu tierra se dirá ya más  “la\ndesolada”, pues tu Dios se complacerá en ti y tu tierra será desposada.\nY como joven se casa con doncella, se casará contigo tu hacedor y con gozo\nde esposo por su novia, se gozará por ti, tu Dios.\nPOR ESO YO…\nYo te desposaré conmigo para siempre, te desposaré en fidelidad y en\namor, y en compasión; y tú conocerás a tu Dios.\nEnsancha el espacio de tu tienda, tus clavijas asegura, no te detengas, pues\ntus hijos heredarán naciones y un pueblo de Dios formarán.\nPOR ESO YO TE VOY A SEDUCIR..."}, {"title": "ÓYENOS", "page": 74, "body": "DO          FA  DO            RE  SOL7 lam       RE   SOL\nPadre escucha mi oración, pues de todo corazón, vengo a pedirte perdón.\nDO    FA   SOL DO\nTEN PIEDAD SÍ, ÓYENOS.\nTus mandatos olvidé, Tu Palabra desprecié, mas hoy vuelvo hasta tus pies.\nTEN PIEDAD SÍ, ÓYENOS.\n          lam           mim    lam\nY VIVA EL AMOR, QUE NOS HA DADO EL SER.\n          lam          FA   MI\nY VIVA EL AMOR, LA VERDADERA LEY.\n          lam  FA      SOL\nY VIVA EL AMOR, QUE NOS LIBERA.\nTEN PIEDAD SÍ, ÓYENOS.\n¡Ciegos! haz que podamos ver. ¡Esclavos! danos la libertad. ¡Viejos! danos tu\njuventud.\nTEN PIEDAD SÍ, ÓYENOS.\n¡Muertos! haznos  resucitar.  ¡Culpables! concédenos perdón.  ¡Heridos!\nllévanos a tu paz.\nTEN PIEDAD SÍ, ÓYENOS.\nA tu lado quiero ir, porque ya sé que sin Ti no seré jamás feliz.\nTEN PIEDAD SÍ, ÓYENOS.\nDame fuerzas para amar, a tu lado caminar, y tu cielo conquistar.\nTEN PIEDAD SÍ, ÓYENOS.\nY VIVA EL AMOR... TEN PIEDAD SÍ, ÓYENOS."}, {"title": "PADRENUESTRO GALLEGO", "page": 75, "body": "SOL               mim             DO\nEn el mar he oído hoy Señor tu voz que me llamó y me pidió que me\n     lam        RE\nentregara a mis hermanos.\nEsa voz me transformó, mi vida entera ya cambió y sólo pienso ahora Señor\nen repetirte:\nPADRE NUESTRO, EN TI CREEMOS.\nPADRE NUESTRO, TE OFRECEMOS.\nPADRE NUESTRO, NUESTRAS MANOS\nDE HERMANOS.\nCuando vaya a otros lugares tendré yo que abandonar a mi familia, a mis\namigos por seguirte.\nPero sé que así algún día podré enseñar tu verdad a mi hermano y junto a\nél yo repetirte:"}, {"title": "PADRE NUESTRO, TÚ QUE ESTÁS", "page": 75, "body": "lam                SOL                  lam\nPadre nuestro, Tú que estás en los que aman la verdad, haz que el Reino\n       FA  DO                    FA DO      FA\nque por ti se dio llegue pronto a nuestro corazón. Y el amor que tu Hijo nos\n  DO-mim-lam      SOL lam\ndejó, ese amor, habite en nosotros.\nEn el pan de la unidad, Cristo, danos Tú la paz, y olvídate de nuestro mal si\nolvidamos el de los demás. No permitas que caigamos en tentación, oh\nSeñor, y ten piedad del mundo."}, {"title": "PARA TODA LA VIDA", "page": 76, "body": "Intro: MI-fa#m-sol#m-fa#m\n   do#m        SI           LA     MI     fa#m        SI7\nHas puesto tu mirada en esta historia. En mi debilidad haces morada.\n       LA       SI7       LA      MI             fa#m\nCon tu amor, la finitud es abrazada. Mi historia, nuestra historia en tu\n   SI7\nmemoria.\nCon tus manos moldeas esta forma. En este abrazo realizas tu sueño. Tu\nperdón es fuerza que lo transforma. De esta vida, Tú eres el dueño.\n  LA       SI7        do#m      LA           fa#m     SI7\nTE HACES TESORO EN ESTE BARRO. ME HABITAS SIN QUE YO LO MEREZCA.\nTU SÍ ME SOSTIENE, AUNQUE PEREZCA.\n   RE    fa#m      SI7       LA         SI7  do#m\nME DEJO CAER EN TUS MANOS. MI SÍ ABRAZA TÚ PALABRA,\n    LA      SI7     MI\nESTE SÍ PARA TODA LA VIDA.\nNos miramos y un sí nos decimos. Mi sí es dormir en tu silencio. Tu sí es\nabrazar mi destino. Nuestro sí: tesoro y barro en encuentro."}, {"title": "PAZ", "page": 76, "body": "SOL            mim             DO\nPara el que nunca la dio, para el que en ella nació, para quien bien la\n    RE\nconoce.\nPara quien odia matar y a los que viven en paz, se le ofrecen nuestras\nvoces.\n(PAZ) Para todos aquellos que ya pasaron, para todos los aquellos que no\nllegaron. Para todos los hombres, venga la paz.\n(PAZ) Si eres padre de familia tendrás paz, si viven enamorado tendrás paz.\n                                    DO-RE-SOL\nSi compartes tu vida, venga la paz. Siempre la paz."}, {"title": "PAZ AL MUNDO", "page": 77, "body": "DO  FA    SOL DO         FA         SOL     SOL7\nPaz al mundo, paz al mundo, paz al mundo sea la paz, sea la paz. Y antes\nDO      DO7        FA          fam   DO        SOL\nde ser un esclavo y en enterrarme bajo el barro, dejadme vivir en paz y en\n   DO\nlibertad.\nNo más guerras, no más guerras, no más guerras sea la paz, sea la paz. Y\nantes de ser un esclavo y enterrarme bajo el barro, dejadme vivir en paz y\nen libertad."}, {"title": "PAZ, COMPAÑEROS (SHALOM)", "page": 77, "body": "lam          DO             FA-mim  lam\nSHALOM HABERIM, SHALOM HABERIM: SHALOM, SHALOM.\n  lam     DO         FA-mim  lam\nLEHITRAOT, LEHITRAOT: SHALOM, SHALOM.\n   Que seas feliz, que seas feliz: Shalom, Shalom.\n   Que encuentres la paz, que encuentres la paz: Shalom, Shalom.\n   Que llegue la paz a todo tu hogar: Shalom, Shalom.\n   Que Dios viva en ti, que Dios viva en ti: Shalom, Shalom."}, {"title": "PAZ CONTIGO - Que la Paz contigo esté", "page": 77, "body": "RE   SOL    LA-7  RE SOL LA-7    RE\nQue la Paz contigo esté, la Paz del Señor, cada día contigo esté, la Paz del\nSeñor. Es la Paz que Dios nos da, es la Paz que tú llevarás.\nQue la Paz contigo esté."}, {"title": "PAZ EN LA TIERRA", "page": 78, "body": "DO SOL  lam  DO    SOL  lam   FA          SOL  DO   FA\nPAZ EN LA TIERRA, PAZ EN LAS ALTURAS, QUE EL GOZO ETERNO REINE EN\n         rem(SOL) SOL(DO)\nNUESTRO CORAZÓN. (BIS)\n    DO   SOL-FA   DO FA     SOL      DO       mim\nDa la paz hermano, da la paz, constrúyela en su corazón y con tu gesto\n     lam    FA      SOL/7\nafirmarás que quieres la paz.\nQue tu paz, hermano, sea don. Es el mejor signo de amor que tú nos\npuedes ofrecer, abrazo de paz."}, {"title": "PAZ, SEÑOR", "page": 78, "body": "DO          SOL               lam           mim FA\nPaz, Señor, en el cielo y la Tierra. Paz, Señor, en la orilla del mar. Paz, Señor,\n    DO                RE7            SOL-7\nen las flores que mueve sin saberlo la brisa al pasar.\nTú que has hecho las cosas tan bellas y les das una vida fugaz, pon, Señor,\ntu mirada sobre ellas y devuelve a los hombres la paz.\nDO SOL lam  mim FA DO rem(SOL) SOL7(DO)\nPAZ, PAZ, PAZ SEÑOR. PAZ, PAZ, PAZ Y AMOR. (BIS)\nHoy he visto, Señor, en el cielo, suspendidas de un rayo de luz, dos palomas\nque alzaron el vuelo con las alas en forma de cruz.\nHaz que vuelvan, Señor, a la Tierra las palomas que huyeron, Señor. Y la\nllama que enciende la guerra se convierta en la paz y el amor."}, {"title": "PAZ YUBAL", "page": 79, "body": "MI          RE  LA     MI               RE  LA      MI-RE-LA\nUn sin fin de colores en la ciudad, una mezcla de olores casi sin igual.\nCada rostro una historia por descubrir, en cada esquina una vida pregunta\npor ti.\nMI               RE   LA   MI              RE       LA  MI\nMientras las congas y los timbales de un ritmo nuevo inundan el aire, que\n             LA             SI7\ntoma forma en este abrazo de paz.\nMI-SI7-do#m-LA  MI-SI7-LA-SI7 (-MI-RE-LA-MI)\nPAZ, PAZ. PAZ, PAZ.\nDesde Francia hasta Cuba y en Senegal. En Pekín, en Granada, en Lima o\nBagdad.\nDeja que el Reino crezca con forma de sal que bastante ya hacemos con el\nno estorbar.\nNuestra esperanza serán las voces, de un canto nuevo inundan el aire,\ncomo profetas que están sedientos de paz.\nPAZ, PAZ. PAZ, PAZ."}, {"title": "PEQUEÑOS SOLES", "page": 79, "body": "DO-rem FA    DO        FA      SOL-7    DO\nY entras Tú, en la vida, iluminando todo de eternidad. Y entras Tú como un\nDO7        FA                  fam                SOL-7\nfuego que en el rescoldo enciende, todavía una llama que nos hace:\n     DO-rem FA         SOL    DO-rem FA\nCOMO TÚ, PEQUEÑOS SOLES JUNTO AL SOL. LLAMAS QUE EN TIERRA\nSOL         mim-lam RE                       SOL-7\nARDEN POR TU AMOR. Y ASÍ LA TIERRA BRILLE COMO EL CIELO.\nLlenas Tú, esta vida, y dentro late ya un nuevo corazón. Un corazón que\nabraza el mundo, pero vive en tu cielo, que ha nacido de tu amor y nos\nhace:"}, {"title": "PESCADOR DE HOMBRES", "page": 80, "body": "LA-MI             fa#m-LA7      RE-sim               MI-7\nTú has venido a la orilla, no has buscado ni a sabios ni a ricos, tan solo\nquieres que yo te siga.\n  RE-MI                    LA-fa#m  sim-MI\nSEÑOR, ME HAS MIRADO A LOS OJOS, SONRIENDO HAS DICHO MI\nLA/7\nNOMBRE. EN LA ARENA HE DEJADO MI BARCA, JUNTO A TI BUSCARÉ OTRO\nMAR.\nTú sabes bien lo que tengo, en mi barca no hay oro ni espadas, tan sólo\nredes y mi trabajo.\nTú necesitas mis manos, mi cansancio que a otros descanse, amor que\nquiera seguir amando.\nTú pescador de otros lagos, ansia eterna de almas que esperan; amigo\nbueno, que así me llamas."}, {"title": "¿POR QUÉ ESTA NOCHE?", "page": 80, "body": "lam                         rem          lam\n¿Por qué esta noche es diferente de todas las otras noches? (De todas las\notras noches?)\nQue todas  las otras noches, nos vamos a  la cama pronto y no nos\nquedamos levantados (Y no nos quedamos levantados).\n    rem        lam           MI     -7    lam\nMAS ESTA NOCHE, ESTA NOCHE, ESTAMOS LEVANTADOS (BIS).\nQue todas las otras noches, nos vamos a la cama pronto después de haber\ncenado (bis). MAS ESTA NOCHE, ESTA NOCHE, HEMOS AYUNADO (BIS).\nQue todas las otras noches, nos vamos a la cama pronto y no esperamos\nnada (bis). MAS ESTA NOCHE, ESTA NOCHE, ESTAMOS ESPERANDO (BIS).\nPARA ESTAR LEVANTADOS, PARA HABER AYUNADO, PARA ESTAR TODOS\nESPERANDO (BIS)."}, {"title": "PREGÓN PASCUAL", "page": 81, "body": "SOL     DO       SOL DO SOL       DO-RE   SOL-RE   mim\nExulten los coros de los ángeles, exulten los ministros de Dios y que suenen\n       sim      DO      SOL       RE         SOL-RE\nlas trompetas de victoria por el triunfo de Jesús nuestro Señor.\nRECITADO 1\nQue se alegre y se goce en esta fiesta, inunda­da de tanta claridad, que se\nsienta libre de la oscuridad, porque las tinieblas El venció.\nRECITADO 2\nLa Iglesia también se alegrará revestida de tan brillante luz. Que resuene\neste templo, al aclamar nuestras voces cantando su bondad.\nRECITADO 3\nEsta es la fiesta de la Pascua. Esta es la noche en que llegó la libertad a su\npueblo Israel, al sacarlo de su esclavitud.\nRECITADO 4\nEsta es la noche en que se rompen las cade­nas del pecado por Jesús. Esta\nes la noche en que Cristo, a la muerte con su muerte derro­tó."}, {"title": "PREPARAD EL CAMINO", "page": 81, "body": "MI   fa#m    sol#m      SI7 MI    fa#m    sol#m-fa#m-SI7-MI\nPREPARAD EL CAMINO AL SEÑOR Y ESCUCHAD LA PALABRA DE DIOS.\nVoz que clama en el desierto: “Preparad el camino al Señor.” Haced rectas\ntodas sus sendas, preparad el camino al Señor.\nPREPARAD EL CAMINO...\nVoz que clama en el desierto: “Preparad el camino al Señor.” Desterrad la\nmentira por siempre, preparad el camino al Señor.\nPREPARAD EL CAMINO..."}, {"title": "PUEBLO MÍO", "page": 81, "body": "sim        mim                   /SOL/        FA#M\nPUEBLO MÍO, ¿QUÉ TE HE HECHO? ¿EN QUÉ TE HE OFENDIDO?\n   FA#M7 sim\nRESPÓNDEME. (BIS)"}, {"title": "QUÉ ALEGRÍA CUANDO ME DIJERON", "page": 82, "body": "MI          MI4 MI -7  fa#m     FA#M7      SI7\n¡QUÉ ALEGRÍA CUANDO ME DIJERON: \"VAMOS A LA CASA DEL SEÑOR\"! YA\n  MI   MI7              LA-lam     MI         SI7  MI-MI4-MI\nESTÁN PISANDO NUESTROS PIES TUS UMBRALES, JERUSALÉN.\nJerusalén está fundada como ciudad bien compacta. Allá suben las tribus,\nlas tribus del Señor.\n¡QUÉ ALEGRÍA...\nPor mis hermanos y compañeros, voy a decir: \"La paz contigo\". Por la casa\ndel Señor, nuestro Dios, te deseo todo bien."}, {"title": "QUÉDATE CON NOSOTROS", "page": 82, "body": "MI   LA     MI-sol#m-do#m7 LA           MI   LA            SI7\nQuédate con nosotros.        Tú nuestra esperanza, luz de nuestra fe.\nMI   LA    MI-soL#m-do#m7 LA       MI LA     SI7    MI/SI7\nQuédate con nosotros.        Danos valentía y un corazón fiel."}, {"title": "¿QUÉ MÁS QUIERES?", "page": 82, "body": "SOL\n¿Y QUÉ MÁS QUIERES QUE ALUMBRAR? ¿QUÉ MÁS QUIERES QUE DAR\nDO                           RE-DO          RE\nVIDA? ¿QUÉ MÁS QUIERES QUE CREAR ALGO QUE EN TI ESTÁ COMO\n  SOL\nSEMILLA? (BIS)\n              mim                sim\nSi te arriesgas a expresar lo que tus ojos descubren, podrán todos\n      DO-RE           mim\ncontemplar las aguas que de ti fluyen.\nSaca lo que tienes dentro. Rómpete si es necesario. Que tan pronto como\nlo hagas vivirás más renovada.\n¿Y QUÉ MÁS QUIERES...\nPara alumbrar los hogares unid todos vuestras manos. Esa sí será la obra\nque genere más hermanos.\nSal de ti: Expándete. Con tus manos haz las mías. Con las de otros.\n¿Y QUÉ MÁS QUIERES..."}, {"title": "¿QUÉ TE PUEDO DAR?", "page": 83, "body": "MI               SI           LA        MI (SI7)\n¿Qué te puedo dar que no me hayas dado Tú? ¿Qué te puedo decir que no\nme hayas dicho Tú? ¿Qué puedo hacer por Ti, si yo no puedo hacer nada, si\nyo no puedo hacer nada si no es por Ti, mi Dios?\nLA                SI  MI   sol#m  do#m LA              SI         LA-MI\nTODO LO QUE SÉ, TODO LO QUE SOY, TODO LO QUE TENGO ES TUYO.\n(BIS)"}, {"title": "QUIÉN AMÓ PRIMERO", "page": 83, "body": "SOL    RE  mim\nQuién amó primero, quién nos dijo “Amad como amo yo”.\nDO    RE  SOL   mim  SOL    RE  mim\nQuién amó a todas, a todos, quién en todo amó."}, {"title": "QUIERO ALABARTE", "page": 83, "body": "DO                        lam\nQuiero alabarte más y más aún. Quiero alabarte más y más aún.\n   FA            rem                  SOL-7\nBuscar tu volun­tad, tu gracia conocer, quiero alabarte.\nLAS AVES DE CIELO CANTAN PARA TI, LAS BESTIAS DEL CAMPO REFLEJAN\nTU PO­DER. YO QUIERO CANTAR, YO QUIERO ELEVAR MIS MANOS A TI.\nYo quiero amarte más y más aún. (bis)\nBuscar tu volun­tad, tu gracia conocer, yo quiero amarte.\nQuiero seguirte más y más aún. (bis)\nSeguir tu volun­tad, seguirte solo a Ti, quiero seguirte"}, {"title": "RAZONES", "page": 84, "body": "DO           SOL      lam    FA      DO      rem\nSi tuviera que darte una razón de vida, abriría el cielo y partiríamos solos,\n    FA        SOL      mim      lam   FA         RE7\na probar el nuevo vuelo que ha de nacer en ti, a robarle un poco de su\n       SOL-7\naltura al sol...\nSi tuviera que darte una razón de vida, llenaría de exposiciones los huecos\ndel alma, y de sueños y cariño llenaría las paredes.\n           FA     DO       FA       DO        FA-RE7\nY es que, en este pobre sitio tan pequeño, tan pequeño, cabe tanto,\n    SOL-7\ncabe tanto...\n  DO       FA           DO-FA DO          FA       DO-SOL\nES HORA DE VIVIR Y TRANSFORMAR. ES HORA DE ABRAZAR Y DAR ALIENTO.\n   FA          MI      lam   MI     lam   FA\nES HORA DE ACEPTAR QUE TIENES UN POR QUÉ, PARA ABRAZAR,\n DO         FA             SOL-7       FA-DO (X3) -SOL-7 (DO)\nPARA SOÑAR, PARA EMPEZAR CON FUERZAS ESTE DÍA.\nSi tuviera que darte una razón de lucha, pediría a tus ojos que se abrieran.\nNo hace falta mirar lejos para ver las soledades, para ver que hay más de\nun hombre que te espera...\nSi tuviera que darte una razón de lucha, pediría a tu corazón tan sólo un\nlatido donde puedas sentir el dolor de quien hoy verá su muerte, de quien\nhoy no comerá como otras veces, como otras veces, tantas veces, tantas\nveces...\nES HORA DE LUCHAR Y DE ARRIESGAR. ES HORA DE ACERCAR JUSTICIA A\nOTROS. ES HORA DE ACEPTAR QUE TIENES UN POR QUÉ, PARA ABRAZAR,\nPARA SOÑAR PARA EMPEZAR CON FUERZAS... (BIS) ESTE DÍA."}, {"title": "REJOICE IN THE LORD", "page": 84, "body": "RE                          SOL  LA7  RE-LA7\nREJOICE IN THE LORD ALWAYS, AND AGAIN I SAY REJOICE (BIS).\nRejoice, rejoice, and again I say rejoice (bis)."}, {"title": "RENACER EN LIBERTAD", "page": 85, "body": "SOL\nNO QUIERO UNA LIBERTAD QUE ME HACE LIBRE FRENTE A TI.\n   mim\nNO QUIERO QUERERTE MÁS POR IMPONÉRMELO A MÍ MISMO.\n   DO (lam)                          RE\nNO QUIERO MÁS REGLA QUE EL AMOR. NO QUIERO MÁS REGLA QUE TU\nVOZ.\nQueremos estrenar, vivir en la alegría, en comunidad, que nazca un nuevo\ndía. En medio de problemas, luchas y acercamientos, crecer hasta Ti desde\nun nuevo pensamiento.\nPara edificar la casa sobre roca, fuera dudas, categorías, fuera las normas.\nEl Reino se construye confiando en mi voz, sintiendo en la prueba “no\ntemáis soy yo”.\nNO QUIERO UNA LIBERTAD...\nVive la libertad mirándote en los demás. Siente que creces al servir, que los\ndemás renacen... Tú con ellos, al fin... No quiero\nNO QUIERO UNA LIBERTAD..."}, {"title": "RESURRECCIÓN", "page": 85, "body": "mim                 RE mim        RE  DO          RE\nQuiero caer en tierra y morir, si no quedaré solo. Soy un grano de trigo,\nDO            RE  DO     lam       SI7\nquiero dar mucho fruto. Ser tu testigo por el mundo.\nmim       DO        RE                 SOL         SI7\nSI AMO MI VIDA LA PERDERÉ. SI DOY MI VIDA LA GANARÉ, LA GANARÉ, LA\n    mim\nGANARÉ.\nDONDE TU ESTAS SEÑOR, ALLÍ ESTOY YO. TE SIGO SOY TU SERVIDOR (TU\nSERVIDOR, TU SERVIDOR).\nPadre, ha llegado la hora, glorifica tu nombre, en mi ser que se muere, para\nque seas tú el Rey."}, {"title": "SABER QUE VENDRÁS", "page": 86, "body": "DO    FA        DO-mim-lam  DO      FA       SOL-7 DO\nEn este mundo que Cristo nos da, hacemos la ofrenda del pan. El pan de\nFA       DO-mim-lam  DO    rem      SOL-7\nnuestro trabajo sin fin, el vino de nuestro cantar. Traigo ante Ti, nuestra\njusta inquietud: amar la justicia y la paz.\n  FA        SOL   DO mim     lam    FA         SOL\nSABER QUE VENDRÁS, SABER QUE ESTARÁS, PARTIENDO A LOS HOMBRES\n   DO/7\nTU PAN. (BIS)\nLa fe de todos los hombres sin luz la pena y el triste llorar. El odio de los\nque mueren sin fe cansados de tanto luchar. En la patena de nuestra\noblación acepta la vida Señor."}, {"title": "SAL DE TU TIERRA", "page": 86, "body": "DO   SOL    DO      SOL      lam  mim       lam\nEste mundo viejo necesita un giro ya. Muchos lo intentaron, nada en claro\n     mim     FA      SOL  DO      MI7          lam\nhan sacado. Hay quien ya está cansado y también nosotros, a veces,\n   FA        SOL-7\nperdemos la tensión. (bis)\nDO      SOL   FA  SOL    DO(7)\nSAL DE TU TIERRA TE DICE EL SEÑOR. NO MIRES AL SUELO NO HUYAS DE\nMI VOZ.\nFA     DO   MI7           lam  rem       DO    FA\nSAL DE TU TIERRA, DE LA MEDIOCRIDAD, AFIANZA TU CAYADO Y PONTE A\nSOL DO\nCAMINAR.\nNo te faltarán la angustia y el miedo, pero sabes que es más fuerte la razón\nque  te mueve. No  vas en  solitario, somos un pueblo en marcha\nconstruyendo el mañana. (bis)"}, {"title": "SALVA A TU PUEBLO", "page": 87, "body": "RE     sim       SOL         LA      RE      sim\nVen a salvar tu pueblo ¿Cuando lo harás Señor? Al pueblo, Dios al pueblo,\nSOL    DO  LA4-LA\npues hijos tuyos son.\nsim-fa#m  SOL-LA  sim-fa#m SOL-LA sim-fa#m SOL-fa#m MI\nTú los    trajiste     a este   mundo  y no los  puedes olvidar,\nSOL   RE (SOL-RE) SOL RE  (SOL-RE)\npues sin ti        perecerán.\nFA DO   LA4-LA\nSALVA TU PUEBLO.\nHan racionado el aire, han secuestrado el sol. Los ricos tienen todo menos\nnuestro dolor. ¡No! dice el cielo, no dice el mar, tanta injusticia ha de acabar,\ncese el dolor, venga la paz.\nSALVA TU PUEBLO.\nOh Dios, salva tu pueblo de todo este dolor. Al pueblo, Dios al pueblo, pues\nhijos tuyos son. Salva a tu pueblo de este dolor, dale a tu pueblo libertad,\nsálvalo, sálvalo.\nSALVA A TU PUEBLO. (DIOS SALVA A TU PUEBLO) X4\nVen a salvar tu pueblo...\nSALVA A TU PUEBLO. (DIOS SALVA A TU PUEBLO) X3\nRE SOL LA\nUh, Uh, Uh. SALVA A TU PUEBLO. X4"}, {"title": "SANTO", "page": 88, "body": "SOL-RE sim-LA SOL       RE   SOL       LA\nSANTO, SANTO, SANTO EL SEÑOR, DIOS DEL UNIVERSO.\nSOL-RE sim-LA   SOL      RE        mim          SOL\nSANTO, SANTO, EL CIELO Y LA TIERRA ESTÁN LLENOS DE TU INMENSA\nLA  RE\nGLORIA.\nSOL                                mim\nHosanna en lo alto del Cielo (Hosanna en lo alto del cielo). Hosanna en lo\n       LA\nalto del Cielo.\nSANTO, SANTO...\nLA      SOL          RE          LA\nBendito Aquel que viene en nombre del Señor.\nHosanna en lo alto del Cielo...\nSANTO, SANTO, SAAAANTO."}, {"title": "SANTO DE LOS POBRES", "page": 88, "body": "mim     DO        SI7\nSanto eres Señor, Dios de los pobres. (bis)\n        LA-SI7\nPorque llenas el cielo y la tierra, (el cielo y la tierra) de justicia y de paz, que\nes tu gloria de verdad.\n   MI       LA       fa#m        SI7\nHOSANNA, HOSANNA, HOSANNA EN EL CIELO. (BIS)\nBendito será quien venga en tu nombre. (bis)\nEn el nombre del Dios que da la vida, (del Dios que da la vida) a los\nhambrientos de tu pan y a quienes no saben amar.\nHOSANNA, HOSANNA, HOSANNA EN EL CIELO. (BIS)"}, {"title": "SANTO - Haendel", "page": 88, "body": "lam-rem SOL-DO FA         rem        MI lam-LA7\nSanto,  Santo,  Santo es el Señor, Dios del Universo. Llenos están el cielo\ny la tierra de tu Gloria, Hosanna.\nHOSANNA, HOSANNA, HOSANNA EN EL CIELO. (BIS)\nBendito el que viene en nombre del Señor, Hosanna en el Cielo, Hosanna."}, {"title": "SANTO - Señor Santo", "page": 89, "body": "MI          LA      MI-LA    MI        LA         SI7\nSeñor Santo Dios del universo, Tú. Llenos están cielo y tierra de tu Gloria.\n    LA           SI7            MI-do#m   LA    SI7  LA-lam-MI\nBendito aquel que viene en nombre del Señor. Hosanna en el cielo."}, {"title": "SANTO - Zaireño", "page": 89, "body": "DO   FA      DO-SOL-DO/SOL7\nSanto, Santo, Hosanna. (bis)\n  DO         FA   DO   FA    SOL     DO-SOL7\nHOSANNA EH, HOSANNA EH, HOSANNA, CRISTO JESÚS. (BIS)\nLos cielos y la tierra están llenos de tu Gloria Señor. Bendito el que viene en\nel nombre, en el nombre tuyo Señor.\nHOSANNA EH, HOSANNA EH, HOSANNA, CRISTO JESÚS. (BIS)"}, {"title": "SE MI LUZ", "page": 89, "body": "LA       RE              LA (MI-7)       RE-LA-MI7   LA\nSE MI LUZ (SE MI LUZ), ENCIENDE MI NOCHE. (X3) MI NOCHE, SE MI LUZ.\nfa#m     do#m       fa#m     do#m       fa#m     do#m\nEl camino sin ti es tan largo y tu llanto acoge mi dolor. Tu palabra acalla mi\n    fa#m       MI                 -7\nmiedo y tu grito se expresa en mi canto"}, {"title": "SEÑOR A QUIÉN IREMOS", "page": 89, "body": "SI7              MI   -LA                 LA-SI7-do#m\n¿SEÑOR, A QUIÉN IREMOS? SI TÚ ERES NUESTRA VIDA. ¿SEÑOR, A QUIÉN\n LA-SI7-LA                      SI7                     MI\nIREMOS? SI TÚ ERES NUESTRO AMOR, SI TÚ ERES NUESTRO AMOR.\ndo#m              SI  -LA     MI   fa#m            SI   SOL#M\nQuién como Tú conoce lo insondable de nuestro corazón. A quién como a\n   do#m-LA          MI-LA        SOL#M     MI       LA\nti le pesan nuestros dolores, nuestros errores. Quién podría amar cómo Tú\nfa#m      do#m LA            SI7\nnuestra carne débil,  nuestro barro frágil.\n¿SEÑOR, A QUIÉN IREMOS?...\nQuién como Tú confía en la mecha que humea en nuestro interior. Quién\ncomo Tú  sostiene  nuestra esperanza malherida  y  nuestros anhelos\ninsaciables. Quién como Tú espera nuestro sí de amor.\n¿SEÑOR, A QUIÉN IREMOS?..."}, {"title": "SEÑOR YAHVÉH", "page": 90, "body": "lam    FA      rem-MI     lam      FA        rem\nCon brazo fuerte y mano decidida, me arrancó de las garras de mi propia\n    MI\nsoledad. Alcé mis manos, grité a mis enemigos: \"Él será mi esperanza, Él\nserá mi claridad\". Mis piernas tiemblan, mi espíritu se agita, me agotó la\njornada, me agotó la realidad.\n   FA                 MI            FA                MI\n¿Y dónde?, ¿Y cuándo?, ¿Y cómo seguiré?, andando y luchando por algo que\n   MI7 FA            DO          FA            MI7\nno sé. ¿Cómo expresar con palabras, lo que quema en mi interior?\n  FA              DO                      MI-7\nLa sed que nunca saciaré hasta que vuelva a ti Señor Yahvéh.\n  lam FA MI    FA  MI lam\nSEÑOR YAHVÉH, SEÑOR YAHVÉH. (BIS)\nSu sombra guía mis pasos en el día, y su voz como un faro es vencedor de\noscuridad. Y mi pasado intenta todavía anclar mis pasos, pero Él me salvará.\nSu  nombre suena sobre la tormenta vencerá mis temores, el silencio\nacabará.\n¿Y dónde?, ¿Y cuándo?, ¿Y cómo aprenderé?, que existen dos caminos pero\nun solo caminar. Que aunque haya muchos ríos el agua siempre va a la\nmar. Con Él soy gota de agua mas tengo identidad. Mi mar, mi espacio y mi\nfecundidad"}, {"title": "SÉ QUE VOY CONTIGO", "page": 90, "body": "RE                 LA                mim        SOL\nSÉ QUE VOY CONTIGO, SÉ QUE ME ACOMPAÑAS, SÉ QUE TÚ ME QUIERES\n     LA -7  RE\nHAGA LO QUE HAGA. (BIS)\nSOL    LA          RE-SOL    LA       RE-7-SOL LA7   sim-fa#m\nEn tu presencia yo andaré todos los días de mi vida, y con gozo sentiré\nSOL     LA      RE-LA7\nque Tú jamás me olvidas.\nQUIERO SER TU AMIGO, QUIERO SER TU CASA, SER TU CONFIDENTE, SER\nDE TI, PALABRA. (BIS)\nConfiarme siempre en Ti, sabiendo que nunca fallas, y me trajiste a la vida\ntan sólo porque me amas."}, {"title": "SER UN HIJO DE MARÍA", "page": 91, "body": "DO-FA        DO                  SOL(SIbM) FA\nSer un hijo de María es arder en caridad, abrasar por donde pasa, llevando\n      SOL      DO\na  los hombres  la  paz. Apostar por  la  alegría  sin  dejar de  trabajar,\nprocurando el bien de todos, nada le hace echarse atrás.\nDO   DO7       FA                      SOL  lam\nEL EVANGELIO ES SU VIDA, LA VIDA UN CONTINUO LUCHAR, TESTIGO DEL\n /mim/   FA                     SOL\nAMOR DE CRISTO, PROFETA EN SU CAMINAR. (BIS)\nSer un hijo de María es optar por los demás, abrazando la esperanza de ver\nun mundo mejor. Es llevar a Cristo vivo en nuestro corazón, anunciando\nhumildemente su mensaje de Amor."}, {"title": "SIERVO POR AMOR", "page": 91, "body": "lam            DO                    SOL\nUna noche de sudor, con tu barca mar adentro, cuando comienza a\n     mim        FA        lam    DO\namanecer, aún siguen tus redes vacías; pero la voz que te llama un mar\n  SOL        DO-7     FA       DO       FA     SOL DO-MI\ndistinto te mostrará y en la ribera de cada corazón tus redes se posarán.\nDONA LA VIDA ENTERA COMO MARÍA AL PIE DE LA CRUZ Y SERÁS SIERVO\nDE CADA HOMBRE, SIERVO POR AMOR, SERVIDOR DE LA HUMANIDAD.\nAvanzabas en silencio, esperando con paciencia que el grano sembrado\npor ti cayese sobre buena tierra. Ahora tu corazón canta porque la espiga\napunta ya, ha madurado bajo el sol de la entrega y el dolor."}, {"title": "SIGUE HABIENDO", "page": 91, "body": "DO         mim           lam-SOL\nSigue habiendo tantos pies que lavar. Sigue habiendo tanta oscuridad que\n        FA     SOL         lam-LA7  rem       FA         SOL-7\niluminar. Tantas cadenas que romper. Pan y vino para el pobre quiero ser.\nSigue habiendo tantos pies que lavar. Sigue habiendo tanta oscuridad que\niluminar. Tantas cadenas que romper. Fortalece Señor mi poca fe."}, {"title": "SÍMBOLOS DE AMOR", "page": 92, "body": "RE      fa#m        sim          SOL     LA          RE\nEL PAN QUE COMPARTIMOS AL COMER Y EL VINO QUE COMPARTIMOS AL\n    -FA#M sim            SI7      mim         SOL\nBEBER, SON SÍMBOLOS DE UNIÓN, SON SÍMBOLOS DE AMOR, SON\nRE          sim         mim LA     RE\nSÍMBOLO DE LO QUE TÚ NOS ENSEÑAS­TE A SER.\n      RE         SOL       RE           sim       mim\nTú nos has ofrecido tu cuerpo y nos has ofrecido tu sangre como signo de\n        MI7               LA-7  RE            SOL    RE\nlo que nosotros debemos hacer. Ofreciendo nosotros la vida ayudando a\n        sim     mim      MI7      LA     LA7      RE-LA\nvivir a los otros ya podremos sentarnos contigo a comer y a beber.\nCon tu cruz construiste un camino, una forma distinta de vida, y nos pides\nque estemos contigo en tu forma de amar. Con tu sangre lavaste las dudas\nque surgieron en nuestro camino, y es tu vida la que nos enseña una nueva\namistad."}, {"title": "SI NO TENEMOS SUEÑOS", "page": 92, "body": "SOL          DO        SOL-DO SOL          DO\nSi no tenemos sueños no hacen falta locos. Si no tenemos sueños no hace\n    RE\nfalta fe.\n         mim-DO     mim-DO      mim     DO\n   Hazme soñar, haznos soñar. Soñar que tu Reino es palpable, que es\n      RE\n    verdad.                                 SOL  RE  SOL\n   Hazme confiar, haznos confiar. Que contigo nuestra vida renacerá."}, {"title": "SI QUIERES, TÚ PUEDES", "page": 93, "body": "RE             SOL\nTodo cambia de manera frenética. Todo pasa el tiempo vuela sin razón. Me\nhas dejado en esta tierra lunática. Te has marchado y no te he dicho ni un\n LA\nadiós.\n    SOL         LA        SOL     LA     SOL        FA#M\nPero sé que estás aquí, siento el eco de tu voz. Una fuerza que me quema\ncomo un sol.\nRE SOL    RE SOL    RE SOL          RE     SOL FA     SOL\nSI QUIERES, TÚ PUEDES, SI QUIERES, YO ESTARÉ SEGUIRÉ, HASTA EL FIN\n     RE\nSEGUIRÉ.\nVoy dejando atrás mi vida sabiendo que hoy mi mundo de otro modo\ngirará. Y  si caigo no me importa el porqué, Sé que cerca estás y me\nlevantarás.\nHoy tus sueños son los míos, tu camino mío será. Te prometo no dejarte\nnunca más.\nSI QUIERES...\nUna huella en la noche has dejado Tú. Una huella que no se cancelará. Tú\nle has dado a mi vida un porqué. Y tú sabes que por siempre quedará.\nIncreíble, sin más límite. Es la fuerza del amor que estalla en mí.\nSI QUIERES..."}, {"title": "SOLO POR TU AMOR", "page": 93, "body": "RE   SOL            RE     SOL             RE\nSolo por tu amor puedo, solo por tu amor comprendo, solo por tu amor...\n      SOL      sim  SOL     fa#m SOL      LA\nporque vivo enamorado, creo, doy y hago. Todo por amor. Solo por tu\nSOL(SIbM)-LA\namor.\nSolo en tu amor puedo, solo en tu amor comprendo, solo en tu amor...\nporque vivo enamorado, quiero soy y valgo todo en tu amor. Solo en tu\namor."}, {"title": "SOMOS UNA FAMILIA", "page": 94, "body": "RE                            LA7\nSomos una familia, un auténtico mogollón, una Iglesia divertida que donde\nSOL       LA7     RE\nvamos armamos la de Dios."}, {"title": "SOMOS UNA NUEVA CREACIÓN", "page": 94, "body": "LA        RE       LA           RE         MI-7 LA       RE\nSomos una nueva creación que no mira nunca en el ayer. El presente todo\n         LA            RE               LA         RE\nlo va a cambiar. El momento nunca hemos de perder, la justicia siempre ha\n      MI-7\nde vencer.\n       RE           MI        do#m-fa#m RE      MI\nY CANTAREMOS DANDO GRACIAS A LA VIDA, RECORRIENDO CADA\n     LA-7\nCORAZÓN COMPARTIREMOS ESA FUERZA QUE NOS GUÍA. CON LA ALEGRÍA\n            RE       MI-7\nDE VER A DIOS, DE VER A DIOS.\n       RE         MI   LA         RE      MI       LA-7\nCada mañana cuando sale el sol nace en la vida una nueva canción. Ya no\n    RE         MI        do#m        fa#m        RE\nhay dolores ni problemas, todo cambia en su presencia. Somos una nueva\n    MI-7\ncreación.\nY CANTAREMOS...\n          RE          do#m-RE     do#m-RE     MI     /LA/\nCON LA ALEGRIA DE VER A DIOS, DE VER A DIOS, DE VER A DIOS."}, {"title": "SUPREMO AMOR", "page": 95, "body": "MI           sol#m      LA         SI7         MI(7)\nHoy me toca definir, lo que hiciste al cambiar mi corazón. Tú usaste algo en\nmí, que es muy distinto a lo que el mundo llama amor.\nLA       SI7         MI    sol#m do#m\nEs más extenso, más profundo, más eterno. Es más sencillo, más tranquilo,\nmás completo. Todo lo abarca, todo comprende.\nLA        SI7  LA      SI7\nNunca se acaba y nunca muere.\n  MI                                  do#m\nSUPREMO AMOR, QUE ME ALCANZA Y ME SOSTIENE. SUPREMO AMOR,\n                                  LA\nQUE ME ARRASTRA Y QUE ME MUEVE. SUPREMO AMOR, QUE ME SANA Y\n               SI7\nFORTALECE. SUPREMO AMOR, EL DE HOY MAÑANA Y SIEMPRE.\nSUPREMO AMOR, QUE PERDONA Y QUE OLVIDA. SUPREMO AMOR, EL QUE\nSANA  MIS  HERIDAS. SUPREMO  AMOR, QUE ME  APOYA EN  MIS\nCAÍDAS.SUPREMO AMOR, QUE COMIENZA Y NO TERMINA.\nTú conoces todo en mí, mi fortaleza, mi pobreza y mucho más. Me tocaba a\nmí morir y sin embargo te pusiste en mi lugar.\nSin esperanza me encontré en muchos momentos. Aunque tardabas Tú\nllegabas  siempre  a  tiempo.  Para  abrazarme,  para  salvarme,  para\nenseñarme y conquistarme."}, {"title": "SURGIRÁ UN MUNDO NUEVO", "page": 96, "body": "DO                    SOL               DO\nSURGIRÁ UN MUNDO NUEVO LEVANTADO POR LA FUERZA DEL AMOR.\n                                 SOL               DO-7\nHECHO POR HOMBRES CON EL CORAZÓN ABIERTO AL ESPÍRITU DE DIOS. Y\n   FA                 DO                rem       SOL\nSU LEY SERÁ EL PERDÓN Y SU JUSTICIA EL AMOR, CON LA FUERZA DE SU FE\n       DO-SOL\nEN EL SEÑOR.\nDO            SOL           rem                    FA\nUn sólo Dios nos reúne en su paz derribando las murallas con que fuimos\n   SOL    DO            SOL         rem\nseparados. Un sólo bautismo, una misma fe. Por su Cruz Él ha vencido a la\nFA        rem     SOL           DO-SOL\nmuerte, ha creado en sí mismo un hombre nuevo.\nGente de toda raza, lengua y nación, formaremos este pueblo dedicado al\nSeñor sin esclavo ni libre, hombre ni mujer. Uno sólo es el Señor y Él nos\nune. Cantaremos las grandezas del Dios vivo."}, {"title": "TAN CERCA DE MÍ", "page": 96, "body": "DO SOL    DO-7 FA DO     SOL-7 DO DO7     FA      fam\nTAN CERCA DE MÍ, TAN CERCA DE MÍ, QUE HASTA LO PUEDO TOCAR,\nDO SOL    DO\nJESÚS ESTÁ AQUÍ.\nDO         FA         DO-7 FA      SOL        DO-7 rem\nYa no busco a Cristo en las alturas, ni le buscaré en la oscuridad. Dentro de\n  SOL DO-mim-lam  RE7                    SOL-7\nmi ser, en mi corazón, siento que Jesús conmigo está.\nTAN CERCA DE MÍ...\nYo le contaré lo que me pasa, como a mis amigos le hablaré. Yo no sé si es\nÉl quien habita en mí, o si soy yo quien habito en Él.\nTAN CERCA DE MÍ...\nMírale a tu lado, caminando, en las alegrías y el dolor. A tu lado va, siempre\nal caminar, Él es un amigo de verdad.\nTAN CERCA DE MÍ..."}, {"title": "TE AMO, SEÑOR", "page": 97, "body": "DO  SOL         lam     FA       SOL       DO-MIM-lam FA\nTe amo Señor, fortaleza mía. Roca mía, castillo mío, mi libertador. Dios mío\n  SOL     MI7    lam     FA           SOL           DO/SOL\nen ti, (solo en ti) confiaré. Mi escudo eres Tú y la fuerza de mi salvación."}, {"title": "TE DARÉ", "page": 97, "body": "FA solm FA solm SIbM lam     SOL\nTe daré, te daré, oh Señor, lo que hay en mí.\nmim     LA     mim     LA   rem     SOL7  DO\nPara verte siempre, adorarte siempre y seguirte siempre, te daré..."}, {"title": "TE DARÉ LO MEJOR", "page": 97, "body": "MI      LA         MI              SI\nTraemos hoy ante tu altar nuestras ofrendas. Queremos darte lo mejor de\nnuestras vidas.\nfa#m        do#m     fa#m                SI         -7\nTe entregaré mi amor eterno, los sueños que logre alcanzar.\n    do#m   LA       MI      do#m   LA         SI-7\nTE DARÉ LO MEJOR DE MI VIDA. TE DARÉ LO MEJOR CADA DÍA.\nSOL#M        -7            do#m       LA           fa#m\nSERÁ MUCHO MÁS QUE UNA CANCIÓN. MI OBEDIENCIA ES MI MEJOR\n  SI\nADORACIÓN.\nTraemos hoy ante tu altar nuestras ofrendas. Queremos darte lo mejor de\nnuestras vidas. Daremos solo las primicias, pues Tú mereces lo mejor.\nTE DARÉ LO MEJOR... (BIS)\nQueremos darte lo mejor de nuestras vidas."}, {"title": "TENGO FE EN TI", "page": 97, "body": "MI  do#m sol#m  LA      SI7     MI-7-LA   SOL#M  do#m-LA\nTengo fe en ti.     Envía tu Espíritu, Señor. Hazme dócil a tu voz.\n             fa#m         SI7\nQuiero obrar tan solo desde la fe."}, {"title": "TE SEGUIRÉ", "page": 98, "body": "LA RE        LA                  do#m fa#m\nTe seguiré a donde me lleves. Sin adelantarme sin forzar el paso.\n    sim           fa#m                RE         SI7      MI/7\nSabiamente ignorante, iré donde no sé. Puesto el corazón en ti te seguiré."}, {"title": "TODA LA VIDA", "page": 98, "body": "MI    LA         MI              LA         SI7\nToda la vida, Señor he consagrado a conocerte, amarte y servirte.\n          MI       LA        MI       LA            fa#m\nY ahora me pides que anuncie tu palabra y que todos puedan conocerte,\n SI7       MI\namarte y servirte."}, {"title": "TODO ACABA BIEN", "page": 98, "body": "RE7    SOL                      LA          RE         RE7\nSi un día ves que todo va mal, que todo va tan requete mal: tu mujer grita,\nllora, la casa se te desploma;\nSOL         mim            LA                 RE7\nchillan los niños, duelen las muelas, llueven las letras hasta aquí.\n       SOL                      LA\nEl jefe te dice \"Adiós mon amí\" y el pobre Job tan mal lo pasó.\n     DO dom  SOL         mim DO  RE      SOL\nPor eso tú, jamás olvides que hay un cielo y que todo acaba bien.\n\nTú sufres al ver cómo sin cesar crecen sin parar ricachones, que sin respirar\nven multiplicar y centuplicar sus millones, y mientras que tú tienes que\nsudar para conquistar la peseta algunos ya tienen la panza repleta.\nPero  si después piensas sin pasión y con detención las cosas, pronto\naprenderás que al terminar lo que va a contar solo es lo que has amado,\nporque al otro lado, ya ves: todo acaba bien.\nNo os sintáis apenados. ¿VES? TODO ACABA BIEN\nLas injusticias serán reparadas. ¿VES? TODO ACABA BIEN\nAlguien tenía que estar oprimido. ¿VES? TODO ACABA BIEN"}, {"title": "TODO ES DE MI CRISTO", "page": 99, "body": "SIb     DO    rem\nTodo es de mi Cristo, por Él y para Él (bis).\n         SIB-DO        FA   DO rem        SIB-DO      rem\nA Él sea la Gloria, a Él sea la Glooo-ooo-ria, a Él sea la Gloria, Cristo Jesús."}, {"title": "TODO ESTÁ EN TU ADENTRO", "page": 99, "body": "RE   SOL   RE-fa#m-sim          LA\nNada has pensado que no puedas hacer. Nada has soñado imposible de\nver.\n      SOL        sim SOL      LA    RE-FA#M\nNi en el mar ni en el cielo: Nada está lejos de ti.\nsim           RE     MI7         LA  SOL LA    RE\nTodo está en tu adentro. Todo puedes hacerlo si te fías de mí."}, {"title": "TODOS LOS DONES", "page": 99, "body": "MI        sim   RE          LA      MI      FA#M\nEl aire que respiro, el pan que me alimenta, la risa de los niños, el\nlam         MI              sim     RE         LA      sol#m\nresplandor del sol. El canto de las aves, los besos de una madre, la brisa del\n fa#m  FA#M     SI7\notoño, el gozo de soñar.\nMI    do#m RE    MI      do#m    RE  do#m    sol#m do#m\nTODOS ESOS DONES NOS LOS ENVÍA EL SEÑOR, DESDE EL CIELO, DESDE\n  sol#m MI-do#m   RE\nEL CIELO, LLENOS DE AMOR.\nMil gracias, buen maestro, por lo que nos has dado: el sol, el agua, el grano,\nla vida, el universo. Desde nuestra pobreza nada podemos darte, mas te lo\nagradecemos de todo corazón.\nTODOS ESTOS DONES...\nGRACIAS DE VERDAD, SEÑOR / TODOS ESOS DONES (X3)\nGRACIAS, SEÑOR."}, {"title": "TÓMAME", "page": 100, "body": "RE-fa#m-mim    LA7        RE-fa#m-mim      LA7      fa#m-mim-LA7(RE)\nTÓMAME, EN TUS MANOS CUÍDAME, JESÚS, QUE MI VIDA ES PARA TI (BIS).\nSOL-fa#m-mim\nTú, solo Tú (bis)."}, {"title": "TÚ AL CENTRO", "page": 100, "body": "mim                     SOL sim                DO lam\nNecesito encontrarte en mi corazón, encontrarte a Ti, estar junto a Ti. Única\n              mim DO       RE sim      mim  DO\nreferencia de mi caminar. Única razón Tú, único apoyo Tú. Al centro de mi\n    RE          SOL\ncorazón existes solo Tú.\nAún el cielo gira en torno y no tiene paz, pero existe un punto pequeño,\naquel de allá. La estrella polar fija está sola. La estrella polar Tú, la estrella\nsegura Tú. Al centro de mi corazón existes solo Tú.\n      sim         DO             sim-mim    sim\nTODO GIRA EN TORNO A TI, EN FUNCION DE TI. YA NO IMPORTA EL CÓMO,\n  DO             RE\nEL DÓNDE NI EL POR QUÉ.\nQue tu resplandezcas siempre en mi corazón, el significado ahora serás Tú.\nLo único que haré será solamente amar. Único apoyo Tú, la estrella polar\nTú. Al centro de mi corazón existes solo Tú."}, {"title": "TÚ, MI PILAR", "page": 100, "body": "DO                     SOL         lam        SOL\nMantendré los oídos abiertos, los ojos atentos. Hoy te elijo, hoy te consagro\n          DO        -mim   lam\npara que estés siempre en mí. Mi corazón estará siempre en ti. Mis ojos\nFA              SOL-7\nestarán siempre en ti. (Bis)\nDO                     lam               FA    -rem\nTÚ, MI PILAR, SOSTÉN DE MI VIDA. APOYO EN MIS DUDAS, LUZ DE MI\n  SOL-7 DO                       lam\nCAMINO. TÚ, MI PILAR, TRANSFORMA MI ALMA.\n                 FA-fam         DO/7\nTRAE PAZ, TRÁEME CALMA ESPERO EN TI. (BIS)"}, {"title": "TU MODO", "page": 101, "body": "LA           MI       RE-MI-/7/-LA\nJesús al contemplar en tu vida el modo que Tú tienes de tratar a los demás.\nMe dejo interpelar por tu ternura, tu forma de amar nos mueve a amar. Tu\ntrato es como el agua cristalina que limpia y acompaña el caminar.\nLA     do#m      sim       MI               /MI7/        LA\nJESÚS ENSÉÑAME TU MODO DE HACER SENTIR AL OTRO MÁS HUMANO.\nQUE TUS PASOS SEAN MIS PASOS, MI MODO DE PROCEDER.\nJesús  hazme  sentir  con  tus  sentimientos.  Mirar  con  tu  mirada,\ncomprometer mi acción. Donarme hasta la muerte por el reino, defender la\nvida hasta la cruz. Amar a cada uno como amigo y en la oscuridad llevar tu\nluz.\nJESÚS ENSÉÑAME TU MODO DE HACER SENTIR AL OTRO MÁS HUMANO.\nQUE TUS PASOS SEAN MIS PASOS, MI MODO DE PROCEDER.\nDO                  SOL              FA-SOL-/7/-DO\nJesús yo quiero ser compasivo con quien  sufre, buscando  la  justicia,\ncompartiendo nuestra fe. Que encuentre una auténtica armonía entre lo\nque creo y quiero ser. Mis ojos sean fuente de alegría que abrace tu\nmanera de ser.\nDO     mim      rem      SOL            /SOL7/      DO\nJESÚS ENSÉÑAME TU MODO DE HACER SENTIR AL OTRO MÁS HUMANO.\nQUE TUS PASOS SEAN MIS PASOS, MI MODO DE PROCEDER.\nLA\nQuisiera conocerte, Jesús tal como eres. Tu imagen sobre mí es lo que\ntransformará mi corazón en uno como el tuyo, que sale de sí mismo para\ndar, capaz de amar al padre y los hermanos, que va sirviendo al reino en\nlibertad.\nJESÚS ENSÉÑAME TU MODO DE HACER SENTIR AL OTRO MÁS HUMANO.\nQUE TUS PASOS SEAN MIS PASOS, MI MODO DE PROCEDER.\nMI    LA     do#m RE-MI-MI7-LA\nEnséñame tu modo, Señor."}, {"title": "TU PERDÓN", "page": 102, "body": "MI             sol#m-LA    SI7       MI\nEn tus brazos, me he dormido, al compás de cada beso. Y al susurro de un:\n  sol#m-LA      sol#m    fa#m       SI7           MI\nte quiero, me has forzado dulcemente, dulcemente me he rendido.\nTanto amor se ha desbordado que no cabe en estas letras, pero queda la\ncerteza de saber que tu perdón es mayor que mi pecado."}, {"title": "TÚ, SOLO TÚ", "page": 102, "body": "DO               lam           FA               SOL(7)\nBuscando en lo más profundo de mi corazón; buscando en él su mejor y\ngran razón hoy me he dado cuenta cuál es mi mayor razón de ser.\nDejándome ya de engañar y quitando esas cosas que han querido estorbar,\nsiendo sincero, siendo real, solamente Tú has quedado.\nFA      SOL    DO  mim(MI) lam     FA         SOL        LA\nTÚ, SOLO TÚ, ERES MI RAZÓN DE SER (BIS). TÚ YAHVEH, SEÑOR YAHVEH.\n   RE                sim                  SOL            LA\nQuitando por  fin esas cosas que tanto han estorbado entre Tú y yo.\nLimpiando de plano de vi vida el escenario. Solo Tú puedes actuar en mí.\nDejándome ya de engañar y quitando esas cosas que han querido ocupar,\ntu lugar, tu primer lugar en mí, solamente Tú has quedado.\nSOL     LA     RE   fa#m(M) sim    SOL         LA\nTÚ, SOLO TÚ, ERES MI RAZÓN DE SER (BIS). TÚ YAHVEH, SEÑOR YAHVEH."}, {"title": "TÚ, VOZ DE MI CANTO", "page": 103, "body": "RE                SOL          RE\nUna luz que cada día mis senderos iluminan, Tú. El aliento en mi camino y\n    SOL                 sim-SI7\nen la noche eres mi abrigo, Tú.\n     mim                   SOL                  LA\nLa esperanza en los temores, la caricia en los dolores, el Amor de los\namores.\nRE   SOL                 RE   sim           SOL  mim\nTÚ, LA VOZ DE MIS CANCIONES, TÚ; EL PAN DE CADA DÍA, TÚ; MI ÚNICO\n         LA\nBIEN ERES TÚ.\nPlenitud de la alegría, el Señor que da la vida, Tú. Una voz dentro del alma,\nque susurra y me da calma, Tú.\nLa respuesta a mis pasiones y la fuerza en mis acciones, Corazón de\ncorazones.\nTÚ, LA VOZ DE MIS CANCIONES, TÚ; EL PAN DE CADA DÍA, TÚ; MI ÚNICO\nBIEN ERES TÚ.\n  RE    SOL    LA     RE       sim                  MI7\nJESÚS, RESPIRO DE MI CORAZÓN, QUE CARGAS SIEMPRE CON MI CRUZ, Y\nSOL                   LA          FA-SOL-RE\nQUE ME INUNDAS CON TU LUZ. (BIS) TÚ SOLO, TÚ."}, {"title": "UBI CARITAS", "page": 103, "body": "DO SOL lam   FA-LA7-RE-SOL\nUbi caritas   et amor.\nDO SOL lam  FA  SOL DO/SOL\nUbi caritas   Deus ibi est."}, {"title": "UNA SOLA CONVICCIÓN", "page": 104, "body": "RE                           SOL\nCuraremos aquellas heridas insanables, saltaremos aquellos baches\n            sim                         DO\ninsaltables, desacorazaremos las corazas de los corazones, romperemos\nSIbM         LA\nmuchos, tantos moldes.\nSubiremos montañas tan altas e imposibles, moveremos las losas tan\ninamovibles, optimizaremos toda opción optando  al optimismo, para\nlevantar al que ha caído.\nPegaremos aquellos platos que rompimos, limpiaremos aquellas manchas\nque lucimos, ya pasará eso que pasaba que pausaba cada paso, no sabrás\npor qué andarás andando...\n      SOL      solm\ncon una sola convicción:\nFA           SIbM           FA           SIbM\nSOLO EL AMOR TODO LO PUEDE. SOLO EL AMOR TODO LO VENCE.\nrem          LA7              SIbM         LA7\nSOLO EL AMOR TODO LO AGUANTA. SOLO EL AMOR TODO LO SANA.\nRE       SOL-sim-SOL-RE\nSOLO EL AMOR…\nFirmaremos tratados de paces impensables, llegaremos a metas tan\ninalcanzables, saldremos salerosos y saltando salas sin salida, abriendo las\nventanas a la vida.\nNos sacaremos de algunos quicios  insolentes, nadaremos  mil  ríos a\ncontracorriente, verás videntes a invidentes y decentes a indecentes,\ncuando tantos imposibles vuelen... con una sola convicción:\nSOLO EL AMOR..."}, {"title": "UN DERROCHE DE PERDÓN", "page": 104, "body": "DO  SOL        DO-SOL\nUn derroche de perdón (un derroche de perdón), un derroche de tu amor\n(un derroche de tu amor),\nFA   SOL       MI-lam FA   SOL      DO\nnos regalas con tu vida, y lo esperamos oh, Señor."}, {"title": "UNO DEL OTRO", "page": 105, "body": "SOL               FA           DO                   SOL\nVeremos los pueblos, leeremos la historia, amaremos la patria uno del otro.\nMás allá de las lenguas, más allá de las razas, amaremos el credo uno del\notro.\nSOL    DO-FA\nUNO DEL OTRO, UNO DEL OTRO (BIS)\nCompartiendo esperanzas, dividiendo dolores, abrazando el camino uno\ndel otro.\nOlvidando el pasado, las heridas lejanas, construir el futuro uno del otro."}, {"title": "VALE LA PENA SEGUIR", "page": 105, "body": "LA                     RE           LA  fa#m\nAunque todo esto termine, y no nos veamos más, la esperanza aquí nacida,\nRE             MI fa#m           do#m RE             LA\nnunca, nunca morirá. Aunque grises sean los días,  o tengamos vendaval,\n                 MI   sim    SI7       MI-7\nni los truenos, ni los rayos, la esperanza matará.\nLA    RE         LA         RE          MI7       LA     RE\nUNOS TIENEN LA MIRADA, OTROS HACEN DE MOTOR, Y A NOSOTROS SE\n    LA  RE    LA    MI7  LA\nNOS PIDE QUE SEAMOS CORAZÓN. VALE LA PENA SEGUIR, VALE LA PENA\nLUCHAR, SI NO PARAN NUESTRAS VIDAS, LA ESPERANZA NO MORIRÁ.\nAunque viva en nuestra mente la pena de un pobre amor, lucharemos cada\ninstante por que siempre sea mejor. Como un niño ama a su madre, y a la\ntierra ama la flor, habrá esperanza en nosotros si vivimos el amor."}, {"title": "VEN", "page": 105, "body": "LA           MI            RE            MI fa#m\nVen, no apartes de mí los ojos. Te llamo a ti, te necesito para que se cumpla\n     RE      MI       LA\nen el mundo el plan de mi Padre."}, {"title": "VEN, ESPÍRITU DE DIOS", "page": 106, "body": "RE    SOL    RE  SOL             LA         sim SOL     LA\nVen, Espíritu de Dios, amor que quema el corazón más frío. Colma de vida a\nRE   fa#m sim SOL       mim        LA\nquién esté vacío y pon tu música a nuestra oración. (Bis)\n SOL     LA          RE\nY ponle alas a nuestra canción."}, {"title": "VENGO AQUÍ, MI SEÑOR", "page": 106, "body": "RE SOL-LA-RE\nVENGO AQUÍ, MI SEÑOR\n       RE              LA7  mim             sim SOL  mim\n   A olvidar las prisas de mi vida. Ahora sólo importas Tú, dale tu paz a mi\n   LA7\n    alma.\n   A que en mí lo transformes todo en nuevo. Ahora sólo importas Tú, dale\n    tu paz a mi alma.\n   A encontrarme con tu paz, que me serena. Ahora sólo importas Tú, dale\n    tu paz a mi alma."}, {"title": "VENID CONMIGO", "page": 106, "body": "RE            fa#m        sim        SOL   LA\nVenid, venid conmigo a un lugar tranquilo y descansad en mi vuestro\n   RE      SOL     FA#M    sim         SOL\ncansancio. Dejad que os cure las heridas que el trabajo por el Reino os ha\n  LA      SOL       LA         sim         SOL\ndejado. Reponed con mi pan vuestras fuerzas, con mi Vino alegrad el\n    LA\ncorazón.\nY ahora, venid…"}, {"title": "VENTE A LA MONTAÑA", "page": 107, "body": "lam                              -rem\nVente a la montaña que allí está el Señor, seguro has de verlo muy cerca de\nlam MI                 lam       MI                       FA\nti,  en el árbol seco o en la jara en flor. Vente a la montaña que allí está el\nMI lam\nSeñor.\nMI                  lam                MI\nVENTE A LA MONTAÑA, VENTE A LA MONTAÑA, VENTE A LA MONTAÑA QUE\n       FA-MI-lam\nALLÍ ESTÁ EL SEÑOR. (BIS)\nVas a ver a Cristo al sentir el calor y al llegar la noche tú has de tiritar. El frío\nde la sierra te va a hacer palpar ese amargo frío que hay en tu interior.\nVENTE A LA MONTAÑA...\nPero tus amigos y los que no son van a dar tu imagen donde tienes amor.\nNo lo dudes, caminante amigo, vente a la montaña que allí está el Señor.\nVENTE A LA MONTAÑA...\nCuando le descubras con sed y dolor sabrás de ese Cristo que nadie te\nhabló. Tu vida será una punta de lanza y no habrá lugar donde no hables\nde Dios.\nVENTE A LA MONTAÑA..."}, {"title": "VENTE A LA VIDA", "page": 107, "body": "DO                FA             SOL             FA     SOL\nViniste de la calle herido de corazón, buscando paso a paso estar cada vez\nDO\nmejor.\nTras de mucha oscuridad una luz se te encendió. Te dijiste: “esto es lo\nnuestro, esto es salir del marrón”.\n      FA             DO         lam      rem      SOL\nBienvenido a esta familia, Tu nueva comunidad, donde seguimos luchando\n  DO      DO7     FA           /fam/     DO-mim-lam\nbuscando felicidad; donde todos somos uno, donde hay sinceridad, donde\nrem        SOL      FA   SOL DO\ntodos nos queremos y te vamos a ayudar.\n       DO                           FA\nCAMBIA LA CARA, CURA TU HERIDA; ESTA ES TU CASA Y TU FAMILIA.\n         SOL             FA             DO/SOL7\nÁNIMO, HERMANO; ÁNIMO, HERMANA. ¡VENTE A LA VIDA!"}, {"title": "VEN Y SÁLVANOS", "page": 108, "body": "lam   MI  lam rem lam  MI   lam\nEl pueblo gime de dolor, VEN Y SÁLVANOS.\nA Dios levanta su clamor, VEN Y SÁLVANOS.\nlam rem  lam     MI    lam\nOYE PADRE EL GRITO DE TU PUEBLO.\nOYE, CRISTO, VEN Y SÁLVANOS.\nEl pueblo está en la esclavitud, VEN Y SÁLVANOS.\nEl pueblo clama libertad, VEN Y SÁLVANOS. OYE...\nMoisés será el libertador, VEN Y SÁLVANOS.\nSu brazo es fuerza del Señor, VEN Y SÁLVANOS. OYE...\nEl pueblo empieza a caminar, VEN Y SÁLVANOS.\nVencida queda la opresión, VEN Y SÁLVANOS. OYE...\nLa marcha es dura, ciega el sol, VEN Y SÁLVANOS.\nSe acerca ya la redención, VEN Y SÁLVANOS. OYE..."}, {"title": "¡VIVA DIOS!", "page": 108, "body": "MI  fa#m sol#m SI7\n¡Viva Dios!   ¡Viva Dios!\nMI  fa#m-do#m-LA-SI7-MI\n¡Viva Dios!        ¡Viva Dios!\n(Combinar con \"Preparad el camino al Señor\")"}, {"title": "¡VIVE!", "page": 109, "body": "DO   SOL                      lam       mim         FA\n¡VIVE! TODO EL MUNDO CANTA A LA VIDA HAY UN PADRE QUE DA VIDA A\n              DO           rem-SOL7\nTODO AQUELLO QUE EXISTE EN EL UNIVERSO.\n¡VIVE! DIOS AMOR ES FUENTE DE VIDA, DIOS DE LA INMENSIDAD, DIOS QUE\nCADA HOMBRE SIENTE A SU LADO.\nDO             FA      DO                 FA\nViento que las olas mueve, rompiendo la calma del mar y el sol que vibra en\n  DO                                                FA\nel azul. Parece que hay centellas de luz que juegan con la espuma y libres\n        DO             mim         FA rem      DO\nsiguen la canción. Danzando con el viento en un rondó, vestidas de satén.\n            mim     FA  rem   SOL\nVolando sobre espacios sin edad cantan a un mundo que... ¡VIVE!...\nMira este cielo grande al alba de la ciudad cada día oigo su voz, me dice\nque hay alguien allá, Padre de todos que extiende así sus manos y abraza\ncon su amor la humanidad. Un pueblo, una nación que late con un nuevo\n                             LA\ncorazón, almas de un mundo que... un mundo que...\nRE-LA7 sim-fa#m   SOL          RE                mim-LA\n¡VIVE! ¡VIVE!       DIOS QUE CADA HOMBRE SIENTE A SU LADO. ¡VIVE!..."}, {"title": "VOSOTROS SERÉIS MI PUEBLO", "page": 110, "body": "lam             RE            FA  mim    lam     FA-SOL-mim\nLa gente de todo el pueblo, en el destierro se dispersó, se sintió\n   lam\nsin pastor. El dolor, la lejanía, a todos ellos hizo creer que Dios les olvidó.\n         FA    SOL     FA       MI          lam  FA-SOL\nY en su tristeza, decían: ¿Tendrás de nosotros compasión? Y Dios les\n      LA\nrespondió.\n       LA  RE      fa#m      sim    RE    MI-7    LA    RE\nOs reuniré de entre los pueblos, vendréis de todo lugar. Os daré un solo\nMI  LA       sol#m do#m RE      MI-7      LA      RE MI LA\ncorazón, y un espíritu nuevo os haré llegar. Arrancaré el corazón de piedra\n          RE          MI-7  RE      MI    LA      RE   DO#M\ny os daré de carne un corazón. Vosotros seréis mi pueblo. Vosotros seréis\n   fa#m-MI-RE  MI       RE-rem-LA\nmi pueblo. Y yo seré vuestro Dios."}, {"title": "VUELVO A TI", "page": 111, "body": "LA              MI            mim   FA#7       sim\nVuelvo a ti, porque siento que llenas mi alma de paz, y no hay nada en el\n       -RE           MI         RE                 LA\nmundo que me pueda aliviar. Porque solo me encuentro a mi mismo en\n           MI       RE             LA               MI\nrespuestas vacías. Tú me das el impulso a seguir, Tú me das la alegría.\nVuelvo a ti, porque ya me cansé de buscar por mi cuenta. El camino no es\nfácil, dar pasos me cuesta.\n      RE          DO# fa#m        RE        LA\nPorque nunca he podido sin ti,  dar lo mejor de mi. Hoy mis fuerzas no\n        -RE           MI\nalcanzan, pero Tú estás aquí.\n        LA  RE           LA   RE       fa#m\nVUELVO A TI SEÑOR, VUELVO A TI, MI DIOS. OTRA VEZ ME PERDÍ PERO\nRE          MI          LA   RE          LA-DO#-fa#m\nQUIERO REGRESAR. VUELVO A TI SEÑOR, VUELVO A TI, MI DIOS. PORQUE\nRE              LA        DO#     DO#7      fa#m\nERES MI ÚNICA CERTEZA, PORQUE CREO EN TI AUNQUE ANOCHEZCA. HOY\n     RE      fa#m sim   MI      LA\nTE ENTREGO EL CORAZÓN SI TÚ ERES AMOR.\nVuelvo a  ti, porque Tú has sido fiel y eso a veces se me olvida. Porque\nsiempre has estado presente en mi vida. Con tus brazos abiertos saliste a\nmi encuentro, Señor. Te agradezco tu misericordia, te pido perdón.\nVuelvo a ti, porque ya me cansé...\nVUELVO A TI SEÑOR...\n         RE      fa#m sim        DO#        fa#m\nHOY TE ENTREGO EL CORAZÓN, HOY TE ENTREGO EL CORAZÓN,\n         RE      fa#m sim      MI    LA\nHOY TE ENTREGO EL CORAZÓN, SI TÚ ERES AMOR."}, {"title": "Y ALABÁNDOTE", "page": 112, "body": "rem                DO      rem\n¿Cómo podré agradecer tanta bendición? ¿Cómo podré responder a tu\nDO       rem             SIB       rem              SIB\namor? Levantando mis manos Señor, declarando que Tú eres Dios\n   rem     DO       SIB        LA7\ny dejándome llevar por el soplo de tu amor.\n    rem  DO         rem     SIB        LA7    rem\nY ALABÁNDOTE, Y ALABÁNDOTE, Y ALABÁNDOTE SEÑOR, MI DIOS. (BIS)\nQuiero adorarte Señor desde el corazón y descalzarme ante ti, Santo Dios.\nTu perfume me inunda Señor, tu presencia esta dentro de mí y tu Gracia se\nderrama por todo este lugar."}, {"title": "Y COMPRENDÍ", "page": 112, "body": "DO           SOL      lam               FA      SOL\nSoy todo un caso, ya me ves, y estoy solo, solo en mi desconcierto. Pero ¿y\nTú, Señor, a quién siempre busqué? No te niego que me das algo de miedo.\nDO         SOL      lam FA  DO  FA  SOL7\nHace sólo unos días cumplí 16, 16 fracasos, 16 lamentos...\n       DO          SOL                  lam\nY COMPRENDÍ: QUE EN REALIDAD ESTE MUNDO ES PEQUEÑO Y LA\n   FA                DO       FA           DO\nDISTANCIA ENTRE EL CIELO Y EL SUELO SE ME ESTRECHÓ AL ALZAR LA VOZ\n      FA               SOL(7)                DO\nY CON SOLO ELEVAR LA MIRADA (BIS), CON ELEVAR LA MIRADA.\nHoy Señor te encontré, me dices cosas que aun no comprendo. Pero me\ngusta porque yo también busqué una respuesta a mis sentimientos.\nHace sólo unos días cumplí 16, 16 fracasos, 16 intentos..."}, {"title": "YO CELEBRARÉ", "page": 112, "body": "lam     mim-FA              FA-SOL  mim         lam\nYO CELEBRARÉ DELANTE DEL SEÑOR. CANTARÉ UN CANTO NUEVO. (BIS)\nlam  FA      SOL          lam\nYo le alabaré, porque Él ha hecho grandes cosas. (bis)"}];
const norm=s=>s.replace(/[‐‑‒–—−]/g,'-');
const chordUnit='(?:SOL|DO|RE|MI|FA|LA|SI|[A-G])(?:#|b)?(?:maj|min|sus|dim|aug|add|m|M|º|°|\\+)?(?:-?[0-9]+)?(?:\\((?:SOL|DO|RE|MI|FA|LA|SI|[A-G]|[0-9]+)\\))?(?:\\/(?:SOL|DO|RE|MI|FA|LA|SI|[A-G]|[0-9]+))?';
const chordRE=new RegExp('^'+chordUnit+'$','i');
function isChord(t){t=norm(t).replace(/^[,;:.]+|[,;:.]+$/g,'');if(!t)return false;const parts=t.replace(/^-/, '').split(/-(?=(?:SOL|DO|RE|MI|FA|LA|SI|[A-G]))/i);return parts.length>0&&parts.every(x=>chordRE.test(x));}
function rowChord(t){const arr=t.trim().split(/\s+/).filter(Boolean);if(!arr.length)return false;const hits=arr.filter(isChord).length;return hits>0 && (hits===arr.length || (hits/arr.length>=.65&&hits>=2));}
function chordSpans(text){const segments=text.match(/\s+|\S+/g)||[];return segments.map(s=>({text:s,chord:!/^\s+$/.test(s)&&isChord(s)}));}
function makeBlocks(body){const lines=String(body||'').replace(/\r/g,'').split('\n');const out=[];for(let i=0;i<lines.length;i++){const a=lines[i];if(rowChord(a)&&lines[i+1]&&lines[i+1].trim()&&!rowChord(lines[i+1]))out.push([{text:a,chord:true},{text:lines[++i],chord:false}]);else out.push([{text:a,chord:rowChord(a)}]);}return out;}
// Split both aligned lines at the same character; never inside a chord token.
function safeBreak(block,pos){const c=block.find(x=>x.chord)?.text||'';return !(pos>0&&pos<c.length&&!/\s/.test(c[pos-1])&&!/\s/.test(c[pos]));}
function chunks(block,cols){const len=Math.max(...block.map(x=>x.text.length));if(!len)return [block];const res=[];let s=0;while(s<len){let e=Math.min(len,s+cols);if(e<len){let found=0;const lyric=block.find(x=>!x.chord)?.text||'';for(let p=e;p>=s+Math.floor(cols*.4);p--)if(safeBreak(block,p)&&(p>=lyric.length||p===0||/\s/.test(lyric[p-1])||/\s/.test(lyric[p]))){found=p;break;}if(!found)for(let p=e;p>s;p--)if(safeBreak(block,p)){found=p;break;}if(!found)for(let p=e+1;p<=len;p++)if(safeBreak(block,p)){found=p;break;}if(found)e=found;}if(e<=s)e=len;res.push(block.map(x=>({text:x.text.slice(s,e),chord:x.chord})));s=e;}return res;}
function paged(body,cols,rows){const result=[],blocks=makeBlocks(body).flatMap(b=>chunks(b,cols));let page=[],n=0;for(const block of blocks){if(n&&n+block.length>rows){result.push(page);page=[];n=0;}page.push(...block);n+=block.length;}if(page.length||!result.length)result.push(page);return result;}
let index=0,page=0,font=18;const $=id=>document.getElementById(id);
function render(){const paper=$('paper'),song=songs[index];const usable=paper.clientWidth-16;const cols=Math.max(12,Math.floor(usable/(font*.605)));const rows=Math.max(4,Math.floor((paper.clientHeight-12)/(font*1.40)));const pages=paged(song.body,cols,rows);page=Math.min(page,pages.length-1);paper.replaceChildren();paper.style.fontSize=font+'px';for(const line of pages[page]){const div=document.createElement('div');div.className='line';for(const seg of chordSpans(line.text)){const span=document.createElement('span');span.textContent=seg.text;span.className=line.chord&&seg.chord?'chord':'';div.appendChild(span);}paper.appendChild(div);}$('heading').textContent=song.title;$('count').textContent=(page+1)+' / '+pages.length;$('songSelect').value=index;$('prev').disabled=index===0&&page===0;$('next').disabled=index===songs.length-1&&page===pages.length-1;window.__atrilTest={songs:songs.length,renderedLines:paper.children.length,pages:pages.length,index,page,redSpans:paper.querySelectorAll('.chord').length};}
const sel=$('songSelect');sel.replaceChildren();songs.forEach((song,i)=>{const o=document.createElement('option');o.value=i;o.textContent=song.title;sel.appendChild(o)});sel.onchange=()=>{index=+sel.value;page=0;render()};$('smaller').onclick=()=>{font=Math.max(12,font-2);page=0;render()};$('bigger').onclick=()=>{font=Math.min(28,font+2);page=0;render()};$('next').onclick=()=>{const data=window.__atrilTest;if(page+1<data.pages)page++;else if(index<songs.length-1){index++;page=0;}render()};$('prev').onclick=()=>{if(page>0)page--;else if(index>0){index--;page=0;render();page=window.__atrilTest.pages-1;}render()};window.addEventListener('resize',render);requestAnimationFrame(render);
</script></body></html>
