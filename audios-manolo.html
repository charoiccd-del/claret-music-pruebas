<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Audios · Claret Music</title><style>
*{box-sizing:border-box}body{margin:0;background:#fffaf5;color:#242424;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:780px;margin:auto;padding:20px 18px max(35px,env(safe-area-inset-bottom))}h1{font-size:27px;margin:22px 0 8px}h2{font-size:21px;margin-top:28px;color:#ad3c17}.back{display:inline-block;text-decoration:none;color:#b8421d;background:#fff0e3;padding:12px 16px;border-radius:12px;font-weight:700}p{line-height:1.5}.muted{color:#806e65;font-size:14px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}input,select{font:inherit;padding:14px;border-radius:14px;border:1px solid #eaded4;background:white;min-width:0}input{flex:2 1 240px}select{flex:1 1 210px}.track{background:white;padding:18px;border:1px solid #f0dfd1;border-radius:16px;margin:12px 0;box-shadow:0 2px 5px #8d6c5908}.track h3{margin:0 0 5px;font-size:18px}.track p{margin:4px 0 14px}audio{display:block;width:100%;min-height:44px}.error{color:#a32b20}a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffb52b;outline-offset:3px}
</style></head><body><main class="app"><a class="back" href="./">← Inicio</a><h1>🎧 Audios</h1><p>Manolo Ogalla CMF</p><p class="muted">Escucha las canciones de A voces, Yubal y Pasa la Voz.</p><div class="filters"><input id="search" type="search" placeholder="Buscar canción…" aria-label="Buscar canción"><select id="album" aria-label="Elegir cancionero"><option value="">Todos los cancioneros</option></select></div><p id="count" class="muted" aria-live="polite"></p><div id="tracks"></div></main><script>
'use strict';
const tracks=[{"title":"El murmullo del río","album":"A voces","file":"ogalla_1_01.mp3","track":1,"duration":206},{"title":"Mirando al margen","album":"A voces","file":"ogalla_1_02.mp3","track":2,"duration":293},{"title":"Desde entonces","album":"A voces","file":"ogalla_1_03.mp3","track":3,"duration":274},{"title":"La del canalla","album":"A voces","file":"ogalla_1_04.mp3","track":4,"duration":180},{"title":"A oscuras","album":"A voces","file":"ogalla_1_05.mp3","track":5,"duration":224},{"title":"Hoy","album":"A voces","file":"ogalla_1_06.mp3","track":6,"duration":249},{"title":"Tan solo una mirada","album":"A voces","file":"ogalla_1_07.mp3","track":7,"duration":226},{"title":"A voces","album":"A voces","file":"ogalla_1_08.mp3","track":8,"duration":254},{"title":"Simplemente te quiero","album":"A voces","file":"ogalla_1_09.mp3","track":9,"duration":248},{"title":"Soneto de un viaje","album":"A voces","file":"ogalla_1_10.mp3","track":10,"duration":102},{"title":"Ven","album":"Yubal - Algo nuevo está brotando","file":"ogalla_2_01.mp3","track":1,"duration":157},{"title":"Tú te empeñas","album":"Yubal - Algo nuevo está brotando","file":"ogalla_2_02.mp3","track":2,"duration":207},{"title":"Aleluya","album":"Yubal - Algo nuevo está brotando","file":"ogalla_2_03.mp3","track":3,"duration":96},{"title":"Mira mis manos","album":"Yubal - Algo nuevo está brotando","file":"ogalla_2_04.mp3","track":4,"duration":107},{"title":"Santo de los pobres","album":"Yubal - Algo nuevo está brotando","file":"ogalla_2_05.mp3","track":5,"duration":122},{"title":"Paz","album":"Yubal - Algo nuevo está brotando","file":"ogalla_2_06.mp3","track":6,"duration":140},{"title":"Cada día algo más fiel","album":"Yubal - Algo nuevo está brotando","file":"ogalla_2_07.mp3","track":7,"duration":105},{"title":"Al partir el pan","album":"Yubal - Algo nuevo está brotando","file":"ogalla_2_08.mp3","track":8,"duration":249},{"title":"Ave María","album":"Yubal - Algo nuevo está brotando","file":"ogalla_2_09.mp3","track":9,"duration":107},{"title":"Gloria de Resurrección","album":"Pasa la Voz","file":"ogalla_3_01.mp3","track":1,"duration":198},{"title":"Ven Espíritu","album":"Pasa la Voz","file":"ogalla_3_02.mp3","track":2,"duration":134},{"title":"Pasa la voz","album":"Pasa la Voz","file":"ogalla_3_03.mp3","track":3,"duration":232},{"title":"Un derroche de perdón","album":"Pasa la Voz","file":"ogalla_3_04.mp3","track":4,"duration":97},{"title":"Sólo tienes que soñar","album":"Pasa la Voz","file":"ogalla_3_05.mp3","track":5,"duration":294},{"title":"Tu perdón","album":"Pasa la Voz","file":"ogalla_3_06.mp3","track":6,"duration":104},{"title":"Oración de Claret","album":"Pasa la Voz","file":"ogalla_3_07.mp3","track":7,"duration":116},{"title":"Es Navidad","album":"Pasa la Voz","file":"ogalla_3_08.mp3","track":8,"duration":255}];
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const search=document.getElementById('search'),album=document.getElementById('album'),list=document.getElementById('tracks');
for(const name of [...new Set(tracks.map(t=>t.album))]){const o=document.createElement('option');o.value=o.textContent=name;album.appendChild(o)}
const rows=[];
for(const name of [...new Set(tracks.map(t=>t.album))]){
 const section=document.createElement('section'),heading=document.createElement('h2');heading.textContent=name+' - Manolo Ogalla CMF';section.appendChild(heading);list.appendChild(section);
 for(const track of tracks.filter(t=>t.album===name)){
  const row=document.createElement('article');row.className='track';const title=document.createElement('h3');title.textContent=track.title;
  const note=document.createElement('p');note.className='muted';note.textContent='Manolo Ogalla CMF · '+Math.floor(track.duration/60)+':'+String(track.duration%60).padStart(2,'0');
  const audio=document.createElement('audio');audio.controls=true;audio.preload='none';audio.src=track.file;audio.setAttribute('aria-label','Escuchar '+track.title);
  audio.addEventListener('play',()=>document.querySelectorAll('audio').forEach(other=>{if(other!==audio)other.pause()}));
  audio.addEventListener('error',()=>{if(!row.querySelector('.error')){const warning=document.createElement('p');warning.className='error';warning.textContent='No se pudo cargar el audio. Comprueba la conexión e inténtalo de nuevo.';row.appendChild(warning)}});
  row.append(title,note,audio);section.appendChild(row);rows.push({track,row,section,audio});
 }
}
function filter(){let count=0;for(const {track,row,audio} of rows){const visible=(!album.value||track.album===album.value)&&norm(track.title).includes(norm(search.value));row.hidden=!visible;if(!visible)audio.pause();else count++}for(const section of list.children)section.hidden=![...section.querySelectorAll('article')].some(r=>!r.hidden);document.getElementById('count').textContent=count+' audios'}
search.addEventListener('input',filter);album.addEventListener('change',filter);window.addEventListener('pagehide',()=>document.querySelectorAll('audio').forEach(a=>a.pause()));filter();
</script></body></html>
