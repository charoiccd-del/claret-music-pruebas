function paginate(lines,cols,rows){const gs=groups(lines).flatMap(g=>parts(g,cols));let pages=[],p=[];for(const g of gs){if(p.length&&p.length+g.length>rows){pages.push(p);p=[];}p.push(...g);}if(p.length||!pages.length)pages.push(p);return pages;}

 if(!hasChord(line) || !lines[i+1] || hasChord(lines[i+1])) return line;
 const out=[]; const rx=/\S+/g; let match;
 while((match=rx.exec(line.text))){
   let target=Math.round(match.index*0.56);
   if(out.length){const last=out[out.length-1];target=Math.max(target,last.pos+last.word.length+1);}
   out.push({pos:target,word:match[0]});
 }
 if(!out.length)return line;
 const width=Math.max(...out.map(x=>x.pos+x.word.length));
 const chars=Array(width).fill(' '),red=Array(width).fill(0);
 for(const x of out)for(let j=0;j<x.word.length;j++){chars[x.pos+j]=x.word[j];red[x.pos+j]=1;}
 return {text:chars.join('').replace(/ +$/,''),red};
});}
function render(){const paper=$('paper');const cw=paper.clientWidth-10,ch=paper.clientHeight-10;const cols=Math.max(12,Math.floor(cw/(size*.615))),rows=Math.max(4,Math.floor(ch/(size*1.38)));const pages=paginate(correctedLines(songs[idx].lines),cols,rows);lastCount=pages.length;page=Math.max(0,Math.min(page,pages.length-1));paper.style.fontSize=size+'px';paper.replaceChildren();for(const line of pages[page]){const div=document.createElement('div');div.className='line';for(let i=0;i<line.text.length;){const isChord=!!line.red[i];let j=i+1;while(j<line.text.length&&!!line.red[j]===isChord)j++;const span=document.createElement('span');span.className='glyph'+(isChord?' chord':'');span.textContent=line.text.slice(i,j);div.appendChild(span);i=j;}paper.appendChild(div);}$('heading').textContent=songs[idx].title;$('count').textContent=(page+1)+' / '+pages.length;$('pick').value=idx;$('prev').disabled=idx===0&&page===0;$('next').disabled=idx===songs.length-1&&page===pages.length-1;}
for(let i=0;i<songs.length;i++){const opt=document.createElement('option');opt.value=i;opt.textContent=songs[i].number+'. '+songs[i].title;$('pick').appendChild(opt);}
$('atrilBtn').onclick=()=>{const on=document.body.classList.toggle('atril-on');$('atrilBtn').textContent=on?'✕ Salir del atril':'🎸 Modo atril';$('atrilBtn').setAttribute('aria-pressed',String(on));render()};$('pick').onchange=e=>{idx=Number(e.target.value);page=0;render()};$('search').oninput=e=>{const q=e.target.value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();$('pick').replaceChildren();songs.forEach((s,i)=>{if(s.title.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().includes(q)){$('pick').add(new Option(s.number+'. '+s.title,i));}});if($('pick').options.length){idx=Number($('pick').options[0].value);page=0;render();}};$('sm').onclick=()=>{size=Math.max(12,size-2);page=0;render()};$('bg').onclick=()=>{size=Math.min(25,size+2);page=0;render()};$('next').onclick=()=>{if(page<lastCount-1)page++;else if(idx<songs.length-1){idx++;page=0;}render()};$('prev').onclick=()=>{if(page>0)page--;else if(idx>0){idx--;page=0;render();page=lastCount-1;}render()};window.addEventListener('resize',render);requestAnimationFrame(render);
</script></body></html>
